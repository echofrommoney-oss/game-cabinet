<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遊戲櫃</title>
<meta name="description" content="一櫃風格、玩法、技術都不一樣的 HTML5 小遊戲，打開就能玩。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 一座遊戲櫃——上方是櫃名與篩選列，下方是同尺寸的卡帶，每格的編號與技術標籤對齊在同一條基線 */
:root{
  --bg:#e9ebf0; --panel:#f7f8fa; --ink:#171a24; --muted:#5b6070; --line:#cfd3dc;
  --accent:#2f43e8; --deep:#c2412d;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141b; --panel:#1b1e28; --ink:#eceef4; --muted:#9aa0b2; --line:#2c3040;
  --accent:#8a98ff; --deep:#ff8a73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141b; --panel:#1b1e28; --ink:#eceef4; --muted:#9aa0b2; --line:#2c3040;
  --accent:#8a98ff; --deep:#ff8a73; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding-block:40px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:28px}
header{display:grid;grid-template-columns:auto 1fr;gap:12px 32px;align-items:end}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,11vw,128px);line-height:.9;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.lede{margin:0;max-width:52ch;color:var(--muted);font-size:15px;text-wrap:pretty}
.lede b{color:var(--ink);font-weight:700}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--f-mono);font-size:12px;color:var(--muted);
  border-top:1px solid var(--line);padding-top:12px;letter-spacing:.02em}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:500 13px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:1fr} header{grid-template-columns:1fr}}
.card{display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid var(--line);
  color:inherit;text-decoration:none;overflow:hidden;min-width:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.shot{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .shot img{transform:scale(1.04)}
.no{font:800 13px var(--f-display);color:var(--accent);letter-spacing:.04em}
.head{display:flex;align-items:baseline;gap:10px}
.badge{position:absolute;right:10px;top:10px;font:700 11px var(--f-body);letter-spacing:.08em;color:#fff;background:var(--deep);padding:3px 8px}
.body{display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;padding:14px 16px 16px;min-width:0}
.body h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
.body p{margin:0;font-size:14px;color:var(--muted)}
.kind{font-size:12.5px;color:var(--ink);opacity:.8}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-family:var(--f-mono);font-size:11px}
.tags span{border:1px solid var(--line);padding:1px 7px;color:var(--muted)}
.tags .time{margin-left:auto;border:0;padding:0;color:var(--ink);font-variant-numeric:tabular-nums}
.card[hidden]{display:none}
.shot .ph{display:grid;place-items:center;width:100%;height:100%;font:800 40px var(--f-display);color:var(--muted)}
.empty{grid-column:1/-1;color:var(--muted);font-size:14px}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){.card,.shot img{transition:none}.card:hover{transform:none}.card:hover .shot img{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>遊戲<span>櫃</span></h1>
    <p class="lede">一櫃風格、玩法、技術都不一樣的 HTML5 小遊戲。每一個都是單一網頁，打開就能玩，桌機與手機都支援。標「長篇」的要 10 分鐘以上，其餘 3–5 分鐘。只想快速看過的話，進遊戲後網址加上 <code>?demo=1</code> 會直接播精華。</p>
    <div class="meta"><span id="count">— GAMES</span><span>CANVAS · WEBGL · DOM · SVG · WEB AUDIO</span><span>所有圖像與聲音皆由程式即時產生</span></div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="依類型篩選"></div>

  <main class="grid" id="grid"></main>

  <footer>
    <span>字型來自 Google Fonts，載不到時改用系統字型。函式庫：Three.js r174、Matter.js、cannon-es、GSAP。</span>
    <span>遊戲內所有角色、店名、品牌皆為自創。</span>
  </footer>
</div>

<script>
// 遊戲清單來自 games.json（由 scripts/build-games.mjs 掃描各資料夾的 game.json 產生），這裡不寫死任何遊戲
const TAG_LABELS={canvas:"Canvas 2D",webgl:"WebGL / 3D",dom:"DOM / CSS",svg:"SVG",audio:"聲音玩法",long:"長篇"};
const grid=document.getElementById('grid');
const filters=document.getElementById('filters');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(games){
  document.getElementById('count').textContent=`${games.length} GAMES`;
  grid.innerHTML=games.map((g,i)=>{
    const no=String(i+1).padStart(2,'0');
    const shot=g.thumb?`<img src="${esc(g.thumb)}" alt="${esc(g.title)} 遊戲畫面" loading="lazy" width="1200" height="750">`:`<span class="ph">${no}</span>`;
    return `<a class="card" href="${esc(g.dir)}/" data-tags="${esc(g.tags.join(' '))}">
 <div class="shot">${shot}${g.long?'<span class="badge">長篇</span>':''}</div>
 <div class="body"><div class="head"><span class="no">${no}</span><h2>${esc(g.title)}</h2></div><span class="kind">${esc(g.kind)}</span><p>${esc(g.desc)}</p>
 <div class="tags"><span>${esc(g.tech)}</span><span class="time">${esc(g.time)}</span></div></div></a>`;
  }).join('');

  // 篩選按鈕依實際出現的標籤產生；已知標籤照 TAG_LABELS 順序，新標籤排在後面
  const used=[...new Set(games.flatMap(g=>g.tags))];
  const known=Object.keys(TAG_LABELS);
  used.sort((a,b)=>(known.indexOf(a)+1||99)-(known.indexOf(b)+1||99));
  filters.innerHTML=['all',...used].map(t=>`<button type="button" data-f="${esc(t)}" aria-pressed="false">${esc(t==='all'?'全部':TAG_LABELS[t]||t)}</button>`).join('');

  const btns=[...filters.querySelectorAll('button')];
  function apply(f){
    btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===f)));
    grid.querySelectorAll('.card').forEach(c=>{c.hidden=!(f==='all'||c.dataset.tags.split(' ').includes(f))});
    try{localStorage.setItem('cabinet-filter',f)}catch(e){}
  }
  btns.forEach(b=>b.addEventListener('click',()=>apply(b.dataset.f)));
  let cur='all';try{cur=localStorage.getItem('cabinet-filter')||'all'}catch(e){}
  if(!btns.some(b=>b.dataset.f===cur))cur='all';
  apply(cur);
}

fetch('games.json',{cache:'no-cache'})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(render)
  .catch(()=>{grid.innerHTML='<p class="empty">讀不到 games.json。本機預覽請先執行 <code>npm run dev</code>。</p>'});
</script>
</body>
</html>
