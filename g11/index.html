<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>桌上的貓</title>
<meta name="description" content="主人出門了。你是一隻貓，90 秒內把桌上的東西一件件推下去。黏土質感 3D 小品。">
<meta name="theme-color" content="#d9c6b1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f4ebdf; --cream2:#eadccb; --milk:#d9c6b1; --tea:#b08d6e; --cocoa:#5a4335; --ink:#3f3029;
  --ginger:#d99a5e; --rose:#c9786a; --sage:#93a68a; --sky:#9fb2c4; --warn:#c2553f;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --num:"Fredoka","Noto Sans TC",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c6b1;color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .16 0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 45%,transparent 55%,rgba(70,45,30,.28) 100%)}
#warnGlow{position:fixed;inset:0;pointer-events:none;display:none;
  background:radial-gradient(130% 110% at 50% 50%,transparent 62%,rgba(194,85,63,.32) 100%)}
button{font-family:var(--font);color:inherit}
.clay{background:var(--cream);border-radius:22px;
  box-shadow:0 2px 0 rgba(255,255,255,.7) inset,0 -4px 0 rgba(150,115,85,.18) inset,0 10px 24px rgba(90,60,40,.22),0 2px 4px rgba(90,60,40,.18)}
.btn{appearance:none;border:0;cursor:pointer;font-weight:900;font-size:19px;letter-spacing:.06em;padding:14px 30px;border-radius:999px;
  background:var(--ginger);color:#fff8ef;text-shadow:0 1px 0 rgba(120,60,20,.35);
  box-shadow:0 2px 0 rgba(255,235,210,.6) inset,0 -5px 0 rgba(140,70,25,.28) inset,0 7px 0 #a8683a,0 12px 22px rgba(90,50,25,.3);
  transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(255,235,210,.6) inset,0 -3px 0 rgba(140,70,25,.28) inset,0 2px 0 #a8683a,0 4px 10px rgba(90,50,25,.3)}
.btn.ghost{background:var(--cream2);color:var(--cocoa);text-shadow:none;box-shadow:0 2px 0 rgba(255,255,255,.7) inset,0 -4px 0 rgba(150,115,85,.2) inset,0 6px 0 #c2a98f,0 10px 18px rgba(90,60,40,.2)}
.btn:focus-visible,.ibtn:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* top-right */
#tr{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:10px;z-index:30}
.ibtn{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:var(--cream);color:var(--cocoa);
  box-shadow:0 2px 0 rgba(255,255,255,.75) inset,0 -3px 0 rgba(150,115,85,.22) inset,0 4px 0 #c6ad93,0 8px 16px rgba(90,60,40,.22);transition:transform .12s}
.ibtn:active{transform:translateY(3px)}
.ibtn svg{width:22px;height:22px}
#btnPause{display:none}
body.playing #btnPause{display:grid}

/* HUD */
#hud{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:10;display:none}
body.playing #hud{display:block}
#scoreCard{position:fixed;left:14px;top:max(12px,env(safe-area-inset-top));padding:9px 18px 10px;min-width:150px}
#scoreCard .lbl{font-size:12px;font-weight:700;color:#8a6d58;letter-spacing:.12em}
#score{font-family:var(--num);font-weight:700;font-size:34px;line-height:1.05;color:var(--cocoa);font-variant-numeric:tabular-nums}
#score.bump{animation:bump .28s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
#combo{position:absolute;left:0;top:calc(100% + 8px);padding:6px 14px 8px;width:150px;opacity:0;transform:translateY(-6px) scale(.9);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);background:var(--ginger);color:#fff8ef}
#combo.on{opacity:1;transform:none}
#comboTxt{font-weight:900;font-size:16px;letter-spacing:.06em}
#comboTxt b{font-family:var(--num);font-size:20px}
#combo .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:4px;overflow:hidden}
#comboBar{display:block;height:100%;width:100%;background:#fff6ea;border-radius:9px;transform-origin:left center}
#clockWrap{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#clock{width:76px;height:76px;border-radius:50%;position:relative;display:grid;place-items:center}
#clock svg{position:absolute;inset:6px;width:64px;height:64px;transform:rotate(-90deg)}
#clock circle{fill:none;stroke-width:7;stroke-linecap:round}
#time{font-family:var(--num);font-weight:700;font-size:26px;color:var(--cocoa);position:relative;font-variant-numeric:tabular-nums}
#clock.hurry{animation:hurry .5s ease-in-out infinite alternate}
#clock.hurry #time{color:var(--warn)}
@keyframes hurry{to{transform:scale(1.08)}}
#leftTag{font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px;background:rgba(244,235,223,.85);color:#7b604d;box-shadow:0 3px 8px rgba(90,60,40,.15);white-space:nowrap}
#warn{position:fixed;left:50%;top:150px;transform:translate(-50%,-10px);opacity:0;padding:10px 20px;font-weight:900;font-size:17px;color:#fff8ef;background:var(--warn);border-radius:99px;white-space:nowrap;
  box-shadow:0 -3px 0 rgba(0,0,0,.15) inset,0 5px 0 #8f3a2a,0 10px 20px rgba(90,30,20,.3);transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);display:flex;gap:10px;align-items:center}
#warn.on{opacity:1;transform:translate(-50%,0)}
#warn svg{width:22px;height:22px}
#warn.on svg{animation:step .5s steps(2) infinite}
@keyframes step{50%{transform:translateY(-3px) rotate(-8deg)}}
#pops{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:12}
.pop{position:absolute;left:0;top:0;will-change:transform}
.pop .in{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);animation:popIn 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
.pop b{font-family:var(--num);font-weight:700;font-size:30px;color:#fff8ef;-webkit-text-stroke:6px var(--cocoa);paint-order:stroke fill;line-height:1}
.pop.big b{font-size:40px;color:#ffe2b8}
.pop .tags{display:flex;gap:5px;margin-top:4px}
.pop .tags span{font-size:13px;font-weight:900;padding:3px 9px;border-radius:99px;background:var(--rose);color:#fff;box-shadow:0 3px 0 rgba(90,40,30,.35)}
.pop .tags span.c{background:var(--sage)}
.pop .tags span.x{background:var(--ginger)}
.pop.meow .in{font-weight:900;font-size:22px;color:var(--cocoa);background:#fffaf2;padding:6px 14px;border-radius:18px 18px 18px 4px;box-shadow:0 4px 0 rgba(120,90,60,.25)}
@keyframes popIn{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.12)}30%{transform:translate(-50%,-90%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(.95)}}

/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.ov.on{display:flex}
#title{background:linear-gradient(90deg,rgba(217,198,177,.55),rgba(217,198,177,0) 70%)}
#titleCard{width:min(440px,100%);padding:30px 32px 28px;position:relative;margin-right:auto;margin-left:6vw;animation:cardIn .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.95)}}
.kicker{font-size:13px;font-weight:700;letter-spacing:.3em;color:#a07f66}
h1{margin:4px 0 6px;font-size:54px;font-weight:900;letter-spacing:.08em;color:var(--cocoa);line-height:1.1;display:flex;align-items:center;gap:12px}
h1 svg{width:46px;height:46px;flex:none;transform:rotate(-14deg)}
.lead{font-size:16px;line-height:1.7;color:#6b5243;margin:0 0 16px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center;font-size:14px;color:#6b5243;margin-bottom:16px;padding:14px 16px;border-radius:16px;background:var(--cream2)}
.keys{display:flex;gap:4px;flex-wrap:wrap}
.key{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 7px;border-radius:8px;background:#fffaf3;font-family:var(--num);font-weight:700;font-size:13px;color:var(--cocoa);box-shadow:0 -2px 0 rgba(150,115,85,.25) inset,0 3px 0 #c9b39b}
.only-touch{display:none}
body.touch .only-touch{display:grid}
body.touch .only-desk{display:none}
.tip{font-size:13px;color:#9a7b65;margin:0 0 18px;display:flex;gap:8px;align-items:center}
.tip svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#bestTxt{font-size:14px;color:#8a6d58;font-weight:700}
#bestTxt b{font-family:var(--num);font-size:18px;color:var(--cocoa)}
#pause{background:rgba(90,65,50,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#pauseCard{padding:28px 34px;text-align:center;animation:cardIn .4s cubic-bezier(.2,1.3,.4,1) both}
#pauseCard h2{margin:0 0 18px;font-size:30px;color:var(--cocoa);letter-spacing:.1em}
#pauseCard .row{justify-content:center}
#result{justify-content:flex-end;align-items:center;padding:20px 5vw 20px 20px}
#resCard{width:min(420px,100%);padding:24px 28px 24px;max-height:calc(100% - 20px);overflow:auto;animation:cardIn .7s cubic-bezier(.2,1.3,.4,1) both}
#resCard .kicker{color:#b06a50}
#quote{font-size:22px;font-weight:900;color:var(--cocoa);margin:6px 0 4px;line-height:1.4}
#resSub{font-size:13px;color:#9a7b65;margin-bottom:12px}
#resScore{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px}
#resNum{font-family:var(--num);font-weight:700;font-size:60px;line-height:.95;color:var(--cocoa);font-variant-numeric:tabular-nums}
#newBest{font-size:13px;font-weight:900;color:#fff;background:var(--rose);padding:4px 10px;border-radius:99px;margin-bottom:8px;display:none;animation:wob 1s ease-in-out infinite alternate}
@keyframes wob{to{transform:rotate(-5deg) scale(1.06)}}
#rank{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:16px;color:#fff8ef;background:var(--sage);padding:6px 14px;border-radius:99px;margin:4px 0 14px;box-shadow:0 4px 0 #6f8268}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--cream2);border-radius:14px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--num);font-size:22px;color:var(--cocoa)}
.stat span{font-size:11px;color:#8a6d58;font-weight:700}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;min-height:10px}
.chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:#fffaf3;color:#7b604d;box-shadow:0 2px 0 #d8c4ad}
.chip.brk{background:#f6dcd3;color:#9b4a38;box-shadow:0 2px 0 #dfb0a2}
#bestLine{font-size:13px;color:#8a6d58;margin-top:12px}

/* touch controls */
#touch{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
#stickZone{position:absolute;left:0;bottom:0;width:55%;height:62%;pointer-events:auto;touch-action:none}
#stick{position:fixed;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:rgba(244,235,223,.35);border:3px solid rgba(255,250,242,.65);box-shadow:0 6px 18px rgba(90,60,40,.2);transition:opacity .2s}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--cream);box-shadow:0 2px 0 #fff inset,0 -4px 0 rgba(150,115,85,.25) inset,0 5px 0 #c6ad93,0 8px 14px rgba(90,60,40,.25)}
.tbtn{position:absolute;pointer-events:auto;border:0;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff8ef;touch-action:none;
  box-shadow:0 2px 0 rgba(255,235,210,.55) inset,0 -5px 0 rgba(0,0,0,.14) inset,0 6px 0 var(--sh),0 12px 20px rgba(90,50,25,.28);transition:transform .08s}
.tbtn.down{transform:translateY(5px);box-shadow:0 2px 0 rgba(255,235,210,.55) inset,0 -3px 0 rgba(0,0,0,.14) inset,0 1px 0 var(--sh),0 4px 8px rgba(90,50,25,.28)}
#btnPaw{right:22px;bottom:calc(46px + var(--safe-b));width:104px;height:104px;background:var(--ginger);--sh:#a8683a;font-size:15px}
#btnPaw svg{width:44px;height:44px;margin-bottom:-6px}
#btnPaw span,#btnJump span{display:flex;flex-direction:column;align-items:center}
#btnJump{right:136px;bottom:calc(30px + var(--safe-b));width:70px;height:70px;background:var(--sage);--sh:#6f8268;font-size:15px}
#back{position:fixed;left:12px;bottom:calc(8px + var(--safe-b));z-index:40;font-size:12px;color:#7b604d;text-decoration:none;background:rgba(244,235,223,.7);padding:4px 10px;border-radius:99px;font-weight:700}
#back:hover{background:var(--cream)}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:#d9c6b1;font-weight:900;color:var(--cocoa);font-size:18px;letter-spacing:.2em;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
body.soft #grain,body.soft #vig{display:none}

@media (max-width:700px){
  #titleCard{margin:auto auto 10px;padding:22px 20px 20px}
  #title{background:linear-gradient(0deg,rgba(217,198,177,.7),rgba(217,198,177,0) 75%);align-items:flex-end}
  h1{font-size:40px}
  h1 svg{width:36px;height:36px}
  .lead{font-size:14.5px;margin-bottom:12px}
  .ctl{font-size:13px;padding:10px 12px;margin-bottom:12px}
  .tip{margin-bottom:14px}
  #scoreCard{min-width:0;padding:7px 13px 8px;left:10px}
  #score{font-size:26px}
  #combo{width:120px}
  #clockWrap{left:auto;right:124px;transform:none}
  #clock{width:62px;height:62px}
  #clock svg{inset:5px;width:52px;height:52px}
  #time{font-size:21px}
  #leftTag{font-size:12px}
  #warn{top:126px;font-size:15px;padding:8px 16px}
  #result{align-items:flex-end;justify-content:center;padding:10px 10px calc(34px + var(--safe-b))}
  #resCard{padding:16px 18px 18px;max-height:58%}
  #quote{font-size:18px}
  #resNum{font-size:46px}
  .stat b{font-size:18px}
  #chips{margin-bottom:12px}
  #bestLine{margin-top:8px}
}
@media (max-height:560px){ #titleCard{padding:16px 22px} h1{font-size:36px} .ctl{margin-bottom:8px} .lead{margin-bottom:8px} }
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;transition-duration:.01s!important}
  .pop .in{animation:popRM 1.4s linear forwards!important}
  @keyframes popRM{0%,85%{opacity:1;transform:translate(-50%,-90%)}100%{opacity:0;transform:translate(-50%,-90%)}}
}
</style>
<script type="importmap">{"imports":{"three":"../lib/three.module.min.js","three/addons/":"../lib/three-addons/","../lib/three.core.min.js":"../lib/three-addons/three.core.min.js"}}</script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="遊戲畫面"></canvas>
<div id="vig"></div><div id="grain"></div><div id="warnGlow"></div>

<div id="hud" aria-live="polite">
  <div id="scoreCard" class="clay"><div class="lbl">搗蛋分數</div><div id="score">0</div>
    <div id="combo" class="clay"><div id="comboTxt">連擊 <b>×2</b></div><div class="bar"><i id="comboBar"></i></div></div>
  </div>
  <div id="clockWrap">
    <div id="clock" class="clay"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" stroke="#eadccb"/><circle id="clockArc" cx="32" cy="32" r="27" stroke="#d99a5e" stroke-dasharray="169.6" stroke-dashoffset="0"/></svg><span id="time">90</span></div>
    <div id="leftTag">桌上還有 16 件</div>
  </div>
  <div id="warn"><svg viewBox="0 0 24 24" fill="#fff8ef"><ellipse cx="8" cy="15" rx="3.2" ry="5"/><ellipse cx="16" cy="9" rx="3.2" ry="5"/><circle cx="8" cy="22" r="1.6"/><circle cx="16" cy="16" r="1.6"/></svg><span>門外有腳步聲……主人要回來了！</span></div>
</div>
<div id="pops"></div>

<div id="tr">
  <button id="btnPause" class="ibtn" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="2"/><rect x="13.8" y="5" width="4.2" height="14" rx="2"/></svg></button>
  <button id="btnSound" class="ibtn" aria-label="聲音開關"><svg id="sndIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
</div>

<div id="touch">
  <div id="stickZone"><div id="stick"><div id="knob"></div></div></div>
  <button id="btnJump" class="tbtn" aria-label="跳"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff8ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>跳</span></button>
  <button id="btnPaw" class="tbtn" aria-label="伸爪"><span><svg viewBox="0 0 48 48" fill="#fff8ef"><ellipse cx="24" cy="31" rx="10" ry="8.5"/><ellipse cx="12" cy="20" rx="4.2" ry="5.4"/><ellipse cx="19.5" cy="13" rx="4.2" ry="5.6"/><ellipse cx="28.5" cy="13" rx="4.2" ry="5.6"/><ellipse cx="36" cy="20" rx="4.2" ry="5.4"/></svg>爪子</span></button>
</div>

<div id="title" class="ov">
  <div id="titleCard" class="clay">
    <div class="kicker">主人出門了</div>
    <h1><svg viewBox="0 0 48 48" fill="#d99a5e"><ellipse cx="24" cy="31" rx="10" ry="8.5"/><ellipse cx="12" cy="20" rx="4.2" ry="5.4"/><ellipse cx="19.5" cy="13" rx="4.2" ry="5.6"/><ellipse cx="28.5" cy="13" rx="4.2" ry="5.6"/><ellipse cx="36" cy="20" rx="4.2" ry="5.4"/></svg>桌上的貓</h1>
    <p class="lead">這張桌子，現在是你的了。<br>主人回來之前，把東西一件一件推下去。</p>
    <div class="ctl only-desk">
      <span class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></span><span>走動（方向鍵也行）</span>
      <span class="keys"><span class="key">空白鍵</span></span><span>伸爪，往面向的方向推</span>
      <span class="keys"><span class="key">Shift</span></span><span>跳，落地會震動周圍</span>
    </div>
    <div class="ctl only-touch">
      <span class="keys"><span class="key">左半</span></span><span>拖曳虛擬搖桿走動</span>
      <span class="keys"><span class="key">爪子</span></span><span>往面向的方向推</span>
      <span class="keys"><span class="key">跳</span></span><span>跳起來，落地會震動周圍</span>
    </div>
    <p class="tip"><svg viewBox="0 0 24 24" fill="#c9786a"><circle cx="12" cy="12" r="10"/><rect x="11" y="6" width="2.4" height="8" rx="1.2" fill="#fff"/><circle cx="12.2" cy="17.4" r="1.4" fill="#fff"/></svg>易碎物有破壞加成；撞倒別的東西算連鎖。最後 10 秒聽門口。</p>
    <div class="row"><button id="btnStart" class="btn">開始搗蛋</button><span id="bestTxt"></span></div>

  objs: () => objs.map(o => ({ type: o.type, x: o.body.position.x, y: o.body.position.y, z: o.body.position.z, fallen: o.fallen })),
  skip(sec) { G.timeLeft = Math.min(G.timeLeft, sec); },

};
