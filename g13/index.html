<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>桌角對決</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{
  --p0:#FF4F8B; --p0d:#E02F6E; --p0l:#FFB3CE;
  --p1:#17C9BE; --p1d:#0C9F96; --p1l:#A6F0EA;
  --yel:#FFD23F; --pur:#7D5CFF; --org:#FF8A3D; --red:#FF3B3B;
  --ink:#151515; --cream:#FFF4DB; --paper:#FFFDF6;
  --cjk:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK JP",sans-serif;
  --num:"Bungee","Arial Black","Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font-family:var(--cjk);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
kbd{font-family:var(--num);font-size:.78em;line-height:1;display:inline-block;min-width:1.6em;text-align:center;background:var(--yel);color:var(--ink);
  border:2px solid var(--ink);border-radius:6px;padding:3px 5px 2px;margin:0 2px;box-shadow:2px 2px 0 var(--ink);vertical-align:.08em}

/* ---------- 版面：直式面對面、橫式左右 ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 58px 1fr;grid-template-areas:"z1" "band" "z0";overflow:hidden}
#z0{grid-area:z0}
#z1{grid-area:z1;transform:rotate(180deg)}
#band{grid-area:band}
@media (min-aspect-ratio:1/1){
  #app{grid-template-columns:1fr 70px 1fr;grid-template-rows:1fr;grid-template-areas:"z0 band z1"}
  #z1{transform:none}
  #z1 .zhead{padding-right:66px}
}

/* ---------- 半邊 ---------- */
.zone{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;--c:var(--p0);--cd:var(--p0d);--cl:var(--p0l);background:var(--c)}
#z1{--c:var(--p1);--cd:var(--p1d);--cl:var(--p1l)}
.pat{position:absolute;inset:-40px;pointer-events:none;animation:drift 18s linear infinite}
#z0 .pat{background-image:radial-gradient(var(--cd) 2.6px,transparent 3px);background-size:24px 24px}
#z1 .pat{background-image:repeating-linear-gradient(-45deg,transparent 0 16px,rgba(0,0,0,.085) 16px 26px)}
@keyframes drift{to{transform:translate(24px,24px)}}
.deco{position:absolute;inset:0;pointer-events:none;z-index:1}
.deco svg{position:absolute;overflow:visible}
.deco .fl{animation:floaty 6s ease-in-out infinite alternate}
.deco .sp{animation:spin 26s linear infinite}
@keyframes floaty{from{transform:translateY(-6px) rotate(-4deg)}to{transform:translateY(8px) rotate(5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.zone.hit .stage{animation:thump .14s ease-out}
@keyframes thump{50%{transform:scale(.975)}}

.zhead{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 0}
.tag{display:flex;align-items:center;gap:7px;background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:999px;padding:3px 12px 3px 4px;white-space:nowrap}
.tag .av{width:28px;height:28px;flex:none}
.tag b{font-weight:900;font-size:16px;letter-spacing:.04em}
.tag small{font-weight:500;font-size:11px;opacity:.65}
.sc{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sc .me{display:flex;gap:3px}
.sc .me i{width:27px;height:27px;display:block}
.sc .me svg{width:100%;height:100%;fill:rgba(255,255,255,.35);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.sc .me i.on svg{fill:var(--yel)}
.sc .me i.pop{animation:starPop .7s cubic-bezier(.2,1.8,.4,1)}
@keyframes starPop{0%{transform:scale(.2) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
.sc .opp{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:900;background:var(--ink);color:var(--paper);padding:2px 6px 2px 7px;border-radius:99px}
.sc .opp i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--paper);display:block}
.sc .opp i.on{background:var(--oc)}
#z0 .sc .opp{--oc:var(--p1)} #z1 .sc .opp{--oc:var(--p0)}

.stage{position:relative;z-index:3;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px}
.hint{position:relative;z-index:5;text-align:center;font-weight:900;font-size:13px;padding:4px 12px 12px;min-height:40px;transition:opacity .25s}
.hint span{background:var(--ink);color:var(--paper);padding:5px 12px;border-radius:999px;display:inline-block;line-height:1.25}
.hint kbd{font-size:11px}
body.tugging .hint{opacity:0}
body.demo .hint{visibility:hidden}

/* ---------- 中線 ---------- */
#band{position:relative;z-index:6;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 10px}
#band::before,#band::after{content:"";position:absolute;left:0;right:0;height:7px;background:repeating-linear-gradient(-45deg,var(--yel) 0 7px,var(--ink) 7px 14px)}
#band::before{top:0} #band::after{bottom:0}
.slots{display:flex;gap:7px}
.slot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px;background:#2c2c2c;color:#8a8a8a;border:2.5px solid #444;transition:all .3s}
.slot.cur{background:var(--yel);color:var(--ink);border-color:var(--paper);transform:scale(1.18);animation:slotBob 1s ease-in-out infinite alternate}
.slot.w0{background:var(--p0);color:var(--ink);border-color:var(--paper)}
.slot.w1{background:var(--p1);color:var(--ink);border-color:var(--paper)}
@keyframes slotBob{to{transform:scale(1.18) translateY(-2px)}}
#pauseBtn{width:34px;height:34px;border-radius:50%;background:var(--paper);border:3px solid var(--yel);display:grid;place-items:center;flex:none}
#pauseBtn::before{content:"";width:11px;height:13px;border-left:4px solid var(--ink);border-right:4px solid var(--ink)}
#tbar{position:absolute;left:0;bottom:9px;height:4px;width:100%;background:var(--yel);transform-origin:left center;transform:scaleX(0);transition:opacity .2s;opacity:0}
#tbar.on{opacity:1}
@media (min-aspect-ratio:1/1){
  #band{flex-direction:column;padding:10px 0}
  #band::before,#band::after{top:0;bottom:0;left:auto;right:auto;width:7px;height:auto;background:repeating-linear-gradient(-45deg,var(--yel) 0 7px,var(--ink) 7px 14px)}
  #band::before{left:0} #band::after{right:0}
  .slots{flex-direction:column;gap:10px}
  #tbar{left:auto;right:12px;bottom:0;width:4px;height:100%;transform-origin:center bottom;transform:scaleY(0)}
}

/* ---------- 每邊的大字、卡片、倒數 ---------- */
.card{position:absolute;left:50%;top:50%;z-index:9;width:min(88%,430px);background:var(--paper);border:5px solid var(--ink);border-radius:22px;box-shadow:10px 10px 0 var(--ink);
  padding:16px 18px 16px;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.5)}
.card.show{animation:cardIn .55s cubic-bezier(.2,1.5,.4,1) both}
.card.hide{animation:cardOut .3s ease-in both}
@keyframes cardIn{0%{opacity:0;transform:translate(-50%,-30%) rotate(-14deg) scale(.4)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}}
@keyframes cardOut{0%{opacity:1;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}100%{opacity:0;transform:translate(60%,-50%) rotate(14deg) scale(.8)}}
.card .cnum{display:inline-block;background:var(--ink);color:var(--yel);font-weight:900;font-size:13px;padding:3px 12px;border-radius:99px;letter-spacing:.1em}
.card .cicon{width:62px;height:62px;margin:8px auto 2px}
.card .cicon svg{width:100%;height:100%}
.card h2{font-size:clamp(34px,10vmin,52px);font-weight:900;line-height:1.1;letter-spacing:.06em;color:var(--c);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.card p{font-size:15px;font-weight:900;margin-top:6px;line-height:1.45}
.card .chow{margin-top:9px;font-size:12.5px;font-weight:500;background:var(--cream);border:2px dashed var(--ink);border-radius:10px;padding:5px 8px}

.cd{position:absolute;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%);font-family:var(--num);font-weight:900;font-size:clamp(84px,26vmin,170px);line-height:1;color:var(--yel);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink);pointer-events:none;opacity:0;white-space:nowrap}
.cd.show{animation:cdPop .55s cubic-bezier(.2,1.7,.4,1) both}
.cd.go{font-family:var(--cjk);font-size:clamp(52px,15vmin,104px);color:var(--paper)}
@keyframes cdPop{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(10deg)}60%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}}
.cd.out{animation:fadeOut .25s ease-in both}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

.banner{position:absolute;left:50%;top:50%;z-index:10;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:96%;text-align:center}
.banner.show{display:flex}
.banner .bt{display:flex;justify-content:center;flex-wrap:nowrap;white-space:nowrap;font-weight:900;font-size:clamp(46px,14vmin,92px);line-height:1.05;letter-spacing:.02em}
.banner .bt span{display:inline-block;color:var(--yel);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);
  animation:letterPop .65s cubic-bezier(.2,1.9,.4,1) both;animation-delay:calc(var(--i) * 55ms)}
.banner .bs{font-weight:900;font-size:15px;background:var(--ink);color:var(--paper);padding:5px 14px;border-radius:99px;animation:letterPop .5s .2s cubic-bezier(.2,1.6,.4,1) both;white-space:nowrap}
.banner.lose .bt span{color:var(--ink);-webkit-text-stroke:5px var(--paper);text-shadow:6px 6px 0 var(--cd);font-size:.82em}
.banner.huge.lose .bt span{font-size:1em}
.sun{position:absolute;left:50%;top:50%;width:min(92vmin,96%,600px);aspect-ratio:1;margin:0;border-radius:50%;border:6px solid var(--ink);
  background:repeating-conic-gradient(var(--cl) 0 10deg,var(--paper) 10deg 20deg);transform:translate(-50%,-50%);animation:sunIn .7s cubic-bezier(.2,1.6,.4,1) both}
.sun::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:6px dashed var(--ink);opacity:.0}
.sun.spin{animation:sunIn .7s cubic-bezier(.2,1.6,.4,1) both,sunSpin 16s linear .7s infinite}
@keyframes sunIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-90deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes sunSpin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.rain{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70vmin,80%,420px);aspect-ratio:1;border-radius:50%;background:radial-gradient(rgba(21,21,21,.18) 2px,transparent 2.5px) 0 0/14px 14px;border:5px dashed rgba(21,21,21,.35);animation:sunIn .6s ease-out both}
.banner.foul .bt span{color:var(--red);-webkit-text-stroke-color:var(--ink)}
.banner.info .bt span{color:var(--paper);font-size:.72em}
.banner.huge .bt{font-size:clamp(64px,21vmin,170px)}
.banner.huge.win .bt span{animation:letterPop .7s cubic-bezier(.2,1.9,.4,1) both,bob 1.1s ease-in-out infinite alternate;animation-delay:calc(var(--i) * 80ms),calc(.7s + var(--i) * 120ms)}
.banner.huge .bs{font-size:18px;padding:6px 18px}
@keyframes letterPop{0%{opacity:0;transform:translateY(40px) scale(.2) rotate(-25deg)}100%{opacity:1;transform:none}}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-14px) rotate(4deg)}}

/* ---------- 小遊戲：共用 ---------- */
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2vmin,18px);width:100%;height:100%}
.mini{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:3px 11px;box-shadow:3px 3px 0 var(--ink)}
.mini .pp{display:flex;gap:3px}
.mini .pp i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:block}
.mini .c0 i.on{background:var(--p0)} .mini .c1 i.on{background:var(--p1)}
.mini .sep{opacity:.35}

/* 搶按 */
.lampWrap{position:relative;display:grid;place-items:center}
.rays{position:absolute;width:175%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(var(--yel) 0 9deg,transparent 9deg 22deg);opacity:0;transform:scale(.6);transition:opacity .1s,transform .25s cubic-bezier(.2,1.6,.4,1)}
.lampWrap.on .rays{opacity:1;transform:scale(1);animation:spin 5s linear infinite}
.lampWrap.fake .rays{opacity:.9;transform:scale(.85);background:repeating-conic-gradient(var(--red) 0 9deg,transparent 9deg 22deg)}
.lamp{position:relative;width:min(44vmin,40vh,230px);aspect-ratio:1;border-radius:50%;border:6px solid var(--ink);box-shadow:8px 8px 0 var(--ink);display:grid;place-items:center;text-align:center;
  background:repeating-linear-gradient(45deg,#ECE4D2 0 11px,#DCD1BA 11px 22px);transition:transform .15s cubic-bezier(.2,1.8,.4,1)}
.lamp::before{content:"";position:absolute;inset:-17px;border-radius:50%;border:4px dashed var(--ink);opacity:.45;animation:spin 14s linear infinite}
.lamp .lt{font-weight:900;font-size:clamp(22px,7vmin,40px);line-height:1.15;padding:0 10px}
.lamp .lt small{display:block;font-size:.45em;font-weight:500;opacity:.7}
.lamp.on{background:var(--yel);transform:scale(1.07)}
.lamp.on .lt{font-size:clamp(40px,13vmin,74px)}
.lamp.fake{background:var(--red);color:var(--paper);transform:scale(.97)}
.lamp.fault{background:var(--ink);color:var(--red)}
.lamp.won{background:var(--paper)}

/* 拔河 */
.tug{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;width:100%;height:100%}
.tug .tl,.tug .tr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tug .tl b{font-size:clamp(32px,9.5vmin,64px);font-weight:900;color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);line-height:1.05;writing-mode:vertical-rl;letter-spacing:.05em}
.tug .arr{display:flex;flex-direction:column;align-items:center}
.tug .arr i{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:15px solid var(--ink);margin-top:-3px;animation:arrow .6s ease-in-out infinite;opacity:.85}
.tug .arr i:nth-child(2){animation-delay:.12s}.tug .arr i:nth-child(3){animation-delay:.24s}
@keyframes arrow{50%{transform:translateY(5px);opacity:.3}}
.tug .tc{font-family:var(--num);font-size:clamp(46px,14vmin,96px);line-height:1;background:var(--paper);border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:18px;padding:6px 14px;min-width:1.9em;text-align:center}
.tug .tc.bump{animation:bump .12s ease-out}
@keyframes bump{50%{transform:scale(1.12) rotate(-3deg)}}
.tug small{position:relative;z-index:1;margin-top:8px;font-weight:900;font-size:13px;background:var(--ink);color:var(--paper);border-radius:99px;padding:2px 10px}
.land .tug{grid-template-columns:1fr;grid-template-rows:1fr 120px 1fr}
.land .tug .tl{flex-direction:row;gap:14px}
.land .tug .tl b{writing-mode:horizontal-tb}
.land .tug .arr{transform:rotate(90deg)}
#z1 .tug .arr{transform:none}
.land #z0 .tug .arr{transform:rotate(90deg)}
.land #z1 .tug .arr{transform:rotate(-90deg)}
#rope{position:absolute;inset:0;z-index:7;pointer-events:none;display:none}
#rope.on{display:block}
#rope .line{position:absolute;border:3px solid var(--ink);border-radius:10px;background:repeating-linear-gradient(45deg,#E2A35C 0 7px,#9B6430 7px 13px)}
#rope .goal{position:absolute;background:conic-gradient(var(--ink) 25%,var(--paper) 0 50%,var(--ink) 0 75%,var(--paper) 0) 0 0/14px 14px;border:3px solid var(--ink);opacity:.9}
#rope .knot{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;will-change:transform}
#rope .knot svg{width:100%;height:100%;overflow:visible}
#rope .knot.jig svg{animation:jig .12s ease-out}
@keyframes jig{50%{transform:scale(1.15) rotate(10deg)}}

/* 先按輸 */
.bombWrap{position:relative;width:min(36vmin,34vh,190px);aspect-ratio:1}
.bombWrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bombWrap .bomb{transform-origin:50% 62%}
.bombWrap .burst{opacity:0;transform:scale(.2)}
.bombWrap.boom .bomb{opacity:0}
.bombWrap.boom .burst{opacity:1;animation:burst .5s cubic-bezier(.2,1.8,.4,1) both}
.bombWrap.safe .bomb{opacity:.35;filter:grayscale(1)}
@keyframes burst{0%{transform:scale(.2) rotate(-30deg)}100%{transform:scale(1.25) rotate(0)}}
.spark{animation:spark .14s steps(2) infinite;transform-origin:97px 16px}
@keyframes spark{50%{transform:scale(1.35) rotate(25deg)}}
.ctime{font-family:var(--num);font-size:clamp(40px,12vmin,78px);line-height:1;background:var(--paper);border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:16px;padding:6px 16px 4px;min-width:4.2em;text-align:center;transform:rotate(-2deg)}
.ctime small{font-family:var(--cjk);font-size:.32em;font-weight:900;margin-left:4px}
.ctime.locked{background:var(--yel)}
.ctime.dead{background:var(--ink);color:var(--red)}
.cmsg{font-weight:900;font-size:13.5px;background:var(--ink);color:var(--paper);padding:5px 13px;border-radius:99px;text-align:center;max-width:94%}

/* 猜拳 & 算數：選項 */
.chant{font-weight:900;font-size:clamp(30px,9.5vmin,58px);color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);line-height:1.05;white-space:nowrap}
.chant.pop{animation:chantPop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes chantPop{0%{transform:scale(1.6) rotate(-6deg)}100%{transform:none}}
.opts{display:flex;gap:clamp(8px,2.4vmin,18px);justify-content:center;width:100%}
.opt{position:relative;flex:0 1 min(27vmin,150px);aspect-ratio:.86;border:4px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:900;font-size:clamp(14px,3.6vmin,20px);transition:transform .14s cubic-bezier(.2,1.8,.4,1),box-shadow .14s,background .14s;cursor:pointer;max-width:150px}
.opt svg{width:66%;height:auto;pointer-events:none}
.opt kbd{position:absolute;top:-11px;right:-9px;font-size:12px}
.opt.sel{background:var(--yel);transform:translateY(-9px) rotate(-3deg);box-shadow:5px 14px 0 var(--ink)}
.opt.press{transform:scale(.94)}
.opt.wrong{background:var(--ink);color:var(--red);animation:shakeX .35s}
.opt.right{background:var(--yel);transform:translateY(-6px) scale(1.06);box-shadow:5px 11px 0 var(--ink)}
.opt.dim{opacity:.45}
@keyframes shakeX{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.num .opt{aspect-ratio:1.15;font-family:var(--num);font-size:clamp(28px,8vmin,50px)}
.eq{font-family:var(--num);font-size:clamp(38px,11vmin,80px);line-height:1;background:var(--paper);border:5px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:10px 22px 8px;border-radius:16px;transform:rotate(-2deg);white-space:nowrap}
.eq.pop{animation:eqPop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes eqPop{0%{transform:scale(.4) rotate(-12deg)}100%{transform:rotate(-2deg)}}
.lockmsg{font-weight:900;font-size:13px;background:var(--red);color:var(--paper);border:2.5px solid var(--ink);padding:3px 12px;border-radius:99px}
.reveal{display:flex;align-items:center;gap:clamp(10px,3vmin,26px)}
.rv{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:14px}
.rv .hand{width:min(28vmin,140px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:grid;place-items:center;background:var(--paper);animation:slam .45s cubic-bezier(.2,1.8,.4,1) both}
.rv.op .hand{animation-delay:.08s}

<script>

/* ② 拔河 */
function mkTug() {
  const STEPS = S.fast ? 8 : 16, LIMIT = S.fast ? 4500 : 12000;
  let net = 0, kv = 0, st = 'cd', left = LIMIT; const taps = [0, 0];
  function place() { placeRope(kv); }
  function win(w, why) {
    st = 'done'; setTimer(null);
    banner(w, '拉贏了！', why, 'win'); banner(1 - w, '被拖走', `點了 ${taps[1 - w]} 下`, 'lose');
    SFX.point(); after(S.fast ? 900 : 1350, () => finish(w, `${taps[w]} 下狂點`, '手速再快一點'));
  }
  return {
    start() {
      document.body.classList.add('tugging');
      setStages(p => `<div class="tug"><div class="tl"><b>狂點！</b><div class="arr"><i></i><i></i><i></i></div></div><div></div><div class="tr"><div class="tc">0</div><small>下</small></div></div>`);
      $('#rope').classList.add('on'); place();
      countdown(() => {
        st = 'go';
        [0, 1].forEach(p => {
          if (!isCPU(p)) return;
          const go = () => { if (st !== 'go' && st !== 'sd') return; cpu(p); after(1000 / rand(...skill(p).tap) * rand(0.75, 1.25), go); };
          after(rand(140, 300), go);
        });
      });
    },
    press(p) {
      if (st !== 'go' && st !== 'sd') return;
      taps[p]++; net += p === 0 ? 1 : -1; SFX.tug(p);
      const tc = qs(p, '.tc'); if (tc) { tc.textContent = taps[p]; bumpEl(tc, 'bump'); }
      bumpEl($('#rope .knot'), 'jig');
      if (st === 'sd') { net = p === 0 ? STEPS : -STEPS; win(p, '驟死賽搶到最後一拉'); return; }
      if (Math.abs(net) >= STEPS) win(p, '繩結過線！');
    },
    update(dt) {
      kv += (net / STEPS - kv) * Math.min(1, dt / 70);
      place();
      if (st === 'go') {
        left -= dt; setTimer(left / LIMIT);
        if (left <= 0) {
          setTimer(null);
          if (net === 0) { st = 'sd'; [0, 1].forEach(p => banner(p, '平手！', '下一下決勝負', 'info', 1100)); }
          else win(net > 0 ? 0 : 1, '時間到，你拉得比較多');
        }
      }
    },
    cleanup() { document.body.classList.remove('tugging'); $('#rope').classList.remove('on'); },
  };
}
function placeRope(v) {
  const R = $('#rope'); if (!R.classList.contains('on')) return;
  const a = $('#app').getBoundingClientRect(), b = $('#band').getBoundingClientRect();
  const line = R.querySelector('.line'), knot = R.querySelector('.knot'), g0 = R.querySelector('.g0'), g1 = R.querySelector('.g1');
  if (!knot.innerHTML) knot.innerHTML = KNOT;
  if (!LAND.matches) {
    const cx = a.width / 2, cy = b.top + b.height / 2 - a.top, reach = Math.min(cy, a.height - cy) * 0.8;
    Object.assign(line.style, { left: cx - 9 + 'px', top: '-6px', width: '18px', height: a.height + 12 + 'px' });
    Object.assign(g0.style, { left: '0', width: '100%', top: cy + reach - 7 + 'px', height: '16px' });
    Object.assign(g1.style, { left: '0', width: '100%', top: cy - reach - 9 + 'px', height: '16px' });
    knot.style.transform = `translate(${cx}px,${cy + v * reach}px) rotate(${v * 180}deg)`;
  } else {
    const cy = a.height / 2, cx = b.left + b.width / 2 - a.left, reach = Math.min(cx, a.width - cx) * 0.76;
    Object.assign(line.style, { top: cy - 9 + 'px', left: '-6px', height: '18px', width: a.width + 12 + 'px' });
    Object.assign(g0.style, { top: '0', height: '100%', left: cx - reach - 9 + 'px', width: '16px' });
    Object.assign(g1.style, { top: '0', height: '100%', left: cx + reach - 7 + 'px', width: '16px' });
    knot.style.transform = `translate(${cx - v * reach}px,${cy}px) rotate(${-v * 180}deg)`;
  }
}

/* ③ 先按輸（膽小鬼） */
function mkChicken() {

    st = 'cd'; el = 0; bail = [null, null];

    [0, 1].forEach(p => { target[p] = rand(...skill(p).chicken) * (S.fast ? 0.8 : 1); });
    setStages(p => `<div class="col"><div class="bombWrap">${BOMB}${BURST}</div><div class="ctime">0.00<small>秒</small></div><div class="cmsg">撐越久分越高・爆了就歸零</div></div>`);
    countdown(() => { st = 'go'; });

    st = 'done';

    if (s[0] < 0 && s[1] < 0) { [0, 1].forEach(p => banner(p, '都爆了！', '再來一顆', 'foul', 1500)); after(1800, round); return; }
    if (s[0] === s[1]) { [0, 1].forEach(p => banner(p, '一模一樣', '再來一顆', 'info', 1500)); after(1800, round); return; }
    const w = s[0] > s[1] ? 0 : 1;
    [0, 1].forEach(p => { const m = qs(p, '.cmsg'); if (m) m.textContent = reveal; });
    banner(w, s[1 - w] < 0 ? '活下來！' : '更大膽！', s[1 - w] < 0 ? '對手被炸飛了' : `撐了 ${(s[w] / 1000).toFixed(2)} 秒`, 'win');
    banner(1 - w, s[1 - w] < 0 ? '爆了…' : '太膽小', s[1 - w] < 0 ? '貪心了一點' : `對手撐得比你久`, s[1 - w] < 0 ? 'foul' : 'lose');
    after(1500, () => finish(w, '膽子最大', '下次撐久一點'));

    start: round,
    press(p) {

      const bw = qs(p, '.bombWrap'); if (bw) bw.classList.add('safe');

      const o = qs(1 - p, '.cmsg'); if (o && bail[1 - p] == null) o.textContent = `對手在 ${(el / 1000).toFixed(2)} 秒收手了！`;
      // 聰明的電腦：對手一收手就跟著收（後收手的人一定贏）
      if (isCPU(1 - p) && bail[1 - p] == null && skill(1 - p).smart) target[1 - p] = Math.min(target[1 - p] + 99999, el + rand(160, 380));
      if (bail[0] != null && bail[1] != null) resolve();
    },
    update(dt) {
      if (st !== 'go') return;
      el += dt;

      if (st !== 'go') return;

        const b = qs(p, '.bomb'); if (b) b.style.transform = `rotate(${Math.sin(S.T / (70 - Math.min(40, el / 160))) * amp}deg) scale(${sc + Math.sin(S.T / 90) * 0.02})`;
      });
      if (el >= boomAt) {
        st = 'boom'; SFX.boom(); flash(); shake(16);
        [0, 1].forEach(p => {
          const bw = qs(p, '.bombWrap'); if (bw && bail[p] == null) bw.classList.add('boom');
          if (bail[p] == null) { const ct = qs(p, '.ctime'); if (ct) { ct.textContent = '爆！0 分'; ct.className = 'ctime dead'; } if (!isCPU(p)) vib([200, 60, 200]); }

  };
}

/* ④ 猜拳 */
function mkRps() {

  }

    setStages(p => {

      return `<div class="col"><div class="reveal"><div class="rv${cls(p)}"><div class="hand">${hand(me)}</div><b>${isCPU(p) && S.vs === 'cpu' ? '電腦' : '你'}・${me == null ? '沒出' : HNAME[me]}</b></div><div class="vs">VS</div><div class="rv op${cls(1 - p)}"><div class="hand">${hand(op)}</div><b>對手・${op == null ? '沒出' : HNAME[op]}</b></div></div>${N > 1 ? mini(p, wins, N) : ''}</div>`;
    });

/* ⑤ 算數搶答 */
function mkMath() {
  const N = S.fast ? 2 : 3, QT = 8000, wins = [0, 0]; let st = 'cd', cur = null, lock = [false, false], tok = 0, left = QT;
  function gen() {
    const t = pick(['+', '+', '-', '×', '×']); let a, b, ans, d;
    if (t === '+') { a = ri(12, 58); b = ri(5, 29); ans = a + b; d = [1, -1, 10, -10, 2]; }
    else if (t === '-') { a = ri(30, 89); b = ri(6, 29); ans = a - b; d = [1, -1, 10, -10, 2]; }
    else { a = ri(3, 9); b = ri(3, 9); ans = a * b; d = [a, -a, b, -b, 1, -1]; }
    const set = new Set([ans]); const ds = shuffle(d);
    for (const x of ds) { if (set.size >= 3) break; const v = ans + x; if (v > 0) set.add(v); }
    while (set.size < 3) set.add(ans + set.size + 2);
    return { text: `${a} ${t === '-' ? '−' : t === '+' ? '＋' : '×'} ${b}`, ans, opts: shuffle([...set]) };
  }
  function opts(p) {
    const keys = p ? ['J', 'K', 'L'] : ['A', 'S', 'D'];
    return `<div class="opts num">${cur.opts.map((v, i) => `<div class="opt" data-opt="${i}" role="button">${v}${FINE.matches && !isCPU(p) ? `<kbd>${keys[i]}</kbd>` : ''}</div>`).join('')}</div>`;
  }
  function next() {
    const t = ++tok; lock = [false, false]; cur = gen(); st = 'q'; left = QT;
    setStages(p => `<div class="col"><div class="eq pop">${cur.text} = ?</div>${opts(p)}${mini(p, wins, N)}</div>`);
    SFX.tick();
    [0, 1].forEach(p => {
      if (!isCPU(p)) return;
      const sk = skill(p); const think = rand(...sk.math) * (cur.text.includes('×') ? 0.85 : 1) * (S.fast ? 0.75 : 1);
      after(think, () => {
        if (t !== tok || st !== 'q' || lock[p]) return;
        let i = cur.opts.indexOf(cur.ans);
        if (Math.random() < sk.mathErr) i = pick([0, 1, 2].filter(x => x !== i));
        cpu(p, i);
        if (lock[p]) after(rand(600, 1200), () => {}); // 鎖住就等下一題
      });
    });
  }
  function showAnswer() { [0, 1].forEach(p => qa(p, '[data-opt]').forEach((o, i) => { if (cur.opts[i] === cur.ans) o.classList.add('right'); else if (!o.classList.contains('wrong')) o.classList.add('dim'); })); }
  return {
    start() { setStages(() => ''); countdown(next); },
    press(p, opt) {
      if (st !== 'q' || opt == null || lock[p]) return;
      const o = qa(p, '[data-opt]')[opt];
      if (cur.opts[opt] === cur.ans) {
        st = 'done'; wins[p]++; SFX.point(); setTimer(null);
        showAnswer(); updMini(wins, N);
        banner(p, '答對！', `${cur.text} = ${cur.ans}`, 'win', 950); banner(1 - p, '被搶答', `答案是 ${cur.ans}`, 'lose', 950);
        if (wins[p] >= N) after(1150, () => finish(p, `${wins[p]} 題搶第一`, '心算再快一點'));
        else after(1250, next);
      } else {
        lock[p] = true; SFX.wrong(); if (!isCPU(p)) vib([40, 30, 40]);
        if (o) o.classList.add('wrong');
        const col = Z[p].stage.querySelector('.col'); if (col && !col.querySelector('.lockmsg')) { const m = document.createElement('div'); m.className = 'lockmsg'; m.textContent = '答錯！這題鎖住'; col.insertBefore(m, col.querySelector('.mini')); }
        if (lock[0] && lock[1]) { st = 'done'; setTimer(null); showAnswer(); [0, 1].forEach(q => banner(q, '都錯了', `答案是 ${cur.ans}`, 'info', 1000)); after(1300, next); }
      }
    },
    update(dt) {
      if (st !== 'q') return;
      left -= dt; setTimer(left / QT);
      if (left <= 0) { st = 'done'; setTimer(null); showAnswer(); [0, 1].forEach(q => banner(q, '時間到', `答案是 ${cur.ans}`, 'info', 1000)); after(1300, next); }
    },
  };
}

function endMatch(w) {
  S.screen = 'over';
  [0, 1].forEach(p => { Z[p].stage.innerHTML = p === w ? `<div class="sun${RM ? '' : ' spin'}"></div>` : '<div class="rain"></div>'; });
  banner(w, '勝利！', `${S.score[w]} : ${S.score[1 - w]} 拿下比賽`, 'huge win', 0);
  banner(1 - w, '惜敗', '下回再戰', 'huge lose', 0);
  SFX.fanfare(); after(900, () => {}); confetti(w, 140, true); setTimeout(() => confetti(w, 70, true), 450);
  if (!isCPU(w)) vib([60, 50, 60, 50, 200]);
  if (S.vs === 'cpu') { save.rec[S.diff][w === 0 ? 0 : 1]++; }
  else if (S.vs === 'pvp') save.pvp[w]++;
  if (S.vs !== 'demo') { save.played++; persist(); }
  if (S.vs === 'demo') {
    after(3200, () => showTitle('示範結束，換你上場！'));
  } else {
    after(1700, () => {
      const r = $('#result');
      $('#rScore').innerHTML = `<b style="background:var(--p0)">${nm(0)}</b>${S.score[0]} : ${S.score[1]}<b style="background:var(--p1)">${nm(1)}</b>`;
      r.classList.add('show');
    });
  }
}
function showTitle(msg) {
  S.mid++; timers = []; if (S.cur && S.cur.cleanup) S.cur.cleanup(); S.cur = null;
  S.running = false; S.paused = false; S.screen = 'title';
  document.body.classList.remove('demo', 'tugging'); $('#rope').classList.remove('on');
  ['#pause', '#result'].forEach(s => $(s).classList.remove('show'));
  clearBanners(); setTimer(null);
  const m = $('#tmsg'); m.textContent = msg || ''; m.classList.toggle('on', !!msg);
  renderRec();
  $('#title').classList.add('show'); $('#title').scrollTop = 0;
}
function setPause(on) {
  if (!S.running || S.screen !== 'match') return;
  S.paused = on; $('#pause').classList.toggle('show', on);
  const mine = a => { try { let t = a.effect && a.effect.target; if (t && !t.closest && t.element) t = t.element; return !!(t && t.closest && t.closest('#app,#fx')); } catch (e) { return false; } };
  if (on) { S.pAnims = document.getAnimations().filter(a => a.playState === 'running' && mine(a)); S.pAnims.forEach(a => { try { a.pause(); } catch (e) {} }); }
  else { (S.pAnims || []).forEach(a => { try { if (a.playState === 'paused') a.play(); } catch (e) {} }); S.pAnims = []; }
}
function renderRec() {
  const r = save.rec; const names = ['簡單', '普通', '困難'];
  const parts = r.map((x, i) => (x[0] + x[1]) ? `${names[i]} ${x[0]} 勝 ${x[1]} 敗` : '').filter(Boolean);
  $('#rec').textContent = parts.length ? '對電腦戰績：' + parts.join('・') : (save.pvp[0] + save.pvp[1] ? `雙人戰績：粉方 ${save.pvp[0]} 勝・青方 ${save.pvp[1]} 勝` : '還沒有戰績，來一場吧！');
  if (parts.length && save.pvp[0] + save.pvp[1]) $('#rec').textContent += `　｜　雙人：粉 ${save.pvp[0]}・青 ${save.pvp[1]}`;
  $('#seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.d === S.diff));
}

/* ================= 輸入 ================= */
const ptrs = new Map();
function sideOf(x, y) {
  const b = $('#band').getBoundingClientRect();
  if (!LAND.matches) { if (y >= b.top && y <= b.bottom) return null; return y < b.top ? 1 : 0; }
  if (x >= b.left && x <= b.right) return null; return x > b.right ? 1 : 0;
}
addEventListener('pointerdown', e => {
  audio();
  if (e.target.closest('.ov, .ui, #pauseBtn, a')) return;
  if (!S.running || S.paused) return;
  const p = sideOf(e.clientX, e.clientY); if (p == null) return;
  e.preventDefault();
  ptrs.set(e.pointerId, p);
  const optEl = e.target.closest('[data-opt]');
  const opt = optEl && optEl.closest('.zone') === Z[p].el ? +optEl.dataset.opt : null;
  if (S.screen !== 'match' || isCPU(p)) return;
  ripple(e.clientX, e.clientY, p);
  if (optEl && opt != null) { optEl.classList.remove('press'); void optEl.offsetWidth; optEl.classList.add('press'); setTimeout(() => optEl.classList.remove('press'), 120); }
  human(p, opt, e.pointerType !== 'mouse');
}, { passive: false });
['pointerup', 'pointercancel'].forEach(t => addEventListener(t, e => ptrs.delete(e.pointerId)));
addEventListener('contextmenu', e => e.preventDefault());
const KEYS = { KeyA: [0, 0], KeyS: [0, 1], KeyD: [0, 2], ShiftLeft: [0, null], Space: [0, null], KeyJ: [1, 0], KeyK: [1, 1], KeyL: [1, 2], ShiftRight: [1, null] };
addEventListener('keydown', e => {
  audio();
  if (e.code === 'Escape') { if (S.running && S.screen === 'match') setPause(!S.paused); return; }
  if (e.repeat) { if (KEYS[e.code]) e.preventDefault(); return; }
  const m = KEYS[e.code]; if (!m) return;
  if (!S.running || S.screen !== 'match') return;
  e.preventDefault();
  if (S.paused) return;
  const [p, opt] = m;
  if (isCPU(p)) return;
  const curType = S.key ? GAMES[S.key].type : 'main';
  if (S.cur) rippleIn(p, curType === 'opt' ? opt : null);
  human(p, opt, false);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && S.screen === 'match' && !S.paused) setPause(true); });
addEventListener('resize', () => { document.body.classList.toggle('land', LAND.matches); placeRope(0); });
document.body.classList.toggle('land', LAND.matches);
LAND.addEventListener && LAND.addEventListener('change', () => document.body.classList.toggle('land', LAND.matches));

/* 按鈕 */
function sndIcon() {
  $('#snd').innerHTML = save.sound
    ? `<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#FFD23F" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/></svg>`
    : `<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#ccc" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M16 9l6 6M22 9l-6 6" stroke="#FF3B3B" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  $('#snd').setAttribute('aria-pressed', String(save.sound));
}
$('#snd').addEventListener('click', () => { save.sound = !save.sound; persist(); sndIcon(); audio(); if (AU.master) AU.master.gain.value = save.sound ? 0.6 : 0; SFX.ui(); });
$('#bPvp').addEventListener('click', () => { audio(); SFX.ui(); startMatch('pvp'); });
$('#bCpu').addEventListener('click', () => { audio(); SFX.ui(); startMatch('cpu'); });
$('#bDemo').addEventListener('click', () => { audio(); SFX.ui(); startMatch('demo'); });
$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.diff = +b.dataset.d; save.diff = S.diff; persist(); renderRec(); audio(); SFX.ui(); });
$('#pauseBtn').addEventListener('click', () => { audio(); setPause(!S.paused); });
$('#bResume').addEventListener('click', () => setPause(false));
$('#bQuit').addEventListener('click', () => showTitle());
$('#bAgain').addEventListener('click', () => { audio(); SFX.ui(); startMatch(S.vs); });
$('#bMenu').addEventListener('click', () => showTitle());
$('#demoChip').addEventListener('click', () => { audio(); showTitle('輪到你了！選一個模式開始'); });

/* ================= 主迴圈 ================= */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  if (S.running && !S.paused) {
    S.T += dt;
    if (timers.length) {
      const due = timers.filter(t => t.at <= S.T);
      if (due.length) { timers = timers.filter(t => t.at > S.T); due.sort((a, b) => a.at - b.at).forEach(t => t.fn()); }
    }
    if (S.cur && S.cur.update) S.cur.update(dt);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

buildDeco(); sndIcon(); renderRec(); setupZones(); renderScores();
S.order = Object.keys(GAMES); renderSlots();
if (URL_DEMO) startMatch('demo');

// 給測試用的窺視窗口
window.__g13 = { S, get state() { return { screen: S.screen, vs: S.vs, score: S.score.slice(), gi: S.gi, key: S.key, paused: S.paused, running: S.running, results: S.results.slice(), presses: S.presses.slice(), log: S.log.slice(), cur: !!S.cur }; }, startMatch, showTitle };
})();
</script>
