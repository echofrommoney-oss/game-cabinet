<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三分鐘的早晨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ece1; --ink:#141414; --ink2:#4a4a4a; --mute:#8b867c;
  --verm:#d7361f;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  --hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti","Noto Serif CJK TC",serif;
  --dots:radial-gradient(circle,rgba(20,20,20,.20) 1px,transparent 1.35px);
  --dotsD:radial-gradient(circle,rgba(20,20,20,.55) 1.3px,transparent 1.6px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent}
body{background:#e8e3d8;background-image:var(--dots);background-size:6px 6px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
em.v{font-style:normal;color:var(--verm);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* ---------- page ---------- */
.page{max-width:1420px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:12px;padding:12px 16px 30px}
.panel{background:var(--paper);border:4px solid var(--ink);position:relative;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:6px 64px 6px 14px;flex:0 0 auto}
.brand{font-weight:900;font-size:22px;letter-spacing:.08em;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:500;letter-spacing:.3em;color:var(--ink2)}
.loopno{font-family:var(--hand);font-size:18px;white-space:nowrap;border-left:3px solid var(--ink);padding-left:14px}
.loopno b{font-size:28px;font-family:var(--serif);font-weight:900}
.clockbox{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.digits{font-weight:900;font-size:34px;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;transition:transform .15s}
.digits.hurry{animation:hurry .5s steps(2) infinite}
@keyframes hurry{50%{transform:translateY(-1px) rotate(-1deg)}}
.tbar{flex:1;height:14px;border:2.5px solid var(--ink);position:relative;background:var(--paper2);min-width:60px}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);background-image:repeating-linear-gradient(135deg,#141414 0 6px,#3b3b3b 6px 9px);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.tbar .mk{position:absolute;top:-7px;width:3px;height:24px;background:var(--verm);transform:translateX(-1px)}
.tbar .mk.end{background:var(--ink);width:4px}
.tbtn{border:3px solid var(--ink);background:var(--paper);padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.tbtn:hover{background:var(--ink);color:var(--paper)}
#btnNote{display:none}
.analog{width:42px;height:42px;flex:0 0 auto}

.main{flex:1;min-height:0;display:flex;gap:12px}
.colL{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;min-height:0}
.colR{flex:0 0 370px;display:flex;flex-direction:column;gap:12px;min-height:0}

/* scene */
.scenePanel{flex:0 0 auto;overflow:hidden}
.sceneWrap{position:relative;background:#fff;background-image:var(--dots);background-size:7px 7px;border-bottom:3px solid var(--ink)}
#scene{display:block;width:100%;height:clamp(220px,46vh,440px)}
#scene.enter{animation:sceneIn .42s cubic-bezier(.2,.9,.25,1)}
@keyframes sceneIn{0%{clip-path:inset(0 0 0 100%);transform:translateX(18px)}100%{clip-path:inset(0 0 0 0);transform:none}}
.caption{position:absolute;left:-4px;top:-4px;background:var(--ink);color:var(--paper);padding:5px 12px 6px;font-weight:700;font-size:15px;letter-spacing:.06em;z-index:2}
.caption small{opacity:.7;font-weight:500;margin-right:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;align-items:center;min-height:44px}
.chips .lbl{font-size:12px;color:var(--ink2);margin-right:2px}
.chip{border:2px solid var(--ink);background:var(--paper);padding:3px 10px;font-size:14px;font-family:var(--hand);position:relative;border-radius:2px}
.chip.sel{background:var(--ink);color:var(--paper)}
.chip.k::after{content:"";position:absolute;right:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--verm);border:1.5px solid var(--paper)}
.chip.exit{border-style:dashed}
.chip.who{font-weight:700}

/* svg hotspots */
.hs{cursor:pointer;outline:none}
.hs .hit{fill:rgba(255,255,255,0);stroke:transparent;stroke-width:3;stroke-dasharray:9 6}
.hs:hover .hit,.hs:focus-visible .hit{stroke:#141414}
.hs.sel .hit{stroke:#141414;stroke-width:4;animation:march .6s linear infinite}
@keyframes march{to{stroke-dashoffset:-15}}
.hs.known .k{stroke:var(--verm)!important}
.hs.known .kf{fill:var(--verm)!important}

/* dialog */
.dlgPanel{flex:1 1 auto;min-height:180px;display:flex;flex-direction:column}
.log{flex:1 1 auto;overflow-y:auto;padding:12px 14px 6px;display:flex;flex-direction:column;gap:10px;min-height:60px;scroll-behavior:smooth}
.ln{max-width:94%;font-size:16px;line-height:1.6;animation:pop .32s cubic-bezier(.3,1.6,.5,1) both}
.ln.old{animation:none;opacity:.55}
@keyframes pop{0%{transform:scale(.85) translateY(6px);opacity:0}100%{transform:none;opacity:1}}
.ln.narr{border:2.5px solid var(--ink);background:#fff;padding:6px 12px;align-self:flex-start;font-size:15px}
.ln.narr .ts{font-weight:900;margin-right:8px;font-variant-numeric:tabular-nums}
.ln.say{align-self:flex-start;background:#fff;border:2.5px solid var(--ink);border-radius:26px/22px;padding:9px 16px 9px;font-family:var(--hand);font-size:17px;position:relative;margin-left:8px}
.ln.say::before{content:"";position:absolute;left:-11px;top:14px;width:16px;height:16px;background:#fff;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:skewY(-30deg) rotate(10deg)}
.ln.say .who{position:absolute;top:-12px;left:14px;background:var(--ink);color:var(--paper);font-family:var(--serif);font-size:11px;padding:1px 7px;font-weight:700;letter-spacing:.1em}
.ln.think{align-self:flex-end;border:2.5px dashed var(--ink);border-radius:30px;background:#fff;padding:7px 16px;font-family:var(--hand);font-size:16px;color:var(--ink2)}
.ln.sys{align-self:center;font-size:13px;color:var(--ink2);border-top:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);padding:3px 10px;text-align:center}
.ln.tut{align-self:stretch;max-width:100%;background:var(--ink);color:var(--paper);padding:8px 12px;font-size:14px;line-height:1.7}
.acts{border-top:3px solid var(--ink);padding:10px 12px 12px;background:var(--paper2);flex:0 0 auto}
.acts h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.acts h4 .tag{font-size:11px;font-weight:500;border:1.5px solid var(--ink);padding:0 5px}
.acts .desc{font-size:13.5px;color:var(--ink2);margin:-2px 0 8px;line-height:1.5}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.act{border:3px solid var(--ink);background:#fff;padding:7px 12px 6px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:120px;position:relative;transition:transform .08s,box-shadow .08s;box-shadow:3px 3px 0 var(--ink)}
.act:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.act:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.act b{font-size:15px;font-family:var(--hand)}
.act i{font-style:normal;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.act .n{position:absolute;right:5px;top:3px;font-size:10px;color:var(--mute)}
.act.ghost{background:transparent;box-shadow:none;border-width:2px;border-style:dashed}
.act.key b{color:var(--verm)}
.act[disabled]{opacity:.45;pointer-events:none}
.dial{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wheel{display:flex;flex-direction:column;align-items:center;border:3px solid var(--ink);background:#fff;width:52px}
.wheel button{border:0;background:transparent;width:100%;padding:2px 0;font-size:13px}
.wheel button:hover{background:var(--ink);color:#fff}
.wheel span{font-size:30px;font-weight:900;line-height:1.1;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);width:100%;text-align:center;font-variant-numeric:tabular-nums}

/* map */
.mapPanel{flex:0 0 auto;padding:6px 8px 4px}
.mapPanel h3,.notePanel h3{margin:0;font-size:13px;letter-spacing:.2em}
#map{width:100%;height:auto;display:block;max-height:210px;margin:0 auto}
.mloc{cursor:pointer}
.mloc rect{fill:#fff;stroke:#141414;stroke-width:3}
.mloc:hover rect{fill:#efebe2}
.mloc.cur rect{fill:url(#t1)}
.mloc.sel rect{stroke-dasharray:8 5;stroke-width:4}
.mloc text{font-family:var(--hand);font-size:14px;fill:#141414;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
.mloc text.me{fill:#fbf8f1;stroke:none;font-family:var(--serif);font-weight:900;font-size:13px}
.mloc .cost{font-family:var(--serif);font-size:10px;fill:#555}

/* notebook */
.notePanel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:#fffdf7;background-image:repeating-linear-gradient(transparent 0 27px,rgba(20,20,20,.10) 27px 28px);}
.tabs{display:flex;border-bottom:3px solid var(--ink);flex:0 0 auto}
.tab{flex:1;border:0;border-right:3px solid var(--ink);background:var(--paper2);padding:7px 4px;font-weight:700;font-size:14px;position:relative}
.tab:last-child{border-right:0}
.tab.on{background:var(--ink);color:var(--paper)}
.tab .badge{position:absolute;top:2px;right:4px;background:var(--verm);color:#fff;font-size:10px;padding:0 4px;border-radius:8px}
.nbody{flex:1;overflow-y:auto;padding:10px 12px 14px;font-family:var(--hand)}
.nhead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-size:12px;color:var(--ink2);margin-bottom:6px}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clues li{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;font-size:15.5px;line-height:1.55}
.clues li .no{font-family:var(--serif);font-weight:900;font-size:13px;border:2px solid var(--ink);height:24px;display:flex;align-items:center;justify-content:center;background:#fff}
.clues li small{grid-column:2;font-size:11px;color:var(--mute);font-family:var(--serif);margin-top:-4px}
.clues li.new{animation:inkIn .9s ease-out both}
.clues li.derive .no{background:var(--verm);border-color:var(--verm);color:#fff}
@keyframes inkIn{0%{opacity:0;transform:translateX(-10px)}40%{opacity:1}100%{opacity:1;transform:none}}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.qs li{border:2px solid var(--ink);background:#fff;padding:7px 10px;font-size:15px;line-height:1.5}
.qs li.next{border-width:3px;box-shadow:3px 3px 0 var(--ink)}
.qs li .q::before{content:"？ ";font-weight:900;font-family:var(--serif)}
.qs li .nx{font-family:var(--serif);font-size:11px;background:var(--ink);color:#fff;padding:0 6px;margin-left:6px;vertical-align:2px}
.qs li button{border:0;background:transparent;font-family:var(--serif);font-size:12px;text-decoration:underline;color:var(--ink2);padding:2px 0}
.qs li .h{font-size:14px;color:var(--ink2);border-top:1.5px dashed var(--ink2);margin-top:5px;padding-top:4px}
.tl{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:11px;table-layout:fixed}
.tl th,.tl td{border:1px solid rgba(20,20,20,.35);text-align:center;padding:3px 0;height:24px}
.tl th{font-weight:700;background:var(--paper2)}
.tl td.o{font-family:var(--hand);font-size:12px;font-weight:700;background:#fff}
.tl td.e{background-image:var(--dots);background-size:4px 4px}
.tl td.now{box-shadow:inset 0 0 0 2px var(--ink)}
.tl th.who{width:44px;text-align:left;padding-left:4px}
.legend{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.6;font-family:var(--serif)}
.endsrow{display:flex;gap:8px;margin-top:12px;font-family:var(--serif);font-size:12px}
.endsrow span{border:2px solid var(--ink);padding:2px 8px;opacity:.35}
.endsrow span.got{opacity:1;background:var(--ink);color:#fff}

/* toast */
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 14px;font-family:var(--hand);font-size:15px;animation:toast 3.2s ease both;width:100%}
.toast b{font-family:var(--serif);color:var(--verm);margin-right:6px}
@keyframes toast{0%{opacity:0;transform:translateY(-14px) rotate(-2deg)}8%{opacity:1;transform:rotate(-1deg)}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(232,227,216,.94);background-image:var(--dots);background-size:6px 6px;overflow-y:auto}
.card{background:var(--paper);border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:26px 30px;max-width:640px;width:100%;position:relative}
.bigbtn{border:4px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:900;font-size:20px;padding:10px 26px;letter-spacing:.15em;box-shadow:4px 4px 0 #888;transition:transform .08s}
.bigbtn:hover{transform:translate(-2px,-2px)}
.bigbtn.alt{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* title */
#title .card{max-width:980px;display:grid;grid-template-columns:1.1fr 1fr;gap:0;padding:0;overflow:hidden}
.tl-art{border-right:5px solid var(--ink);background:#fff;position:relative;min-height:420px}
.tl-art svg{width:100%;height:100%;display:block;position:absolute;inset:0}
.tl-txt{padding:30px 30px 26px;display:flex;flex-direction:column;gap:14px}
.tl-txt h1{margin:0;font-size:54px;line-height:1.05;font-weight:900;letter-spacing:.04em}
.tl-txt h1 span{display:block;font-size:15px;letter-spacing:.5em;font-weight:500;margin-bottom:10px;color:var(--ink2)}
.tl-txt .one{font-family:var(--hand);font-size:20px;line-height:1.6;border-left:5px solid var(--verm);padding-left:12px;margin:0}
.tl-txt ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.tl-txt .meta{font-size:12.5px;color:var(--mute)}
.stamp{display:inline-block;border:3px solid var(--verm);color:var(--verm);font-weight:900;padding:2px 10px;transform:rotate(-6deg);font-size:14px;letter-spacing:.1em}

/* cutscene */
#cut{align-items:flex-start;padding:16px}
.cpage{max-width:1180px;width:100%;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:14px;background:var(--paper);border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.cpanel{border:4px solid var(--ink);background:#fff;position:relative;overflow:hidden;height:calc((100vh - 130px - (var(--rows) - 1) * 12px) / var(--rows));min-height:170px;opacity:0}
.cpanel.show{animation:stamp .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(1.08) rotate(-1deg)}100%{opacity:1;transform:none}}
.cpanel svg{position:absolute;inset:0;width:100%;height:100%}
.cpanel .cap{position:absolute;left:-4px;top:-4px;background:#fff;border:3px solid var(--ink);padding:4px 10px;font-size:14px;max-width:70%;line-height:1.45;z-index:2}
.cpanel .bub{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:50%/44%;padding:10px 18px;font-family:var(--hand);font-size:18px;line-height:1.4;z-index:2;text-align:center;max-width:60%}

.cpanel.black{background:var(--ink);display:flex;align-items:center;justify-content:center}
.cpanel.black p{color:#fff;font-weight:900;font-size:clamp(26px,3.6vw,44px);letter-spacing:.2em;margin:0;text-align:center;line-height:1.5;white-space:nowrap}
.cpanel.black p small{white-space:normal}
.cpanel.black p small{display:block;font-size:14px;letter-spacing:.1em;font-weight:500;opacity:.75}
.cfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.cfoot .bigbtn{font-size:17px;padding:8px 20px}

/* ending */
#ending .card{max-width:620px;text-align:center}
#ending h2{font-size:15px;letter-spacing:.4em;margin:0 0 4px;color:var(--ink2)}
#ending h1{font-size:44px;margin:0 0 10px;font-weight:900}
#ending .epi{font-family:var(--hand);font-size:18px;line-height:1.8;margin:6px 0 16px}
#ending .stats{display:flex;justify-content:center;gap:24px;margin:10px 0 18px;font-size:13px;color:var(--ink2)}
#ending .stats b{display:block;font-size:30px;color:var(--ink);font-weight:900}

/* flip */
#flip{position:fixed;inset:0;z-index:70;perspective:1800px;pointer-events:none;overflow:hidden}
.leaf{position:absolute;inset:0;transform-origin:0 50%;background:var(--paper);border-left:6px solid var(--ink);backface-visibility:hidden;transform:rotateY(-180deg)}
.leaf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%);animation:shade .5s ease-out forwards}
.leaf.ghost{background-image:var(--dots);background-size:7px 7px}
.leaf.ghost::before{content:"";position:absolute;inset:6% 6%;border:5px solid rgba(20,20,20,.5);box-shadow:inset 0 0 0 0 transparent;background:linear-gradient(transparent 49%,rgba(20,20,20,.5) 49% 51%,transparent 51%),linear-gradient(90deg,transparent 59%,rgba(20,20,20,.5) 59% 61%,transparent 61%)}
.leaf.go{animation:leafIn .5s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes leafIn{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}
@keyframes shade{to{opacity:0}}
.leaf.final{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.leaf.final .ch{font-size:15px;letter-spacing:.6em;color:var(--ink2)}
.leaf.final .no{font-size:clamp(60px,12vw,120px);font-weight:900;line-height:1}
.leaf.final .tm{font-family:var(--hand);font-size:22px}
.leaf.final .sub{font-size:14px;color:var(--ink2);font-family:var(--hand)}
#flip.out{animation:flipOut .5s ease-in forwards}
@keyframes flipOut{to{opacity:0;transform:translateX(-30px)}}

/* fixed chrome */
#snd{position:fixed;top:20px;right:max(26px,calc((100vw - 1420px)/2 + 26px));z-index:80;width:40px;height:40px;border:3px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0}
#snd svg{width:24px;height:24px}
#back{position:fixed;left:12px;bottom:7px;z-index:80;font-size:12px;color:var(--ink2);text-decoration:none;background:rgba(251,248,241,.9);padding:1px 6px}
#back:hover{color:var(--ink);text-decoration:underline}

.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.demoTag{font-size:11px;border:2px solid var(--verm);color:var(--verm);padding:0 6px;font-weight:900;letter-spacing:.1em}

/* ---------- mobile ---------- */
@media (max-width:860px){
  .page{height:auto;min-height:100dvh;padding:8px 10px 40px;gap:10px}
  .topbar{gap:8px;padding:6px 54px 10px 10px;position:sticky;top:0;z-index:20}
  .brand,.analog{display:none}
  .loopno{border:0;padding:0;font-size:14px}
  .loopno b{font-size:20px}
  .digits{font-size:25px}
  .clockbox{position:static}
  .tbar{position:absolute;left:-4px;right:-4px;bottom:-4px;height:7px;border-width:2px;min-width:0}
  .tbar .mk{top:-3px;height:9px}
  #snd{top:12px;right:16px}
  body{position:relative}
  #back{position:absolute;bottom:8px}
  #toast{top:auto;bottom:24px}
  #map{max-width:300px}
  #btnNote{display:block}
  .tbtn{padding:4px 9px;font-size:13px}
  .main{flex-direction:column}
  .colR{flex:0 0 auto}
  #scene{height:auto;aspect-ratio:800/420}
  .dlgPanel{min-height:0}
  .log{max-height:32vh;min-height:110px}
  .cpanel{height:auto;aspect-ratio:5/3}
  .ln{font-size:15px}
  .notePanel{min-height:340px}
  #title .card{grid-template-columns:1fr}

<script>
(()=>{
'use strict';
/* =========================================================
   基本設定
   ========================================================= */
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = DEMO ? 0.55 : 1;           // 展示模式加快動畫
const T_END = 180;                       // 7:03:00
const SKEY = 'g15_three_minute_morning_v1';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms * SPEED));
const fmtT = t => { t = Math.max(0, Math.min(T_END, t)); const m = Math.floor(t / 60), s = t % 60; return `7:0${m}:${String(s).padStart(2, '0')}`; };
const fmt = s => s.replace(/\*(.+?)\*/g, '<em class="v">$1</em>');

/* =========================================================
   存檔（知識保留）
   ========================================================= */
function freshSave(){ return { v:1, loop:1, k:{}, korder:[], obs:{gm:{},ll:{},kai:{},cat:{}}, end:{}, actions:0, started:false, sound:true, hints:{} }; }
let S = freshSave();
function loadSave(){ try { const s = JSON.parse(localStorage.getItem(SKEY)); if (s && s.v === 1) return Object.assign(freshSave(), s); } catch(e){} return null; }
function persist(){ if (DEMO) return; try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch(e){} }
function wipeSave(){ try { localStorage.removeItem(SKEY); } catch(e){} }

/* =========================================================
   聲音（Web Audio 合成）
   ========================================================= */
const AU = {
  ctx:null, master:null, noise:null, on:true,
  init(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C();
      const comp = this.ctx.createDynamicsCompressor();
      this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 0.7 : 0;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; const b = this.ctx.createBuffer(1, len, len); const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    } catch(e){ this.ctx = null; }
  },
  set(on){ this.on = on; if (this.master) this.master.gain.setTargetAtTime(on ? 0.7 : 0, this.ctx.currentTime, 0.05); },
  ok(){ return this.ctx && this.on && this.ctx.state === 'running'; },
  tone(type, f, t, dur, peak, f2, att = 0.005){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  nz(t, dur, peak, ftype, freq, q = 1, freq2){
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; s.loop = true; f.type = ftype; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  // 鬧鐘：兩個三角波（1046/1568Hz）＋方波鈴舌，四連打 ×3 組
  alarm(){ if (!this.ok()) return; const t0 = this.ctx.currentTime + 0.02;
    for (let b = 0; b < 3; b++) for (let k = 0; k < 5; k++) { const t = t0 + b * 0.62 + k * 0.085;
      this.tone('triangle', 1046, t, 0.07, 0.16); this.tone('triangle', 1568, t, 0.06, 0.08); this.tone('square', 2093, t, 0.02, 0.025); } },
  // 腳步：帶通雜訊 + 低頻 sine 敲擊
  steps(n = 2, stair = false){ if (!this.ok()) return; const t0 = this.ctx.currentTime + 0.01;
    for (let i = 0; i < n; i++) { const t = t0 + i * (stair ? 0.17 : 0.24);
      this.nz(t, 0.08, 0.32, 'bandpass', (stair ? 520 : 360) + Math.random() * 140, 1.8);
      this.tone('sine', stair ? 130 : 95, t, 0.07, 0.22, 60); } },
  // 翻頁：高通雜訊掃頻 700→5200Hz
  flip(i = 0){ if (!this.ok()) return; const t = this.ctx.currentTime + 0.01;
    this.nz(t, 0.32, 0.22, 'highpass', 700 + i * 200, 0.7, 5200); this.tone('sine', 80, t + 0.24, 0.12, 0.12, 50); },
  // 滴答：短促高通雜訊 + 高音 sine；最後 30 秒音高提高
  tick(hurry = false, soft = false){ if (!this.ok()) return; const t = this.ctx.currentTime + 0.005; const p = soft ? 0.35 : 1;
    this.nz(t, 0.018, 0.22 * p, 'highpass', hurry ? 5200 : 3600, 0.8); this.tone('sine', hurry ? 2400 : 1750, t, 0.03, 0.05 * p); },
  // 寫字聲＋小鈴（得到線索）
  clue(){ if (!this.ok()) return; const t0 = this.ctx.currentTime + 0.01;
    for (let i = 0; i < 6; i++) this.nz(t0 + i * 0.045 + Math.random() * 0.01, 0.035, 0.1, 'bandpass', 1800 + Math.random() * 1600, 2.2);
    this.tone('sine', 1046, t0 + 0.32, 0.5, 0.12); this.tone('sine', 1568, t0 + 0.42, 0.6, 0.1); },
  click(){ if (!this.ok()) return; this.nz(this.ctx.currentTime + 0.002, 0.025, 0.12, 'bandpass', 1300, 1.5); },
  knock(){ if (!this.ok()) return; const t0 = this.ctx.currentTime + 0.01;
    for (let i = 0; i < 3; i++) { const t = t0 + i * 0.16; this.tone('sine', 170, t, 0.09, 0.35, 120); this.nz(t, 0.04, 0.14, 'bandpass', 900, 2); } },
  shout(){ if (!this.ok()) return; const t = this.ctx.currentTime + 0.01;
    this.tone('sine', 140, t, 0.6, 0.6, 40); this.nz(t, 0.35, 0.3, 'lowpass', 900, 0.7, 200); this.tone('sawtooth', 220, t, 0.25, 0.05, 110); },
  bulb(){ if (!this.ok()) return; const t = this.ctx.currentTime + 0.01;
    this.nz(t, 0.03, 0.3, 'highpass', 2500); this.tone('sine', 60, t + 0.05, 0.6, 0.05); this.tone('sine', 880, t + 0.05, 0.4, 0.05, 1320); },
  melody(good){ if (!this.ok()) return; const t0 = this.ctx.currentTime + 0.05;
    const notes = good ? [523,659,784,880,1046,880,784,1046,1175,1318] : [440,523,587,523,440,392,440];
    notes.forEach((f, i) => { const t = t0 + i * 0.2; this.tone('triangle', f, t, 0.5, 0.12); this.tone('sine', f / 2, t, 0.6, 0.05); }); }
};

/* =========================================================
   世界資料
   ========================================================= */
const LOCS = {
  room:{name:'我的房間', tag:'3F・3A', adj:['hall']},
  hall:{name:'三樓走廊', tag:'3F', adj:['room','stair']},
  stair:{name:'樓梯間', tag:'3F↕1F', adj:['hall','top','lobby']},
  top:{name:'四樓・房東家門口', tag:'4F', adj:['stair']},
  lobby:{name:'一樓騎樓・信箱', tag:'1F', adj:['stair']}
};
const CHAR = { gm:'秋月婆婆', ll:'周伯', kai:'小凱', cat:'麻糬', me:'我' };
const POSCODE = { room:'房', hall:'廊', stair:'梯', top:'四', lobby:'騎', home:'3B', home4:'4F', nest:'窩', street:'街' };

const CLUES = {
  event:   '7:03，樓下。周伯大喊「*小偷！*」，抓住了送報的*小凱*。小凱丟下東西逃走了。',
  mailbox: '7:02:30，小凱打開的是 *3B——秋月婆婆的信箱*，拿出一個紅色信封。',
  suspect: '周伯認定公寓裡有人*偷信*：3B 的電費單不見了。他今天要親自*埋伏*抓人。',
  hiding:  '7:02:10 以後，周伯*躲在騎樓柱子後面*盯著信箱。',
  nest:    '信是*麻糬*叼走的！樓梯底下的紙箱窩裡有 *3B 的電費單*。麻糬 *7:01:00* 前都窩在裡面。',
  codehint:'婆婆說：她的信箱密碼是*老伴的生日*。',
  birthday:'走廊花台上的老照片背面寫著：「阿誠 *八月十五日* 生」。',
  code:    '推理：3B 信箱密碼 ＝ 老伴生日 ＝ *0815*。',
  gift:    '3B 信箱裡有*溫熱的飯糰*、*一個紅包*，和字條：「給送報的孩子：*畢業快樂*。——3B」',
  secret:  '每天偷偷替小凱準備早餐的，是*秋月婆婆*。她不敢當面給，怕孩子不好意思。',
  lastday: '今天是小凱*最後一天送報*，下禮拜他就要去台中念書了。',
  light:   '*樓梯間的燈壞了*。婆婆眼睛不好，不敢摸黑下樓。',
  bulb:    '我的書桌抽屜裡有*一顆備用燈泡*。',
  scam:    '就算婆婆親手交給小凱，周伯還是會誤會成*「騙老人家的錢」*——得先打消他的疑心。'
};
const CLUE_COUNT = Object.keys(CLUES).length;

const QUESTIONS = [
  { id:'q_event', on:k=>!k.event, q:'7:03 樓下會發生什麼事？', h:'到處看看就好，時間一到你就會知道。想看清楚的話，7:03 前待在一樓騎樓。' },
  { id:'q_mail', on:k=>k.event && !k.mailbox, q:'小凱為什麼會被當成小偷？', h:'7:02:30 左右人在一樓騎樓，看小凱打開了哪一格信箱。' },
  { id:'q_sus', on:k=>k.event && !k.suspect, q:'周伯為什麼一口咬定有小偷？', h:'7:01:40 以前到四樓敲周伯的門；或看看一樓的公告欄。' },
  { id:'q_nest', on:k=>k.suspect && !k.nest, q:'3B 不見的信，到底跑去哪了？', h:'麻糬嘴邊常黏著紙屑。牠的窩在樓梯間的紙箱裡——但 7:01 以前牠窩在裡面，不讓人碰。' },
  { id:'q_codehint', on:k=>(k.mailbox||k.suspect) && !k.codehint, q:'3B 的信箱要怎麼打開？', h:'問信箱的主人——對門的秋月婆婆（7:02 前在家，敲門就好）。' },
  { id:'q_bday', on:k=>k.codehint && !k.birthday, q:'婆婆老伴的生日是哪一天？', h:'三樓走廊、婆婆家門口的花台上，擺著一張老照片。' },
  { id:'q_gift', on:k=>k.code && !k.gift, q:'3B 信箱裡到底裝了什麼？', h:'到一樓用 0815 打開 3B 信箱。要趕在 7:02:30 小凱拿走之前。' },
  { id:'q_secret', on:k=>k.gift && !k.secret, q:'字條署名「3B」——是誰在照顧小凱？', h:'帶著這件事去問秋月婆婆。' },
  { id:'q_last', on:k=>k.secret && !k.lastday, q:'為什麼偏偏是今天放紅包？', h:'7:02 以後到一樓跟小凱聊聊，或看看他的腳踏車。' },
  { id:'q_tell', on:k=>k.secret && k.lastday && !k.light, q:'怎麼讓婆婆親手把紅包交給小凱？', h:'把「今天是最後一天」告訴婆婆。小凱 7:02 才到，但婆婆走到樓下要 45 秒——要早點說。' },
  { id:'q_bulb', on:k=>k.light && !k.bulb, q:'樓梯間的燈要怎麼修？', h:'翻翻你自己房間的書桌抽屜。' },
  { id:'q_final', on:(k,e)=>k.nest && k.secret && k.lastday && k.light && k.bulb && !e.good, q:'把所有事湊進同一個早晨。', h:'參考順序：拿燈泡 → 換樓梯燈 → 告訴婆婆（最晚 7:02:15）→ 7:01 後搜紙箱拿電費單 → 給周伯看（四樓、樓梯間、騎樓都可以）→ 7:03 在樓下等。' },
  { id:'q_normal', on:(k,e)=>e.normal && !e.good && !(k.nest && k.secret && k.lastday && k.light && k.bulb), q:'誤會雖然沒發生，可是……還有更好的早晨嗎？', h:'婆婆其實很想親口說些什麼。去弄清楚她為什麼不敢下樓。' },
];

/* =========================================================
   世界狀態（每輪重置）
   ========================================================= */
let W = null;
function freshWorld(){
  return { t:0, loc:'room', items:{bulb:false,bill:false,gift:false}, lightFixed:false, giftInBox:true, boxOpen:false,
    landlordSuspicious:true, grandmaDepart:null, kaiGotGift:false, kaiOpened:false, kaiTookFromBox:false,
    flags:{}, log:[], sel:null, dial:[0,0,0,0], mode:'idle', visited:{room:true}, actions:0 };
}

// --- 角色位置 ---
function posGm(t){
  const d = W.grandmaDepart;
  if (d && t >= d.t) {
    const dt = t - d.t;
    if (d.from === 'stair') return dt < 30 ? 'stair' : 'lobby';
    return dt < 15 ? 'hall' : dt < 45 ? 'stair' : 'lobby';
  }
  if (t < 120) return 'home';
  if (t < 150) return 'hall';
  return 'stair';
}
function posOf(c, t){
  switch (c) {
    case 'gm': return posGm(t);
    case 'll': return t < 100 ? 'home4' : t < 130 ? 'stair' : 'lobby';
    case 'cat': return t < 60 ? 'nest' : t < 120 ? 'hall' : 'lobby';
    case 'kai': return t < 60 ? 'away' : t < 120 ? 'street' : 'lobby';
  }
}
function visibleAt(c, loc, t = W.t){ const p = posOf(c, t); return p === loc || (p === 'nest' && loc === 'stair'); }

// --- 路徑 ---
function route(a, b){
  if (a === b) return [];
  const prev = {[a]:null}, q = [a];
  while (q.length) { const x = q.shift(); for (const y of LOCS[x].adj) if (!(y in prev)) { prev[y] = x; q.push(y); } }
  const p = []; let c = b; while (c !== a) { p.unshift(c); c = prev[c]; } return p;
}

// --- 知識 ---
let fresh = [];
function learn(id){
  if (S.k[id]) return false;
  S.k[id] = S.loop; S.korder.push(id); fresh.push(id);
  if (S.k.codehint && S.k.birthday && !S.k.code) { S.k.code = S.loop; S.korder.push('code'); fresh.push('code'); }
  persist(); return true;
}
function observe(c, p, t){ const b = Math.min(17, Math.floor(t / 10)); S.obs[c][b] = POSCODE[p] || '?'; }

/* =========================================================
   世界時間軸：每一秒的事件
   ========================================================= */
function happen(loc, text){ if (W.loc === loc) W.pending.push({k:'narr', ts:fmtT(W.t), text}); }
function worldTick(t){
  // 觀察記錄

  const gmDep = W.grandmaDepart;

/* --- 執行一個行動 --- */
async function perform(act){
  if (busy || W.mode !== 'idle') return;
  busy = true; AU.click();
  S.actions++; W.actions++;
  fresh = []; W.pending = [];
  if (act.move) {
    let ended = false;
    for (const nxt of act.move) {
      const from = W.loc; W.loc = nxt; W.visited[nxt] = true;
      AU.steps(3, nxt === 'stair' || from === 'stair');
      ended = await advance(COST.move);
      renderScene(true);
      if (ended) break;
    }
    if (ended) { busy = false; return; }
    W.sel = null;
    const who = ['gm','ll','kai','cat'].filter(c => visibleAt(c, W.loc));
    pushLog([L('sys', `${fmtT(W.t)}・來到${LOCS[W.loc].name}${who.length ? '。這裡有：' + who.map(c => CHAR[c]).join('、') : ''}`), ...W.pending]);
  } else {
    if (act.knock) AU.knock();
    const ended = await advance(act.cost);
    if (ended) { busy = false; return; }
    const out = act.fn ? act.fn() : [];
    pushLog([...(out || []), ...W.pending]);
  }
  persist();
  afterLearn();
  busy = false;
  renderAll();
}

async function advance(sec){
  const t0 = W.t, t1 = Math.min(T_END, W.t + sec);
  for (let t = t0 + 1; t <= t1; t++) { W.t = t; worldTick(t); }
  // 動畫：時鐘一格一格跳
  const steps = Math.min(sec, 10), dur = (DEMO ? 18 : 34) * sec;
  for (let i = 1; i <= steps; i++) {
    const tt = Math.round(t0 + (t1 - t0) * i / steps);
    renderClock(tt); AU.tick(tt >= 150);
    await sleep(dur / steps);
  }
  renderClock(W.t);
  if (W.t >= T_END) { await morningEvent(); return true; }
  return false;
}

/* =========================================================
   7:03 判定
   ========================================================= */
function resolve(){
  const gmHere = posGm(T_END) === 'lobby';
  if (gmHere) return W.landlordSuspicious ? 'scam' : 'good';
  if (W.landlordSuspicious && W.kaiOpened) return 'thief';
  return W.kaiGotGift ? 'handed' : 'calm';
}

async function morningEvent(){
  W.mode = 'event';
  const out = resolve();
  fresh = [];
  pushLog(W.pending || []);
  if (out === 'thief' || out === 'scam') {
    learn('event');
    if (W.loc === 'lobby' || W.loc === 'stair') learn('mailbox');
    if (out === 'scam') learn('scam');
    if (W.loc === 'lobby' && W.landlordSuspicious) learn('hiding');
  }
  persist();
  if (!RM) { $('#page').classList.remove('shake'); void $('#page').offsetWidth; $('#page').classList.add('shake'); }
  if (out === 'thief' || out === 'scam') AU.shout();
  await sleep(500);
  await showCut(out);
  if (out === 'good' || out === 'calm' || out === 'handed') {
    S.end[out === 'good' ? 'good' : 'normal'] = true; persist();
    showEnding(out);
  } else {
    const newly = fresh.slice();
    await flipTo(S.loop + 1);
    newly.forEach((id, i) => setTimeout(() => toast(id), 300 + i * 500));
  }
}

const PAPER = '#fbf8f1';

const G = (x, y, s, flip, inner) => `<g transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})">${inner}</g>`;

function grandma(o){

let lastLoc = null;
function renderScene(force){
  const sc = buildScene(W.loc);
  const k = S.k;
  let s = sc.bg;
  const ordered = [...sc.hs.filter(h => !h.who), ...sc.hs.filter(h => h.who)];
  for (const h of ordered) {
    if (W.loc === 'lobby' && h.id === 'gate') s += sc.pillar || '';
    if (h.deco) { s += h.art; continue; }
    const [x, y, w, hh] = h.hit;
    s += `<g class="hs${h.clue && k[h.clue] ? ' known' : ''}${W.sel === h.id ? ' sel' : ''}" data-hs="${h.id}" tabindex="0" role="button" aria-label="${h.label}"><g>${h.art}</g><rect class="hit" x="${x}" y="${y}" width="${w}" height="${hh}" rx="6"/></g>`;
  }
  s += sc.fg || '';
  const el = $('#scene');
  el.innerHTML = s;
  if (force && lastLoc !== W.loc && !RM) { el.classList.remove('enter'); void el.getBoundingClientRect(); el.classList.add('enter'); }
  lastLoc = W.loc;
  $('#caption').innerHTML = `<small>${LOCS[W.loc].tag}</small>${LOCS[W.loc].name}`;
  // chips
  const chips = ordered.filter(h => !h.deco && h.label);
  $('#chips').innerHTML = `<span class="lbl">這裡有：</span>` + chips.map(h => `<button class="chip${h.exit ? ' exit' : ''}${h.who ? ' who' : ''}${W.sel === h.id ? ' sel' : ''}${h.clue && k[h.clue] ? ' k' : ''}" data-hs="${h.id}">${h.label}</button>`).join('');
}

function renderClock(t){
  $('#digits').textContent = fmtT(t);
  $('#digits').classList.toggle('hurry', t >= 150 && t < T_END && !RM);
  $('#tfill').style.width = (t / T_END * 100) + '%';
  const ma = (t / 60) / 60 * 360, sa = (t % 60) * 6, ha = 210 + t / 3600 * 30;
  const p = (a, r) => `${22 + Math.sin(a * Math.PI / 180) * r} ${22 - Math.cos(a * Math.PI / 180) * r}`;
  $('#analog').innerHTML = `<circle cx="22" cy="22" r="19" fill="#fff" stroke="#141414" stroke-width="3"/><path d="M22 22 L${p(ha, 10)}" stroke="#141414" stroke-width="3.5" stroke-linecap="round"/><path d="M22 22 L${p(ma, 15)}" stroke="#141414" stroke-width="2.5" stroke-linecap="round"/><path d="M22 22 L${p(sa, 16)}" stroke="#141414" stroke-width="1.2"/><circle cx="22" cy="22" r="2" fill="#141414"/>`;
}

function renderLog(nNew = 0){
  const el = $('#log');

  el.innerHTML = show.map((l, i) => {
    const old = i < show.length - nNew ? ' old' : '';
    if (l.k === 'say') return `<div class="ln say${old}"><span class="who">${CHAR[l.who] || ''}</span>${fmt(l.text)}</div>`;

    { span:3, svg: lobbyBG() + landlord({x:200, y:214, s:1.05, mood:'sheep', scratch:true}) + cat({x:320, y:214, s:.9, mood:'sleep'}), bub:{ text:'咳……信是貓叼走的啦。', x:50, y:6 }, cap:'7:03:01——秒針，第一次走過了七點零三分。' }
  ],
  calm: () => [
    { span:3, svg: lobbyBG() + landlord({x:250, y:214, s:1.05, mood:'yawn', paper:true}), cap:'周伯拿著報紙，打了個大大的呵欠。' },
    { span:3, svg: lobbyBG() + kai({x:210, y:214, s:1.05, env:true, reach:true}), cap:'小凱拿出紅包，愣了一下，朝樓上鞠了個躬。' },
    { span:3, svg: stairBG(W.lightFixed) + `<rect x="250" y="40" width="110" height="100" fill="#fff" ${st(4)}/>` + grandma({x:305, y:200, s:.9}), cap:'樓梯間的窗口，婆婆輕輕揮了揮手。他沒有看見。' },
    { span:3, svg: `<rect width="400" height="240" fill="#fff"/>` + bigClock(200, 120, 92, 1), cap:'7:03:01　誤會沒有發生。' }
  ],
  handed: () => [
    { span:3, svg: lobbyBG() + kai({x:260, y:214, s:1.05, flip:true}) + `<path d="M0 150 Q80 140 150 132" ${st(14)} stroke="#141414"/><path d="M0 150 Q80 140 150 132" stroke="#fff" stroke-width="8" fill="none"/>` + envelope(165, 128, 80, .8), bub:{ text:'這是 3B 要給你的。', x:4, y:6 } },
    { span:3, svg: `<rect width="400" height="240" fill="#fff"/>` + kai({x:200, y:250, s:1.3, mood:'moved', env:true, reach:true}), bub:{ text:'……幫我跟 3B 說謝謝。', x:50, y:8 } },
    { span:3, svg: stairBG(W.lightFixed) + `<rect x="250" y="40" width="110" height="100" fill="#fff" ${st(4)}/>` + grandma({x:305, y:200, s:.9}), cap:'婆婆在樓梯間的窗口，看著腳踏車騎遠。' },
    { span:3, svg: `<rect width="400" height="240" fill="#fff"/>` + bigClock(200, 120, 92, 1), cap:'7:03:01　誤會沒有發生。' }
  ]
};

let cutResolve = null, cutAll = null;
function showCut(type){
  return new Promise(async res => {
    W.mode = 'cut';
    const panels = CUTS[type]();
    const el = $('#cut'); el.classList.remove('hidden');
    const label = { thief:'7:03　誤會', scam:'7:03　又一次誤會', good:'7:03', calm:'7:03', handed:'7:03' }[type];
    const rows = Math.ceil(panels.reduce((a, p) => a + p.span, 0) / 6);
    el.innerHTML = `<div class="cpage" style="--rows:${rows}">${panels.map(p => p.black
      ? `<div class="cpanel black" style="grid-column:span ${p.span}"><p>${p.text}<small>${p.small || ''}</small></p></div>`
      : `<div class="cpanel" style="grid-column:span ${p.span}"><svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">${p.svg}</svg>${p.cap ? `<div class="cap">${p.cap}</div>` : ''}${p.bub ? `<div class="bub ${p.bub.cls || ''}" style="left:${p.bub.x}%;top:${p.bub.y}%">${p.bub.text}</div>` : ''}</div>`).join('')}
      <div class="cfoot"><span>${label}・第 ${S.loop} 輪</span><button class="bigbtn hidden" id="cutNext">${['thief','scam'].includes(type) ? '翻回第一頁 ▸' : '繼續 ▸'}</button></div></div>`;
    el.scrollTop = 0;
    const ps = [...el.querySelectorAll('.cpanel')];
    let skip = false;
    cutAll = () => { skip = true; };
    for (let i = 0; i < ps.length; i++) {
      ps[i].classList.add('show');
      if (i === 1 && ['thief','scam'].includes(type)) AU.shout(); else AU.flip(i);
      if (i === ps.length - 1 && ['thief','scam'].includes(type)) AU.alarm();
      if (!skip) await sleep(type === 'good' ? 1100 : 900);
      if (window.innerWidth < 860 && !skip) ps[i].scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'center' });
    }
    if (type === 'good') AU.melody(true); else if (type !== 'thief' && type !== 'scam') AU.melody(false);
    const b = $('#cutNext'); b.classList.remove('hidden'); b.focus({ preventScroll:true });
    b.onclick = () => { AU.click(); el.classList.add('hidden'); cutAll = null; res(); };
  });
}

/* =========================================================
   翻頁（重來）
   ========================================================= */
async function flipTo(n){
  const f = $('#flip'); f.classList.remove('hidden', 'out');
  const newly = S.korder.length;
  f.innerHTML = (RM ? '' : '<div class="leaf ghost"></div><div class="leaf ghost"></div><div class="leaf ghost"></div>') +
    `<div class="leaf final"><div class="ch">CHAPTER</div><div class="no">第 ${n} 輪</div><div class="tm">7:00:00</div><div class="sub">世界重置了。筆記本裡有 ${newly} 條線索。</div></div>`;
  const leaves = [...f.querySelectorAll('.leaf')];
  if (RM) { leaves[0].style.transform = 'none'; }
  else for (let i = 0; i < leaves.length; i++) { leaves[i].classList.add('go'); AU.flip(i); await sleep(i < leaves.length - 1 ? 150 : 520); }
  startLoop(n, true);
  AU.alarm();
  await sleep(900);
  f.classList.add('out');
  await sleep(500);
  f.classList.add('hidden'); f.innerHTML = '';
}

/* =========================================================
   流程
   ========================================================= */
function startLoop(n, quiet){
  S.loop = n; S.started = true; persist();
  W = freshWorld(); W.pending = [];
  lastLoc = null; hintOpen = {};
  const intro = [];
  if (n === 1) {
    intro.push(L('narr', '「鈴——鈴——鈴——」'), L('narr', '七點整。老鬧鐘吵得整個房間都在震。'));
    intro.push(L('tut', '點畫面裡的東西或人物來行動（手機可以點下方的名稱）。每個動作都要花幾秒，上方的時鐘會往前走——<b>只有你行動時，時間才會前進</b>。7:03，樓下會發生一件事。'));
  } else {
    intro.push(L('narr', '「鈴——鈴——鈴——」'), L('narr', '又是七點整。世界什麼都不記得了。'), L('think', `第 ${n} 次。……可是，筆記本裡的字還在。`));
    if (DEMO && n === 3 && !S.flags_demo) { intro.push(L('sys', '展示模式：從第 3 輪開始，筆記本已有兩條線索。看看右邊「還不知道的事」。')); S.flags_demo = true; }
  }
  W.log = []; pushLog(intro);
  if (!quiet) AU.alarm();
  W.mode = 'idle';
  renderAll();
  renderScene(true);
}

function showEnding(type){
  W.mode = 'ending';
  const el = $('#ending'); el.classList.remove('hidden');
  const good = type === 'good';
  const epi = good
    ? '婆婆第一次親口對小凱說了「畢業快樂」。<br>周伯把電費單還給婆婆，順手買了一袋貓飼料。<br>鬧鐘再也沒有在七點整響第二次。'
    : type === 'handed'
      ? '紅包送到了，謝謝也說了——只是隔了一個人。<br>婆婆一直不知道，那句謝謝有沒有送到她心裡。'
      : '誤會沒有發生，小凱平平安安地騎走了。<br>只是有些話，終究沒有說出口。';
  const art = good ? `<svg viewBox="0 0 460 170" style="width:100%;max-width:440px;display:block;margin:0 auto 10px;border:4px solid #141414;background:#fff"><rect y="140" width="460" height="30" fill="url(#t1)"/><path d="M0 140 H460" ${st(3)}/>${grandma({x:110, y:150, s:.85, give:true})}${envelope(158, 100, 8, .6)}${kai({x:210, y:150, s:.8, flip:true, mood:'moved'})}${landlord({x:310, y:150, s:.8, mood:'sheep', scratch:true})}${cat({x:400, y:150, s:.8, mood:'sleep'})}</svg>`
      : `<svg viewBox="0 0 460 170" style="width:100%;max-width:440px;display:block;margin:0 auto 10px;border:4px solid #141414;background:#fff"><rect width="460" height="170" fill="url(#t1)" opacity=".5"/>${bigClock(230, 85, 68, 1)}</svg>`;
  el.innerHTML = `<div class="card">${art}<h2>${good ? '好結局' : '普通結局'}</h2><h1>${good ? '早安，小凱' : '平靜的早晨'}</h1><p class="epi">${epi}</p>
    <div class="stats"><div><b>${S.loop}</b>輪</div><div><b>${S.korder.length}/${CLUE_COUNT}</b>線索</div><div><b>${S.actions}</b>個行動</div></div>
    ${good ? '' : '<p style="font-size:14px;color:#555;margin:0 0 16px">筆記本還在。也許，還有更好的早晨。</p>'}
    <div class="row" style="justify-content:center">${good ? '' : '<button class="bigbtn" id="eAgain">再過一次這個早晨</button>'}<button class="bigbtn ${good ? '' : 'alt'}" id="eTitle">回到標題</button></div>
    <div class="endsrow" style="justify-content:center"><span class="${S.end.normal ? 'got' : ''}">普通結局</span><span class="${S.end.good ? 'got' : ''}">好結局</span></div></div>`;
  const again = $('#eAgain');
  if (again) again.onclick = async () => { AU.click(); el.classList.add('hidden'); await flipTo(S.loop + 1); };
  $('#eTitle').onclick = () => { AU.click(); el.classList.add('hidden'); toTitle(); };
}

function toTitle(){
  W && (W.mode = 'title');
  $('#title').classList.remove('hidden');
  const has = S.started && (S.loop > 1 || S.korder.length);
  $('#btnStart').textContent = has ? `繼續（第 ${S.loop} 輪）` : '開始';
  $('#btnNew').classList.toggle('hidden', !has);
  $('#titleMeta').innerHTML = (has ? `筆記本：${S.korder.length} / ${CLUE_COUNT} 條線索・` : '') + '約 10–20 分鐘・兩種以上的結局・自動存檔' + (DEMO ? '　<span class="demoTag">DEMO</span>' : '');
}

function pause(on){
  if (!W || ['title','cut','ending'].includes(W.mode)) return;
  if (on && W.mode !== 'idle' && W.mode !== 'dial') return;
  $('#pause').classList.toggle('hidden', !on);
  W.paused = on;
}

/* =========================================================
   互動
   ========================================================= */
function select(id){
  if (busy || !W || (W.mode !== 'idle')) return;
  AU.click();
  W.sel = (W.sel === id && !id.startsWith('go:')) ? null : id;
  renderScene(false); renderActs(); renderMap();
}

document.addEventListener('pointerdown', () => AU.init(), { passive:true });
document.addEventListener('keydown', () => AU.init());

$('#scene').addEventListener('click', e => { const g = e.target.closest('.hs'); if (g) select(g.dataset.hs); });
$('#scene').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.hs')) { e.preventDefault(); select(e.target.closest('.hs').dataset.hs); } });
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-hs]'); if (b) select(b.dataset.hs); });
$('#map').addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (!g || !W || W.mode !== 'idle' || busy) return;
  const id = g.dataset.go; if (id === W.loc) return;
  if (W.sel === 'go:' + id) { const a = actionsFor('go:' + id)[0]; if (a) perform(a); }
  else select('go:' + id);
});
$('#acts').addEventListener('click', e => {
  const b = e.target.closest('[data-ai]');
  if (b && W._acts) { const a = W._acts[+b.dataset.ai]; if (!a) return;
    if (a.dial) { W.mode = 'dial'; AU.click(); renderActs(); return; }
    perform(a); return; }
  const d = e.target.closest('[data-dial]');
  if (d) { const i = +d.dataset.dial; W.dial[i] = (W.dial[i] + (+d.dataset.dir) + 10) % 10; AU.tick(false); renderActs(); return; }
  if (e.target.closest('#dialCancel')) { W.mode = 'idle'; AU.click(); renderActs(); return; }
  if (e.target.closest('#dialTry')) { W.mode = 'idle'; tryDial(); }
});
async function tryDial(){
  const code = W.dial.join('');
  await perform({ key:'dial', cost: COST.dial, fn: () => {
    if (code !== '0815') return [L('narr', `「${code}」……喀、喀。轉盤卡住了——*不對*。`)];
    W.boxOpen = true;
    if (!W.giftInBox) return [L('narr', '喀啦。3B 的信箱開了——裡面空空的。')];
    learn('gift');
    return [L('narr', '喀啦。3B 的信箱開了。'), L('narr', '裡面有*一顆還溫溫的飯糰*、*一個紅包*，和一張字條：「給送報的孩子：*畢業快樂*。——3B」')];
  }});
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { AU.click(); tab = t.dataset.tab; renderNote(); }));
$('#nbody').addEventListener('click', e => { const h = e.target.closest('[data-hint]'); if (h) { AU.click(); hintOpen[h.dataset.hint] = true; renderNote(); } });
$('#btnNote').addEventListener('click', () => { AU.click(); $('#notebook').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); });
$('#btnPause').addEventListener('click', () => pause(true));
$('#pResume').addEventListener('click', () => { AU.click(); pause(false); });
$('#pGiveup').addEventListener('click', async () => { AU.click(); pause(false); if (busy || W.mode !== 'idle') return; busy = true; W.pending = []; fresh = []; await advance(T_END - W.t); busy = false; });
$('#pTitle').addEventListener('click', () => { AU.click(); pause(false); toTitle(); });
$('#cut').addEventListener('click', e => { if (!e.target.closest('#cutNext') && cutAll) cutAll(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#pause').classList.contains('hidden')) pause(false); else if (W && W.mode === 'dial') { W.mode = 'idle'; renderActs(); } else pause(true); return; }
  if (!W || W.mode !== 'idle' || W.paused || busy || !$('#title').classList.contains('hidden')) return;
  if (/^[1-9]$/.test(e.key) && W._acts) { const a = W._acts[+e.key - 1]; if (a) { e.preventDefault(); if (a.dial) { W.mode = 'dial'; renderActs(); } else perform(a); } }
});

$('#btnStart').addEventListener('click', () => { AU.init(); $('#title').classList.add('hidden'); startLoop(S.started ? S.loop : 1); });
$('#btnNew').addEventListener('click', () => { if (!confirm('要清除筆記本，從第一輪重新開始嗎？')) return; AU.init(); wipeSave(); const snd = S.sound; S = freshSave(); S.sound = snd; $('#title').classList.add('hidden'); startLoop(1); });

// 聲音開關
function renderSnd(){ $('#snd').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#141414"/>${S.sound ? '<path d="M16 9q2 3 0 6M18.5 6.5q4.5 5.5 0 11"/>' : '<path d="M16 9l6 6M22 9l-6 6"/>'}</svg>`; $('#snd').setAttribute('aria-pressed', S.sound ? 'true' : 'false'); }
$('#snd').addEventListener('click', () => { AU.init(); S.sound = !S.sound; AU.set(S.sound); persist(); renderSnd(); AU.click(); });

// 環境滴答聲：閒置時每秒一聲，最後 30 秒加快到每 0.5 秒
let lastAmb = 0;
setInterval(() => {
  if (!W || W.mode !== 'idle' || W.paused || busy || document.hidden) return;
  if (!$('#title').classList.contains('hidden')) return;
  const now = performance.now(), per = W.t >= 150 ? 500 : 1000;
  if (now - lastAmb >= per) { lastAmb = now; AU.tick(W.t >= 150, true); }
}, 100);
document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend(); else if (S.sound) AU.ctx.resume(); });

/* --- 標題插畫 --- */
function titleArt(){
  let s = `<rect width="500" height="460" fill="#fff"/><rect width="500" height="460" fill="url(#t1)" opacity=".55"/>`;
  s += `<g opacity=".9">${speed(250, 200, 44, 150, 520)}</g>`;
  s += `<circle cx="250" cy="200" r="150" fill="#fbf8f1" ${st(6)}/>`;
  s += `<circle cx="165" cy="72" r="40" fill="url(#t3)" ${st(5)}/><circle cx="335" cy="72" r="40" fill="url(#t3)" ${st(5)}/><path d="M250 50 v-20 M226 30 h48" ${st(6)}/>`;
  s += bigClock(250, 200, 128, 0).replace('<circle cx="250" cy="200" r="128" fill="#fff"', '<circle cx="250" cy="200" r="128" fill="#fff"');
  s += `<path d="M150 340 l-30 40 M350 340 l30 40" ${st(8)}/>`;
  s += `<path d="M90 120 l-30 -12 M84 160 l-34 0 M410 120 l30 -12 M416 160 l34 0" ${st(5)}/>`;
  s += `<text x="250" y="436" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="900" font-size="34" letter-spacing="6">鈴——鈴——</text>`;
  s += grandma({x:70, y:450, s:.9}) + cat({x:430, y:450, s:1});
  $('#titleArt').innerHTML = s;
}

/* --- 開機 --- */
const saved = loadSave();
if (saved && !DEMO) S = saved;
AU.on = S.sound;
renderSnd(); titleArt();
W = freshWorld(); W.pending = [];
if (DEMO) {
  S = freshSave(); S.sound = AU.on;
  S.k = { event:1, mailbox:2 }; S.korder = ['event','mailbox']; S.started = true;
  S.obs.kai = {12:'騎',13:'騎',14:'騎',15:'騎',16:'騎',17:'騎'}; S.obs.ll = {13:'騎',14:'騎',15:'騎',16:'騎',17:'騎'};
  $('#title').classList.add('hidden');
  startLoop(3, true);
  tab = 'qs'; renderNote();
} else {
  renderAll();
  toTitle();
}
// 給自動化測試用的唯讀狀態
window.__g15 = { get t(){ return W.t; }, get loc(){ return W.loc; }, get loop(){ return S.loop; }, get mode(){ return W.mode; }, get k(){ return Object.keys(S.k); }, get end(){ return S.end; }, get busy(){ return busy; } };
})();
</script>
