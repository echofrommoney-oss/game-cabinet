<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1e9d8">
<title>墨橋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
:root{
  --paper:#f1e9d8; --paper-hi:#fbf6ec; --ink:#1c1a18; --ink2:#4a4641; --mist:#8b857a;
  --seal:#b8322a; --seal-dark:#8f241e;
  --brush:"LXGW WenKai TC","Noto Serif TC","Noto Serif CJK TC","Songti TC","STKaiti","KaiTi","PMingLiU",serif;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--serif);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
button{font-family:var(--brush);color:var(--ink);cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#lvl{position:absolute;left:22px;top:16px;max-width:42vw}
#lvlNo{font-family:var(--serif);font-size:12px;letter-spacing:.32em;color:var(--ink2);display:flex;align-items:center;gap:8px}
#lvlName{font-family:var(--brush);font-size:34px;line-height:1.1;letter-spacing:.12em;margin-top:2px}
#progress{display:flex;gap:5px;margin-top:8px}
#progress i{width:11px;height:11px;border:1.2px solid rgba(28,26,24,.35);display:block;border-radius:1px;transition:background .4s,border-color .4s,transform .4s}
#progress i.done{background:var(--seal);border-color:var(--seal)}
#progress i.done.s1{opacity:.55}#progress i.done.s2{opacity:.8}
#progress i.cur{border-color:var(--seal);transform:rotate(45deg) scale(.86)}
#inkBox{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:min(360px,40vw)}
#inkBox .lab{font-family:var(--brush);font-size:20px}
#inkBar{position:relative;flex:1;height:12px}
#inkBar .track{position:absolute;inset:4px 0;background:rgba(28,26,24,.08);border-radius:3px}
#inkFill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:6px 3px 3px 6px;
  background:linear-gradient(90deg,#1c1a18 0%,#2b2825 70%,#45403b 100%);
  -webkit-mask:linear-gradient(90deg,#000 0,#000 calc(100% - 14px),transparent 100%);
          mask:linear-gradient(90deg,#000 0,#000 calc(100% - 14px),transparent 100%);
  transition:width .12s linear}
#inkBar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--seal);opacity:.75}
#inkPct{font-family:var(--serif);font-size:13px;min-width:3.2em;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
#inkBox.flash #inkFill{animation:flash .5s 2}
@keyframes flash{50%{opacity:.25}}
#hint{position:absolute;left:22px;top:118px;max-width:min(330px,34vw);font-size:14px;line-height:1.7;color:var(--ink2);transition:opacity .5s}
#ctrl{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:12px;align-items:center}
.btn{font-size:19px;padding:9px 18px 10px;min-width:76px;min-height:46px;border:1.4px solid rgba(28,26,24,.55);border-radius:3px;
  background:rgba(251,246,236,.72);letter-spacing:.14em;transition:transform .15s,background .2s,opacity .2s}
.btn:hover{background:rgba(255,252,245,.95)}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.primary{background:var(--seal);color:#fff6ec;border-color:var(--seal-dark);min-width:104px;font-size:22px;
  box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 4.5px rgba(255,240,225,.55);border-radius:2px}
.btn.primary:hover{background:#c43a30}
#topRight{position:fixed;right:16px;top:14px;display:flex;gap:8px;z-index:30}
.icon{width:42px;height:42px;border-radius:50%;border:1.3px solid rgba(28,26,24,.45);background:rgba(251,246,236,.7);display:grid;place-items:center}
.icon svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.off svg .wave{display:none}
.icon:not(.off) svg .x{display:none}
#back{position:fixed;left:14px;bottom:10px;font-size:12px;color:var(--ink2);text-decoration:none;letter-spacing:.06em;z-index:30;opacity:.8;padding:4px}
#back:hover{opacity:1;color:var(--seal)}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--brush);font-size:clamp(26px,4.6vw,44px);
  letter-spacing:.3em;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .35s,transform .5s;text-shadow:0 0 18px var(--paper),0 0 6px var(--paper);white-space:nowrap}
#toast small{display:block;font-family:var(--serif);font-size:14px;letter-spacing:.2em;text-align:center;margin-top:6px;color:var(--ink2)}
#toast.show{opacity:1;transform:translate(-50%,-58%)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px;
  background:radial-gradient(ellipse at center,rgba(241,233,216,.55) 0%,rgba(241,233,216,.86) 70%);opacity:0;pointer-events:none;transition:opacity .45s}
.ov.show{opacity:1;pointer-events:auto}
.card{position:relative;background:rgba(251,246,236,.92);padding:34px 40px 30px;max-width:520px;width:100%;
  box-shadow:0 1px 0 rgba(28,26,24,.08),0 18px 50px -20px rgba(60,45,25,.35);border:1px solid rgba(28,26,24,.12);text-align:center}
.card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(28,26,24,.08);pointer-events:none}
.card h2{font-family:var(--brush);font-weight:400;font-size:42px;letter-spacing:.3em;margin:0 0 4px;padding-left:.3em}
.card .sub{font-size:14px;color:var(--ink2);letter-spacing:.2em}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}

#start{background:radial-gradient(ellipse at 50% 46%,rgba(241,233,216,.62) 0%,rgba(241,233,216,.5) 38%,rgba(241,233,216,.8) 72%,rgba(241,233,216,.92) 100%)}
#start .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:620px;width:100%;transform:translateY(-2vh)}
.titleRow{display:flex;align-items:flex-start;gap:14px}
#start h1{font-family:var(--brush);font-weight:400;font-size:clamp(76px,13vw,138px);line-height:1;margin:0;letter-spacing:.12em;padding-left:.12em;
  color:var(--ink);text-shadow:0 0 30px rgba(241,233,216,.9)}
#titleSeal{width:clamp(44px,6vw,62px);height:auto;margin-top:12px;transform:rotate(3deg)}
#start .tag{font-size:clamp(15px,2vw,18px);letter-spacing:.26em;margin:16px 0 0;color:var(--ink);text-shadow:0 0 12px var(--paper)}
.howto{list-style:none;padding:0;margin:18px 0 0;font-size:13.5px;line-height:1.95;color:var(--ink2);text-shadow:0 0 10px var(--paper)}
.howto b{font-weight:600;color:var(--ink)}
#bStart{margin-top:24px;min-width:150px;font-size:24px;padding:10px 26px 11px}
#levelGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:26px;width:100%;max-width:560px}
.lv{position:relative;aspect-ratio:1;border:1.2px solid rgba(28,26,24,.4);background:rgba(251,246,236,.75);font-family:var(--brush);
  font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:2px;transition:transform .15s,border-color .2s}
.lv:hover{border-color:var(--seal);transform:translateY(-2px)}
.lv .n{font-size:17px}
.lv .ss{display:flex;gap:2px}
.lv .ss i{width:5px;height:5px;background:rgba(28,26,24,.15)}
.lv .ss i.on{background:var(--seal)}
.lv.locked{opacity:.32;pointer-events:none}
.lv.sel{border-color:var(--seal);box-shadow:inset 0 0 0 1.5px var(--seal)}
.lvCap{font-size:12px;color:var(--ink2);letter-spacing:.25em;margin-top:12px}

#clear{background:radial-gradient(ellipse at center,rgba(241,233,216,.5) 0%,rgba(241,233,216,.2) 75%)}
#clear .card{max-width:430px}
.stamps{display:flex;gap:16px;justify-content:center;margin:22px 0 6px}
.stamp{width:64px;height:64px;position:relative}
.stamp .slot{position:absolute;inset:4px;border:1.2px dashed rgba(28,26,24,.22)}
.stamp img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(1.9) rotate(-12deg)}
.stamp.on img{animation:press .42s cubic-bezier(.2,1.5,.45,1) forwards}
@keyframes press{0%{opacity:0;transform:scale(1.9) rotate(-12deg)}60%{opacity:1;transform:scale(.94) rotate(var(--r,2deg))}100%{opacity:.96;transform:scale(1) rotate(var(--r,2deg))}}
.clInk{font-size:15px;letter-spacing:.18em;color:var(--ink2)}
.clInk b{font-family:var(--brush);font-size:22px;color:var(--ink);font-weight:400;margin:0 2px}
#endList{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 14px;margin:18px auto 0;max-width:360px;font-size:14px}
#endList div{display:flex;justify-content:space-between;align-items:center;font-family:var(--brush)}
#endList span{display:flex;gap:2px}
#endList i{width:7px;height:7px;background:rgba(28,26,24,.15)}
#endList i.on{background:var(--seal)}
.endTotal{font-family:var(--brush);font-size:22px;letter-spacing:.2em;margin-top:14px}
.endTotal b{color:var(--seal);font-weight:400;font-size:34px}

@media (max-width:760px), (max-aspect-ratio:1/1){
  #lvl{left:16px;top:14px;max-width:60vw}
  #lvlName{font-size:28px}
  #inkBox{left:16px;right:16px;transform:none;width:auto;top:112px}
  #hint{left:16px;right:16px;max-width:none;top:146px;font-size:13px;line-height:1.6;text-align:center}
  #ctrl{bottom:40px;gap:10px}
  .btn{font-size:17px;min-width:70px;padding:9px 14px 10px}
  .btn.primary{min-width:92px;font-size:20px}
  .card{padding:28px 22px 24px}
  .card h2{font-size:34px}
  #levelGrid{grid-template-columns:repeat(4,1fr);max-width:300px;gap:7px}
  .howto{font-size:12.5px;line-height:1.85}
  #start .tag{letter-spacing:.14em}
  #endList{grid-template-columns:repeat(2,1fr);max-width:240px}
}
@media (prefers-reduced-motion:reduce){
  .stamp.on img{animation:none;opacity:.96;transform:none}
  .ov,#toast{transition:none}
}
</style>
</head>
<body>
<canvas id="cv" aria-label="墨橋遊戲畫面"></canvas>

<div id="hud" class="hidden">
  <div id="lvl">
    <div id="lvlNo">第一關</div>
    <div id="lvlName">初筆</div>
    <div id="progress"></div>
  </div>
  <div id="inkBox" title="剩餘墨量">
    <span class="lab">墨</span>
    <div id="inkBar"><div class="track"></div><div id="inkFill"></div><i class="tick" id="tk1"></i><i class="tick" id="tk2"></i></div>
    <span id="inkPct">100%</span>
  </div>
  <div id="hint"></div>
  <div id="ctrl">
    <button class="btn" id="bUndo" title="復原上一筆（Z）">復原</button>
    <button class="btn" id="bClear" title="清除全部（R）">清除</button>
    <button class="btn primary" id="bGo" title="放石（空白鍵）">放石</button>
  </div>
</div>

<div id="topRight">
  <button class="icon" id="bSound" aria-label="聲音開關">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button class="icon hidden" id="bPause" aria-label="暫停">
    <svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
  </button>
</div>
<a id="back" href="../index.html">← 遊戲櫃</a>
<div id="toast"></div>

<div class="ov" id="start">
  <div class="wrap">
    <div class="titleRow"><h1>墨橋</h1><img id="titleSeal" alt=""></div>
    <p class="tag">以墨為橋，送一顆石頭下山歸亭。</p>
    <ul class="howto">
      <li>按住<b>拖曳落墨</b>，墨線會成為有重量的實物</li>
      <li>筆走得快，線<b>細而輕、省墨</b>；走得慢，線<b>粗而沉</b></li>
      <li>畫好按「<b>放石</b>」。Z 復原上一筆，Esc 暫停</li>
    </ul>
    <button class="btn primary" id="bStart">開始</button>
    <div id="levelGrid"></div>
    <div class="lvCap">八關 · 餘墨越多，印越多</div>
  </div>
</div>

<div class="ov" id="pause">
  <div class="card">
    <h2>暫歇</h2>
    <div class="sub">墨未乾，石未動</div>
    <div class="row">
      <button class="btn primary" id="bResume">繼續</button>
      <button class="btn" id="bRestartLv">重來此關</button>
      <button class="btn" id="bHome">回到標題</button>
    </div>
  </div>
</div>

<div class="ov" id="clear">
  <div class="card">
    <h2 id="clTitle">過關</h2>
    <div class="sub" id="clSub">第一關 · 初筆</div>
    <div class="stamps" id="stamps"></div>
    <div class="clInk">餘墨 <b id="clInk">0%</b></div>
    <div class="row">
      <button class="btn" id="bRetry">再畫一次</button>
      <button class="btn primary" id="bNext">下一關</button>
    </div>
  </div>
</div>

<div class="ov" id="end">
  <div class="card">
    <h2>歸亭</h2>
    <div class="sub">石已歸亭，墨猶未乾</div>
    <div class="endTotal">共得 <b id="endTotal">0</b> / <span id="endMax">24</span> 印</div>
    <div id="endList"></div>
    <div class="row">
      <button class="btn primary" id="bReplay">重玩</button>
      <button class="btn" id="bEndHome">回到標題</button>
    </div>
  </div>
</div>

<script src="../lib/matter.min.js"></script>

<script>
(() => {
'use strict';
const { Engine, Bodies, Body, Composite, Events } = Matter;
const W = 1000, H = 760, STONE_R = 15, STEP = 1000 / 120;
const qs = new URLSearchParams(location.search);
const DEMO = qs.get('demo') === '1';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEVELS = JSON.parse(document.getElementById('levels').textContent);
const INK = '28,26,24';
const FONT_BRUSH = '"LXGW WenKai TC","Noto Serif TC","Noto Serif CJK TC","Songti TC","STKaiti","KaiTi",serif';
const NUM = ['一','二','三','四','五','六','七','八','九','十'];

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const $ = id => document.getElementById(id);
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }
const easeOut = t => 1 - Math.pow(1 - t, 3);
function densify(arr, step) {
  const out = [];
  for (let i = 0; i < arr.length - 1; i++) {

function impact(x, y, dv) {

// ---------- flow ----------
function release() {
  if (state !== 'edit' || drawing) return;
  audioInit();
  S = buildWorld();
  state = 'sim'; S.acc = 0;
  sfxClick(); updateHud();
}
function stopSim() {
  if (state !== 'sim' && state !== 'failed') return;
  S = null; state = 'edit';
  for (const st of strokes) st.body = null;
  setLoop(AU.rollG || { gain: null }, 0);
  updateHud();
}
function onResult(r) {
  if (r === 'win') {
    state = 'won';
    const ratio = inkLeft / L.ink, stars = ratio >= L.stars[1] ? 3 : ratio >= L.stars[0] ? 2 : 1;
    S.stars = stars; S.ratio = ratio;
    if (!demo.attract) {
      save.best[LI] = Math.max(save.best[LI] | 0, stars);
      save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, LI + 2));
      persist();
    }
    sfxWin(LI === LEVELS.length - 1);
    for (let i = 0; i < (RM ? 10 : 28) && particles.length < 160; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, s = 0.05 + Math.random() * 0.16;
      particles.push({ x: S.stone.position.x, y: S.stone.position.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 0.8 + Math.random() * 2, life: 0, max: 700 + Math.random() * 600, red: Math.random() < 0.25 });
    }
    setTimeout(() => { if (state === 'won' && !demo.attract) showClear(); }, demo.on ? 500 : 900);
    if (demo.attract) demo.after = 1800;
  } else {
    state = 'failed'; fails++;
    sfxFail();
    if (r === 'fall') { const x = clamp(S.stone.position.x, 0, W); for (let i = 0; i < 3; i++) rings.push({ x, y: H - 40 + i * 2, t: -i * 220 }); }
    const msg = r === 'fall' ? ['石落深澗', '墨線再調一調'] : ['石停半途', '路不夠順，再試一次'];
    if (!demo.attract) toast(msg[0], fails >= 3 && L.demo ? '淡墨處，是一種畫法' : msg[1], 1300);
    setTimeout(() => { if (state === 'failed') stopSim(); }, 1300);
    if (demo.on) demo.retry = true;
  }
  updateHud();
}

function makeCloudSprites() {

// ---------- render ----------
let hover = null;
function render(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  if (shake > 0.05) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; shake *= 0.86; ctx.fillStyle = '#f1e9d8'; ctx.fillRect(0, 0, cv.width, cv.height); } else shake = 0;
  if (!L) { ctx.drawImage(bgC, 0, 0); return; }
  ctx.drawImage(lvC, sx * dpr, sy * dpr);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (ox + sx), dpr * (oy + sy));

  if (winds.length) {
    ctx.lineCap = 'round';
    for (const s of winds) {
      const z = s.z, a = Math.sin(s.life * Math.PI);
      const dl = Math.hypot(z.fx, z.fy) || 1, ux = z.fx / dl, uy = z.fy / dl;
      ctx.strokeStyle = `rgba(55,57,62,${0.34 * a})`; ctx.lineWidth = 1.6;

      ctx.quadraticCurveTo(s.x + ux * s.len * 0.5 + uy * s.wob, s.y + uy * s.len * 0.5 - ux * s.wob, s.x + ux * s.len, s.y + uy * s.len); ctx.stroke();
    }
  }
  // clouds
  L.clouds.forEach((c, i) => {
    const p = cloudPos(c, cloudClock), sp = cloudSprites[i]; if (!sp) return;
    ctx.drawImage(sp.c, p.x - sp.w / 2, p.y - sp.h / 2, sp.w, sp.h);
  });

    ctx.setLineDash([2, 9]); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(28,26,24,0.28)'; ctx.lineWidth = 3;
    for (const d of L.demo) { const P = catmull(d.pts, 6); ctx.beginPath(); P.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke(); }
    ctx.setLineDash([]);
  }

  for (const st of strokes) {

    ctx.save();

      const b = st.body; ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
      ctx.translate(st.sp.x - st.bx, st.sp.y - st.by);
    } else ctx.translate(st.sp.x, st.sp.y);

  if (stoneSprite) {

    ctx.save(); ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(28,26,24,0.12)'; ctx.beginPath(); ctx.ellipse(1.5, 3, STONE_R * 1.05, STONE_R * 0.95, 0, 0, 7); ctx.fill();

      ctx.beginPath(); ctx.arc(p.x, p.y, STONE_R + 6 + (RM ? 0 : Math.sin(t * 2.4) * 1.5), 0, 7); ctx.stroke();

  }
  // particles
  for (const q of particles) {
    const a = 1 - q.life / q.max;
    ctx.fillStyle = q.red ? `rgba(184,50,42,${0.7 * a})` : `rgba(${INK},${0.75 * a})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.6 + 0.4 * a), 0, 7); ctx.fill();
  }
  // ripples where the stone fell into the stream
  for (const g of rings) {
    if (g.t < 0) continue;
    const k = g.t / 1300, a = (1 - k) * 0.5;
    ctx.strokeStyle = `rgba(${INK},${a})`; ctx.lineWidth = 1.6 * (1 - k) + 0.4;
    ctx.beginPath(); ctx.ellipse(g.x, g.y, 8 + k * 70, 2 + k * 9, 0, 0, 7); ctx.stroke();
  }
  // demo brush / hover cursor
  const cur = demo.cursor || (state === 'edit' && hover && !drawing ? hover : null) || (drawing && drawing.last && demo.cursor == null ? null : null);
  if (cur) {
    const ok = allowed(cur.x, cur.y, 11);
    if (demo.cursor) drawBrushTip(cur.x, cur.y);
    else { ctx.strokeStyle = ok ? 'rgba(28,26,24,0.55)' : 'rgba(184,50,42,0.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cur.x, cur.y, 6, 0, 7); ctx.stroke();
      if (!ok) { ctx.beginPath(); ctx.moveTo(cur.x - 4, cur.y + 4); ctx.lineTo(cur.x + 4, cur.y - 4); ctx.stroke(); } }
  }
}
function drawBrushTip(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.55);
  ctx.fillStyle = 'rgba(28,26,24,0.92)';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-6, -10, -4, -22); ctx.lineTo(4, -22); ctx.quadraticCurveTo(6, -10, 0, 0); ctx.fill();
  ctx.fillStyle = '#8a6a43'; ctx.fillRect(-3.2, -64, 6.4, 42);
  ctx.fillStyle = '#b8322a'; ctx.fillRect(-3.4, -68, 6.8, 5);
  ctx.restore();
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - last); last = now;
  if (!paused && !hiddenPause) update(dt);
  render(paused || hiddenPause ? 0 : dt);
}
function update(dt) {
  if (!L) return;
  if (state === 'sim' || state === 'won' || state === 'failed') {
    S.acc += dt; let n = 0;
    while (S.acc >= STEP && n < 8) { simStep(S); S.acc -= STEP; n++; }
    if (S.acc > STEP * 4) S.acc = 0;
    if (state === 'sim' && S.result) onResult(S.result);
    // roll sound
    if (AU.ctx) {
      const v = S.stone.velocity, sp = Math.hypot(v.x, v.y);
      setLoop(AU.rollG, S.contact ? clamp(sp * 0.045, 0, 0.42) : 0, 0.05);
      AU.rollLP.frequency.setTargetAtTime(120 + sp * 55, AU.ctx.currentTime, 0.05);
    }
  } else {
    cloudClock += dt;
    if (AU.ctx) setLoop(AU.rollG, 0);
  }
  if (AU.ctx) setLoop(AU.windG, L.winds.length ? 0.05 + 0.03 * Math.sin(performance.now() / 900) : 0, 0.3);
  for (const s of winds) {
    const z = s.z, dl = Math.hypot(z.fx, z.fy) || 1;
    s.life += dt / (1400 / s.sp); s.x += z.fx / dl * s.sp * dt * 0.16; s.y += z.fy / dl * s.sp * dt * 0.16;
    if (s.life >= 1 || s.x < z.x - 20 || s.x > z.x + z.w + 20 || s.y < z.y - 20 || s.y > z.y + z.h) { s.life = 0; s.x = z.x + Math.random() * z.w; s.y = z.y + Math.random() * z.h; }
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > 1300) rings.splice(i, 1); }
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.life += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 0.0004 * dt; q.vx *= 0.99;
    if (q.life > q.max) particles.splice(i, 1);
  }
  tickDemo(dt);
}

// ---------- demo / attract ----------
const demo = { on: false, attract: false, phase: 'idle', timer: 0, cursor: null };
function demoStart(attract) {
  demo.on = true; demo.attract = attract; demo.phase = 'wait'; demo.timer = attract ? 900 : 500; demo.cursor = null; demo.retry = false; demo.after = 0;
  AU.quiet = attract;
}
function demoStop() { demo.on = false; demo.attract = false; demo.cursor = null; demo.phase = 'idle'; AU.quiet = false; }
function tickDemo(dt) {
  if (!demo.on || !L) return;
  if (demo.phase === 'wait') {
    demo.timer -= dt;
    if (demo.timer <= 0 && state === 'edit') {
      strokes = []; inkLeft = L.ink; updateHud();
      demo.list = (L.demo || []).map(d => ({ pts: catmull(d.pts, 3), w: d.w }));
      demo.si = 0; demo.prog = 0; demo.phase = 'draw'; demo.syn = 0; demo.pause = 0;
    }
  } else if (demo.phase === 'draw') {
    if (demo.pause > 0) { demo.pause -= dt; return; }
    const d = demo.list[demo.si];
    if (!d) { demo.phase = 'go'; demo.timer = demo.attract ? 500 : 300; demo.cursor = null; return; }
    const v = speedForWidth(d.w), rate = Math.max(v, demo.attract ? 0.32 : 0.55);
    const prevIdx = Math.floor(demo.prog);
    if (demo.prog === 0) { demo.syn = 0; beginGesture(d.pts[0], 0); }
    demo.prog += dt * rate / 3;
    const idx = Math.min(d.pts.length - 1, Math.floor(demo.prog));
    for (let i = Math.max(1, prevIdx + 1); i <= idx; i++) { demo.syn += 3 / v; addPoint(d.pts[i], demo.syn); }
    demo.cursor = d.pts[idx];
    if (idx >= d.pts.length - 1) { endGesture(); demo.si++; demo.prog = 0; demo.pause = 180; }
  } else if (demo.phase === 'go') {
    demo.timer -= dt; if (demo.timer <= 0) { release(); demo.phase = 'run'; }
  } else if (demo.phase === 'run') {
    if (state === 'won') {
      demo.after -= dt;
      if (demo.attract && demo.after <= 0) { loadLevel(0, { silent: true }); demoStart(true); }
    } else if (state === 'edit' && demo.retry) { demo.retry = false; demo.phase = 'wait'; demo.timer = 300; }
  }
}

// ---------- UI ----------
let toastTimer = 0;
function toast(t, sub, ms) {
  const el = $('toast'); el.innerHTML = t + (sub ? `<small>${sub}</small>` : '');
  el.style.top = (oy + H * sc * 0.22) + 'px';
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 1200);
}
function showHint() { $('hint').textContent = L.hint || ''; $('hint').style.opacity = 1; }
function updateHud(full) {
  if (!L || headless) return;
  if (full) {
    $('lvlNo').innerHTML = `第${NUM[LI]}關 <span style="opacity:.6">/ 八</span>`;
    $('lvlName').textContent = L.name;
    $('tk1').style.left = (L.stars[0] * 100) + '%'; $('tk2').style.left = (L.stars[1] * 100) + '%';
    const pr = $('progress'); pr.innerHTML = '';
    LEVELS.forEach((_, i) => { const e = document.createElement('i'); const b = save.best[i] | 0; if (b) e.className = 'done s' + b; if (i === LI) e.classList.add('cur'); pr.appendChild(e); });
  }
  const r = clamp(inkLeft / L.ink, 0, 1);
  $('inkFill').style.width = (r * 100) + '%';
  $('inkPct').textContent = Math.round(r * 100) + '%';
  const ed = state === 'edit' && !demo.on;
  $('bUndo').disabled = !ed || !strokes.length; $('bClear').disabled = !ed || !strokes.length;
  $('bGo').textContent = state === 'edit' ? '放石' : '收石';
  $('bGo').disabled = demo.on || state === 'won';
}
function showOv(id, on) { $(id).classList.toggle('show', on); }
function buildLevelGrid() {
  const gEl = $('levelGrid'); gEl.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button'); b.className = 'lv' + (i >= save.unlocked ? ' locked' : '') + (i === Math.min(save.unlocked - 1, LEVELS.length - 1) ? ' sel' : '');
    b.innerHTML = `<span class="n">${NUM[i]}</span><span class="ss">${[1, 2, 3].map(k => `<i class="${(save.best[i] | 0) >= k ? 'on' : ''}"></i>`).join('')}</span>`;
    b.title = `第${NUM[i]}關 · ${lv.name}`;
    b.addEventListener('click', () => { audioInit(); sfxClick(); startGame(i); });
    gEl.appendChild(b);
  });
}
let stampImgs = [];
function buildSeals() {
  $('titleSeal').src = makeSeal('墨橋', 64, 9).toDataURL();
  stampImgs = ['過', '佳', '妙'].map((c, i) => makeSeal(c, 64, 20 + i).toDataURL());
  $('stamps').innerHTML = stampImgs.map((src, i) => `<div class="stamp" style="--r:${[-4, 2, 5][i]}deg"><div class="slot"></div><img src="${src}" alt=""></div>`).join('');
}
function showClear() {
  const last = LI === LEVELS.length - 1;
  $('clTitle').textContent = S.stars === 3 ? '妙' : S.stars === 2 ? '佳' : '過關';
  $('clSub').textContent = `第${NUM[LI]}關 · ${L.name}`;
  $('clInk').textContent = Math.round(S.ratio * 100) + '%';
  $('bNext').textContent = last ? '歸亭' : '下一關';
  const els = [...document.querySelectorAll('.stamp')];
  els.forEach(e => e.classList.remove('on'));
  showOv('clear', true);
  els.forEach((e, i) => { if (i < S.stars) setTimeout(() => { e.classList.add('on'); setTimeout(() => { sfxStamp(); if (!RM) shake = 3; }, 230); }, 420 + i * 380); });
  updateHud(true);
  if (demo.on) setTimeout(() => { if (demo.on && state === 'won') nextLevel(); }, 1900);
}
function nextLevel() {
  showOv('clear', false);
  if (demo.on && !demo.attract) { const n = LI + 1 >= LEVELS.length ? 2 : LI + 1; loadLevel(n); demoStart(false); return; }
  if (LI === LEVELS.length - 1) { showEnd(); return; }
  loadLevel(LI + 1);
}
function showEnd() {
  state = 'title';
  const total = save.best.reduce((a, b) => a + (b | 0), 0);
  $('endTotal').textContent = total; $('endMax').textContent = LEVELS.length * 3;
  $('endList').innerHTML = LEVELS.map((lv, i) => `<div>${lv.name}<span>${[1, 2, 3].map(k => `<i class="${(save.best[i] | 0) >= k ? 'on' : ''}"></i>`).join('')}</span></div>`).join('');
  showOv('end', true); $('bPause').classList.add('hidden');
  sfxWin(true);
}
function startGame(i) {
  demoStop();
  showOv('start', false); showOv('end', false); showOv('pause', false); showOv('clear', false);
  $('hud').classList.remove('hidden'); $('bPause').classList.remove('hidden');
  paused = false;
  loadLevel(i);
}
function goHome() {
  showOv('pause', false); showOv('clear', false); showOv('end', false);
  $('hud').classList.add('hidden'); $('bPause').classList.add('hidden');
  paused = false;
  buildLevelGrid(); showOv('start', true);
  loadLevel(0, { silent: true }); demoStart(true);
}
function setPaused(p) {
  if (state === 'title' || $('start').classList.contains('show')) return;
  paused = p; showOv('pause', p);
  if (AU.ctx) { if (p) { setLoop(AU.brushG, 0); setLoop(AU.rollG, 0); setLoop(AU.windG, 0); } }
}

// input
function toWorld(e) { return { x: (e.clientX - ox) / sc, y: (e.clientY - oy) / sc }; }
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (state !== 'edit' || paused || demo.on || drawing) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  beginGesture(toWorld(e), e.timeStamp);
  drawing.pid = e.pointerId;
  if (LI === 0) $('hint').style.opacity = 0.55;
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') hover = toWorld(e); else hover = null;
  if (!drawing || drawing.pid !== e.pointerId) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) addPoint(toWorld(ev), ev.timeStamp);
});
const up = e => { if (drawing && drawing.pid === e.pointerId) { endGesture(); updateHud(); } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover = null; });

$('bStart').addEventListener('click', () => { audioInit(); sfxClick(); startGame(Math.min(save.unlocked - 1, LEVELS.length - 1)); });
$('bUndo').addEventListener('click', undo);
$('bClear').addEventListener('click', clearAll);
$('bGo').addEventListener('click', () => { audioInit(); if (state === 'edit') release(); else if (state === 'sim' || state === 'failed') { sfxSwish(true); stopSim(); } });
$('bSound').addEventListener('click', () => { audioInit(); audioSetOn(!AU.on); sfxClick(); });
$('bPause').addEventListener('click', () => { sfxClick(); setPaused(!paused); });
$('bResume').addEventListener('click', () => { sfxClick(); setPaused(false); });
$('bRestartLv').addEventListener('click', () => { sfxClick(); setPaused(false); loadLevel(LI); });
$('bHome').addEventListener('click', () => { sfxClick(); goHome(); });
$('bRetry').addEventListener('click', () => { sfxClick(); showOv('clear', false); stopSimAfterWin(); });
$('bNext').addEventListener('click', () => { sfxClick(); nextLevel(); });
$('bReplay').addEventListener('click', () => { sfxClick(); startGame(0); });
$('bEndHome').addEventListener('click', () => { sfxClick(); goHome(); });
function stopSimAfterWin() { S = null; state = 'edit'; for (const st of strokes) st.body = null; updateHud(true); }
addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); if ($('clear').classList.contains('show')) return; setPaused(!paused); return; }
  if (paused || $('start').classList.contains('show') || demo.on) { if ((e.key === 'Enter') && $('start').classList.contains('show')) $('bStart').click(); return; }
  const k = e.key.toLowerCase();
  if (k === 'z') { e.preventDefault(); undo(); }
  else if (k === 'r') clearAll();
  else if (k === ' ' || k === 'enter') {
    e.preventDefault();
    if ($('clear').classList.contains('show')) nextLevel();
    else if ($('end').classList.contains('show')) startGame(0);
    else $('bGo').click();
  }
});
document.addEventListener('visibilitychange', () => {
  hiddenPause = document.hidden;
  if (AU.ctx) { if (document.hidden) AU.ctx.suspend().catch(() => {}); else AU.ctx.resume().catch(() => {}); }
  last = performance.now();
});
let rT = 0;
addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(layout, 80); });

// ---------- headless simulate (testing / tuning) ----------
function simulate(i, spec) {
  const keep = { L, LI, strokes, inkLeft, state, S, cloudClock, drawing, fails, gestureId };
  headless = true;
  let out;
  try {
    loadLevel(i);
    const list = spec || LEVELS[i].demo || [];
    for (const d of list) {
      const P = catmull(d.pts, 3), v = speedForWidth(d.w); let t = 0;
      beginGesture(P[0], 0); for (let k = 1; k < P.length; k++) { t += 3 / v; addPoint(P[k], t); } endGesture();
    }
    const used = L.ink - inkLeft, ns = strokes.length;
    const sim = buildWorld();
    const trace = [];
    while (!sim.result && sim.t < 32000) { simStep(sim); if (Math.round(sim.t / STEP) % 30 === 0) trace.push([Math.round(sim.stone.position.x), Math.round(sim.stone.position.y)].concat(sim.bodies.length ? ["b" + Math.round(sim.bodies[0].position.x), Math.round(sim.bodies[0].position.y), sim.bodies[0].angle.toFixed(2)] : [])); }
    out = { level: i, result: sim.result, t: Math.round(sim.t), strokes: ns, inkUsed: Math.round(used), ratio: +(inkLeft / L.ink).toFixed(3), stone: { x: Math.round(sim.stone.position.x), y: Math.round(sim.stone.position.y) }, trace: window.__trace ? trace.join(' ') : undefined, ends: window.__trace ? strokes.map(st => [st.pts[0].x, st.pts[0].y, st.pts[st.pts.length - 1].x, st.pts[st.pts.length - 1].y].map(Math.round).join(',')) : undefined, bodies: window.__trace ? sim.bodies.map(b => [Math.round(b.position.x), Math.round(b.position.y), +b.angle.toFixed(2)]) : undefined };
  } finally {
    headless = false;
    L = keep.L; LI = keep.LI; strokes = keep.strokes; inkLeft = keep.inkLeft; state = keep.state; S = keep.S; cloudClock = keep.cloudClock; drawing = keep.drawing; fails = keep.fails; gestureId = keep.gestureId;
  }
  return out;
}
window.__ink = {
  simulate,
  get state() { return { state, level: LI, strokes: strokes.length, ink: Math.round(inkLeft), paused, demo: demo.on, stone: S ? { x: Math.round(S.stone.position.x), y: Math.round(S.stone.position.y) } : null, result: S ? S.result : null }; },
  start: startGame,
  toScreen: (x, y) => ({ x: ox + x * sc, y: oy + y * sc }),
  demoOf: i => LEVELS[i].demo,
  drawDemo: () => { if (state !== 'edit') return; for (const d of L.demo || []) { const P = catmull(d.pts, 3), v = speedForWidth(d.w); let t = 0; beginGesture(P[0], 0); for (let k = 1; k < P.length; k++) { t += 3 / v; addPoint(P[k], t); } endGesture(); } updateHud(); },
  release: () => release(),
  levels: LEVELS.length
};

// ---------- boot ----------
function boot() {
  $('bSound').classList.toggle('off', !AU.on);
  buildSeals(); buildLevelGrid();
  if (DEMO) {
    $('hud').classList.remove('hidden'); $('bPause').classList.remove('hidden');
    loadLevel(2); demoStart(false);
  } else {
    showOv('start', true);
    loadLevel(0, { silent: true }); demoStart(true);
  }
  requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildSeals(); layout(); }).catch(() => {});
}
boot();
})();
</script>
