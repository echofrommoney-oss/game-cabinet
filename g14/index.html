<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#02040c">
<title>連星</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+TC:wght@300;400;500&display=swap">
<style>
:root{
  --gold:#f2cf86; --gold-2:#d9a648; --gold-soft:rgba(242,207,134,.22);
  --ink:#e9ecf8; --dim:rgba(233,236,248,.64); --faint:rgba(233,236,248,.38);
  --panel:rgba(8,13,32,.78); --panel-2:rgba(14,22,50,.66); --line:rgba(242,207,134,.24);
  --silver:#aebdff; --night:#02040c;
  --serif:"Cormorant Garamond","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --serif-tc:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","Songti TC","PMingLiU","MingLiU","Cormorant Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--serif-tc);font-weight:400;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:crosshair}
#ov.grab{cursor:grabbing}
#ov.hov{cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none;z-index:5}
.brand{pointer-events:none;line-height:1.15;padding-top:2px;transition:opacity .5s}
.brand .t{font-family:var(--serif-tc);font-weight:300;font-size:22px;letter-spacing:.32em;color:var(--gold)}
.brand .s{display:block;font-family:var(--serif);font-size:12.5px;letter-spacing:.12em;color:var(--dim);margin-top:4px;white-space:nowrap}
.btns{display:flex;gap:6px;pointer-events:auto}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(6,10,26,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .25s,border-color .25s,transform .2s}
.ib:hover{background:rgba(242,207,134,.12);border-color:rgba(242,207,134,.5)}
.ib:active{transform:scale(.92)}
.ib svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:rgba(242,207,134,.16);border-color:rgba(242,207,134,.6)}
body.titling .btns .gm{display:none}
body.titling .brand{opacity:0}

/* bottom */
#bottom{position:absolute;left:0;right:0;bottom:max(46px,calc(env(safe-area-inset-bottom) + 40px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;z-index:4;padding:0 14px}
#hint{font-size:14px;letter-spacing:.14em;color:var(--dim);text-align:center;text-shadow:0 1px 8px #000;transition:opacity .4s;line-height:1.6}
#hint b{color:var(--gold);font-weight:500}
#tools{display:flex;gap:8px;pointer-events:auto}
.pill{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:rgba(6,10,26,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);letter-spacing:.12em;font-size:14.5px;color:var(--ink);transition:background .2s,border-color .2s,transform .15s,opacity .2s;white-space:nowrap}
.pill:hover{border-color:rgba(242,207,134,.55)}
.pill:active{transform:scale(.95)}
.pill.pri{background:linear-gradient(180deg,rgba(242,207,134,.28),rgba(217,166,72,.18));border-color:rgba(242,207,134,.7);color:#fff3d6}
.pill.pri[disabled]{opacity:.45;cursor:default}
.pill .n{font-family:var(--serif);font-size:15px;color:var(--gold);margin-left:4px;letter-spacing:.04em}
#back{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:12.5px;letter-spacing:.12em;color:var(--faint);text-decoration:none;z-index:6;transition:color .2s}
#back:hover{color:var(--gold)}
#bTilt{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));z-index:6;height:30px;font-size:12px;padding:0 12px}
#seedTag{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;color:var(--faint);z-index:5;pointer-events:none}
body.touch #seedTag{display:none}

#banner{position:absolute;left:50%;top:max(62px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;letter-spacing:.08em;color:var(--dim);background:rgba(6,10,26,.6);border:1px solid var(--line);border-radius:18px;padding:6px 8px 6px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:calc(100vw - 24px)}
#banner button{font-size:12.5px;color:var(--gold);padding:4px 10px;border-radius:12px;border:1px solid var(--line);letter-spacing:.08em}

#toast{position:absolute;left:50%;top:max(66px,calc(env(safe-area-inset-top) + 60px));transform:translate(-50%,-10px);z-index:9;max-width:min(92vw,520px);text-align:center;font-size:14.5px;letter-spacing:.08em;line-height:1.6;color:#fff6df;background:rgba(10,14,34,.82);border:1px solid rgba(242,207,134,.4);padding:10px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.shared #toast{top:max(112px,calc(env(safe-area-inset-top) + 106px))}
@media (max-width:520px){ body.shared #toast{top:max(150px,calc(env(safe-area-inset-top) + 144px))} }
#toast b{color:var(--gold);font-weight:500}

#ghost{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s;will-change:transform}
#ghost i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,240,205,.75);box-shadow:0 0 18px rgba(242,207,134,.55),inset 0 0 10px rgba(242,207,134,.35)}
#ghost i::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff3d6}
#ghost i.press{animation:press .3s ease-out}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.7)}100%{transform:scale(1)}}

/* screens */
.screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:max(64px,env(safe-area-inset-top)) 16px max(48px,env(safe-area-inset-bottom));animation:fadeIn .5s ease both}
.screen.dim{background:radial-gradient(ellipse at center,rgba(2,4,12,.35),rgba(2,4,12,.78))}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{position:relative;width:min(100%,460px);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 24px 22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);animation:rise .55s cubic-bezier(.2,.8,.2,1) both;scrollbar-width:thin;scrollbar-color:rgba(242,207,134,.3) transparent}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.card h2{font-weight:300;font-size:24px;letter-spacing:.3em;color:var(--gold);text-align:center;margin-bottom:6px}
.card .sub{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--dim);text-align:center;letter-spacing:.06em;margin-bottom:16px}
.card p{font-size:14.5px;line-height:1.85;color:var(--dim);letter-spacing:.05em}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);opacity:.7;margin:10px 0 14px;font-family:var(--serif);font-size:13px;letter-spacing:.3em}
.orn::before,.orn::after{content:"";height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:20px;line-height:1}
.x:hover{color:var(--gold)}

/* title */
#sTitle{background:radial-gradient(ellipse 70% 60% at 50% 46%,rgba(2,4,12,.15),rgba(2,4,12,.6))}
#sTitle .wrap{text-align:center;max-width:520px;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
#sTitle .en{font-family:var(--serif);font-weight:300;font-size:14px;letter-spacing:.62em;color:var(--dim);text-transform:uppercase;margin-left:.62em}
#sTitle h1{font-family:var(--serif-tc);font-weight:300;font-size:clamp(64px,15vw,112px);letter-spacing:.42em;margin:10px 0 2px .42em;color:#f7e2ad;text-shadow:0 0 28px rgba(242,207,134,.45),0 0 80px rgba(242,207,134,.18);line-height:1.1}
#sTitle .tag{font-size:16px;letter-spacing:.2em;color:var(--ink);margin:12px 0 18px;line-height:1.8}
#sTitle ul{list-style:none;display:inline-grid;gap:6px;text-align:left;font-size:13.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:22px;line-height:1.6}
#sTitle li::before{content:"✦";color:var(--gold);margin-right:10px;font-size:10px;vertical-align:2px}
.big{height:50px;padding:0 34px;border-radius:25px;font-size:17px;letter-spacing:.3em;color:#fff4d8;border:1px solid rgba(242,207,134,.75);background:linear-gradient(180deg,rgba(242,207,134,.3),rgba(217,166,72,.14));box-shadow:0 0 30px rgba(242,207,134,.22),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .2s,box-shadow .3s}
.big:hover{box-shadow:0 0 44px rgba(242,207,134,.4),inset 0 1px 0 rgba(255,255,255,.18)}
.big:active{transform:scale(.96)}
.ghostbtn{height:42px;padding:0 20px;border-radius:21px;border:1px solid var(--line);font-size:14px;letter-spacing:.18em;color:var(--ink);background:rgba(6,10,26,.4)}
.ghostbtn:hover{border-color:rgba(242,207,134,.55)}
#sharedNote{margin:0 auto 18px;max-width:480px;text-wrap:balance;font-size:14px;line-height:1.8;letter-spacing:.08em;color:var(--ink);background:rgba(242,207,134,.08);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
#sharedNote b{color:var(--gold);font-weight:500}
#saveNote{font-size:13px;color:var(--faint);letter-spacing:.1em;margin-top:14px}

/* name modal */
label.f{display:block;margin-top:14px;font-size:13px;letter-spacing:.18em;color:var(--dim)}
label.f span{float:right;font-family:var(--serif);color:var(--faint);letter-spacing:.06em}
input.t,textarea.t{width:100%;margin-top:6px;background:rgba(255,255,255,.04);border:1px solid rgba(242,207,134,.28);border-radius:12px;color:#fff6e2;font-family:var(--serif-tc);font-size:17px;letter-spacing:.1em;padding:11px 14px;outline:none;user-select:text;-webkit-user-select:text;transition:border-color .2s,background .2s}
textarea.t{font-size:15px;line-height:1.7;resize:none;height:76px}
input.t:focus,textarea.t:focus{border-color:rgba(242,207,134,.7);background:rgba(255,255,255,.06)}
input.t::placeholder,textarea.t::placeholder{color:rgba(233,236,248,.3)}
#namePreview{display:block;margin:2px auto 0;width:100%;height:120px}

/* ancient */
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.chip{font-size:13px;letter-spacing:.08em;padding:5px 12px;border-radius:14px;border:1px solid var(--line);color:var(--dim)}
.chip.on{color:#fff3d6;border-color:rgba(242,207,134,.75);background:rgba(242,207,134,.14)}
.anc{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--panel-2);border:1px solid rgba(174,189,255,.14);margin-top:10px}
.anc svg{width:96px;height:96px;display:block}
.anc h3{font-weight:500;font-size:16px;letter-spacing:.24em;color:#d9e0ff}
.anc p{font-size:13px;line-height:1.7;margin-top:2px}
.meter{display:flex;align-items:center;gap:8px;margin-top:8px}
.meter i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.meter i b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));border-radius:2px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.meter em{font-style:normal;font-family:var(--serif);font-size:17px;color:var(--gold);min-width:44px;text-align:right}
.anc .go{font-size:12px;letter-spacing:.1em;color:var(--silver);margin-top:6px;padding:2px 0}
.mine{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:4px}
.mine svg{width:84px;height:84px}
.mine .lbl{font-size:13px;color:var(--dim);letter-spacing:.1em;line-height:1.6}
.mine .lbl b{display:block;color:var(--gold);font-size:17px;font-weight:500;letter-spacing:.2em}
.toggle{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--dim);letter-spacing:.1em;margin-top:14px}
.toggle input{accent-color:#d9a648;width:16px;height:16px}

/* end */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.stat{text-align:center;padding:10px 4px;border-radius:12px;background:var(--panel-2);border:1px solid rgba(242,207,134,.12)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--gold);line-height:1.1}
.stat span{font-size:12px;letter-spacing:.14em;color:var(--dim)}
#skyMap{display:block;width:100%;height:auto;border-radius:12px;background:radial-gradient(ellipse at 50% 60%,#0c1838,#03050f);border:1px solid rgba(242,207,134,.14)}
.list{margin-top:12px;display:grid;gap:8px}
.list div{font-size:13.5px;line-height:1.65;color:var(--dim);letter-spacing:.05em;padding-left:12px;border-left:1px solid var(--line)}
.list div b{color:var(--gold);font-weight:500;letter-spacing:.16em;margin-right:8px}
#shareBox{width:100%;margin-top:12px;font-family:var(--serif);font-size:13px;letter-spacing:0;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px;user-select:all;-webkit-user-select:all}
#cardBody .myth{font-size:15px;line-height:1.9;color:var(--ink);text-align:center;letter-spacing:.08em;margin:6px 0 4px}
#cardBody svg{display:block;margin:0 auto;width:150px;height:120px}
#cardBody .m{text-align:center;font-size:13px;color:var(--dim);letter-spacing:.08em;margin-top:6px}
#cardBody .m b{color:var(--gold);font-weight:500}

@media (max-width:520px){
  .card{padding:22px 16px 18px;border-radius:18px}
  .brand .t{font-size:19px}
  .brand .s{font-size:11.5px}
  .ib{width:36px;height:36px}
  .btns{gap:5px}
  #hint{font-size:13px;letter-spacing:.08em}
  .pill{padding:0 13px;font-size:14px}
  .anc{grid-template-columns:76px 1fr;gap:10px;padding:10px}
  .anc svg{width:76px;height:76px}
  .stat b{font-size:25px}
}
@media (max-height:560px){ #sTitle ul{display:none} #sTitle h1{font-size:56px} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important;transition-duration:.01s!important} }
</style>
<script type="importmap">{"imports":{"three":"../lib/three.module.min.js","three/addons/":"../lib/three-addons/","../lib/three.core.min.js":"../lib/three-addons/three.core.min.js"}}</script>
</head>
<body class="titling">
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="ov" aria-label="夜空，點星星連線"></canvas>
  <div id="ghost"><i></i></div>

  <header id="hud">
    <div class="brand"><span class="t">連星</span><span class="s" id="hudInfo">0 個星座</span></div>
    <div class="btns">
      <button class="ib gm" id="bAncient" title="古人的星座" aria-label="古人的星座"><svg viewBox="0 0 24 24"><path d="M5 18 9 8l5 4 5-7"/><circle cx="5" cy="18" r="1.4"/><circle cx="9" cy="8" r="1.4"/><circle cx="14" cy="12" r="1.4"/><circle cx="19" cy="5" r="1.4"/></svg></button>
      <button class="ib gm" id="bShare" title="分享星空" aria-label="分享星空"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg></button>
      <button class="ib gm" id="bJournal" title="今晚的星空" aria-label="今晚的星空"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="m11 7 .7 1.5 1.6.2-1.2 1.1.3 1.6-1.4-.8-1.4.8.3-1.6-1.2-1.1 1.6-.2z"/></svg></button>
      <button class="ib gm" id="bPause" title="暫停（Esc）" aria-label="暫停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
      <button class="ib" id="bSound" title="聲音" aria-label="聲音開關"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path id="sw1" d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path id="sw2" d="M18.5 7a7 7 0 0 1 0 10"/><path id="sx" d="m16 9 5 6m0-6-5 6" style="display:none"/></svg></button>
    </div>
  </header>

  <div id="banner" hidden><span>你正在看別人送的星空</span><button id="bKeep">收下這片星空</button><button id="bMine">回到我的天空</button></div>

  <div id="bottom">
    <div id="hint"></div>
    <div id="tools" hidden>
      <button class="pill" id="bUndo">復原</button>
      <button class="pill" id="bCancel">取消</button>
      <button class="pill pri" id="bDone">完成<span class="n" id="cnt">0/12</span></button>
    </div>
  </div>
  <div id="seedTag"></div>
  <button class="pill" id="bTilt" hidden>傾斜視差</button>
  <a id="back" href="../index.html">← 遊戲櫃</a>
  <div id="toast" role="status" aria-live="polite"></div>

  <section id="sTitle" class="screen">
    <div class="wrap">
      <div class="en">Stellar Threads</div>
      <h1>連星</h1>
      <div class="tag">在夜空裡，連出只屬於你的星座。</div>
      <div id="sharedNote" hidden></div>
      <ul>
        <li>點星星連線，3–12 顆星組成一個星座</li>
        <li>點最後一顆星或按「完成」，取名、寫神話</li>
        <li>拖曳移動星空・滾輪或雙指縮放</li>
        <li>和古人的星座比一比，再把整片天空分享出去</li>
      </ul>
      <div><button class="big" id="bStart">開始連星</button></div>
      <div id="saveNote"></div>
    </div>
  </section>

  <section id="sPause" class="screen dim" hidden>
    <div class="card" style="width:min(100%,340px);text-align:center">
      <h2>暫停</h2>
      <div class="sub">the night can wait</div>
      <div class="row" style="flex-direction:column;align-items:center">
        <button class="big" id="bResume">繼續</button>
        <button class="ghostbtn" id="bPauseEnd">今晚的星空</button>
        <button class="ghostbtn" id="bToTitle">回到標題</button>
      </div>
    </div>
  </section>

  <section id="sName" class="screen" hidden>
    <div class="card">
      <h2>為它命名</h2>
      <div class="sub">every star needs a story</div>
      <svg id="namePreview" viewBox="0 0 200 120"></svg>
      <label class="f" for="inName">名字 <span id="nName">0/12</span></label>
      <input class="t" id="inName" maxlength="12" autocomplete="off" placeholder="例如：遠行的鯨">
      <label class="f" for="inMyth">一句神話 <span id="nMyth">0/40</span></label>
      <textarea class="t" id="inMyth" maxlength="40" placeholder="例如：牠游過的地方，夜色就深了一點。"></textarea>
      <div class="row">

function buildFigure(seq) {

  const es = E.map(([a, b]) => { const p = stars[a], q = stars[b]; const dx = q.x - p.x, dy = q.y - p.y, L2 = dx * dx + dy * dy || 1; return { ax: p.x, ay: p.y, dx, dy, L2, s: 30 + .1 * Math.sqrt(L2) }; });

    const wy = y0 + (py + .5) * step;
    for (let px = 0; px < w; px++) {
      const wx = x0 + (px + .5) * step;
      let f = 0;
      for (const e of es) {

        const ex = e.ax + e.dx * t - wx, ey = e.ay + e.dy * t - wy;

    show('#sTitle', false); document.body.classList.remove('titling'); state = 'play'; updateHud(); updateDraftUI();
    if (viewingShared) flyToAll(); else runDemo();
  } else {
    setupTitle(); updateHud();
    if (viewingShared) flyToAll(true);
    else if (cons.length) { const c = cons[cons.length - 1]; cam.x = c.cx - (MOBILE ? 0 : 200); cam.y = c.cy; clampCam(); }
    else runAttract();
  }
}
function flyToAll(instant) {
  const L = cons.filter(c => !c.dying); if (!L.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; L.forEach(c => uniq(c.seq).forEach(i => { const s = stars[i]; x0 = Math.min(x0, s.x); y0 = Math.min(y0, s.y); x1 = Math.max(x1, s.x); y1 = Math.max(y1, s.y + 90); }));
  const z = clamp(Math.min(W * .8 / (x1 - x0 + 1), H * .7 / (y1 - y0 + 1)), cam.base * .6, cam.base * 1.2);
  if (instant) { cam.x = (x0 + x1) / 2; cam.y = (y0 + y1) / 2; cam.z = z; clampCam(); } else flyTo((x0 + x1) / 2, (y0 + y1) / 2, z, 1.6);
}

window.__g14 = {
  state: () => ({ state, seed, cons: cons.filter(c => !c.dying).map(c => ({ seq: c.seq, name: c.name, myth: c.myth, sim: c.sim, prog: c.prog, demo: !!c.demo })), draft: draft.slice(), cam: { ...cam, fly: !!cam.fly }, viewingShared, stars: stars.length }),
  visibleStars: (m = 60) => stars.map((s, i) => { const [x, y] = w2s(s.x, s.y); return { i, x, y, b: s.b }; }).filter(o => o.x > m && o.y > m + 50 && o.x < W - m && o.y < H - m - 110),
  starScreen: i => w2s(stars[i].x, stars[i].y),
  shareURL, encodeSky, decodeSky,
  simTest: (a, b) => similarity(shapeSamples(a), shapeSamples(b)),
  simRaw: (a, b) => { similarity.raw = true; const r = similarity(shapeSamples(a), shapeSamples(b)); similarity.raw = false; return r; },
  ancients: () => ancients.map(a => ({ name: a.name, seq: a.seq })),
  frameAll: () => { demoToken++; demoRunning = false; ghostOn(false); closeAll(); flyToAll(); $('#toast').classList.remove('show'); },
};
boot();
