<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>回聲</title>
<meta name="description" content="全黑的廢棄地下車站，只能拍手。讓回聲替你畫出牆，耳機裡的聲音告訴你方向。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&text=%E5%9B%9E%E8%81%B2ECHO%E4%BD%A0%E8%B5%B0%E5%87%BA%E4%BE%86%E4%BA%86%E6%9A%AB%E5%81%9C&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --ink:#cfeaf2; --dim:#5f8794; --faint:#2b3f46;
  --cy:#7fe3ff; --cy2:#39d5ff; --gold:#ffcf6b; --mint:#7dffc4; --red:#ff3b5c;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;font-family:var(--sans);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
.ov{position:fixed;pointer-events:none;z-index:1}
#fx{inset:0}
#danger{inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(255,30,60,0) 38%,rgba(255,30,60,.55) 100%)}
#tint{inset:0;opacity:0;background-color:rgba(120,0,20,.45);background-blend-mode:overlay}
button{font-family:inherit;cursor:pointer}

/* screens */
.screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 20px 56px;transition:opacity .7s ease;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,6,10,.5) 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.8) 100%)}
.screen.hidden{opacity:0;pointer-events:none}
.titlewrap{position:relative;display:inline-block;margin-bottom:6px}
h1.title{font-family:var(--serif);font-weight:300;font-size:clamp(68px,15vw,136px);letter-spacing:.32em;margin:0;padding-left:.32em;
  color:#effdff;line-height:1.1;text-shadow:0 0 14px rgba(110,225,255,.75),0 0 46px rgba(57,213,255,.35)}
.titlewrap .echo{position:absolute;inset:0;font-family:var(--serif);font-weight:300;font-size:clamp(68px,15vw,136px);letter-spacing:.32em;padding-left:.32em;
  line-height:1.1;color:transparent;-webkit-text-stroke:1px rgba(127,227,255,.55);animation:echo 3.2s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
.titlewrap .echo.e2{animation-delay:1.06s}.titlewrap .echo.e3{animation-delay:2.13s}
@keyframes echo{0%{transform:scale(1);opacity:.7;filter:blur(0)}100%{transform:scale(1.45);opacity:0;filter:blur(2px)}}
.sub{font-family:var(--serif);letter-spacing:.9em;padding-left:.9em;font-size:13px;color:var(--dim);margin:0 0 22px}
.lead{max-width:420px;font-size:15px;line-height:1.85;color:#a9c9d3;margin:0 0 20px}
.phones{display:flex;align-items:center;gap:12px;justify-content:center;margin:0 0 18px;color:var(--cy);font-size:15px;letter-spacing:.12em}
.phones svg{width:34px;height:34px;filter:drop-shadow(0 0 6px rgba(57,213,255,.6))}
.phones small{display:block;color:var(--dim);letter-spacing:.04em;font-size:12px;margin-top:2px}
.controls{display:grid;grid-template-columns:auto auto;gap:6px 14px;font-size:13px;color:#8fb0bb;margin:0 0 24px;text-align:left}
.controls kbd{font-family:var(--sans);display:inline-block;min-width:22px;padding:1px 7px;border:1px solid #2f4d57;border-radius:4px;color:var(--ink);font-size:12px;background:rgba(127,227,255,.05)}
.btn{background:transparent;border:1px solid rgba(127,227,255,.6);color:#e9fdff;padding:13px 34px;font-size:16px;letter-spacing:.3em;border-radius:999px;
  box-shadow:0 0 18px rgba(57,213,255,.18),inset 0 0 14px rgba(57,213,255,.08);transition:box-shadow .25s,transform .15s,background .25s;padding-left:calc(34px + .3em)}
.btn:hover,.btn:focus-visible{background:rgba(57,213,255,.1);box-shadow:0 0 28px rgba(57,213,255,.45),inset 0 0 18px rgba(57,213,255,.15);outline:none}
.btn:active{transform:scale(.97)}
.btn.ghost{border-color:rgba(127,227,255,.22);color:#8fb0bb;box-shadow:none;font-size:13px;padding:9px 18px;letter-spacing:.1em}
.btnrow{display:flex;flex-direction:column;align-items:center;gap:12px}
.best{margin-top:16px;font-size:12px;color:var(--dim);letter-spacing:.08em;min-height:1em}
.touch-only{display:none}
body.is-touch .touch-only{display:contents}
body.is-touch .key-only{display:none}

/* HUD */
#hud{position:fixed;left:14px;top:12px;z-index:10;pointer-events:none;transition:opacity .5s}
#zlabel{font-size:12px;letter-spacing:.32em;color:var(--dim)}
#zlabel b{color:var(--ink);font-weight:500}
#obj{font-size:13px;margin-top:4px;color:#9fc3cd;letter-spacing:.06em}
#obj b{color:var(--gold);font-weight:500}
#obj.exit b{color:var(--mint)}
#noise{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);letter-spacing:.2em}
#noise .bar{position:relative;width:110px;height:3px;background:rgba(127,227,255,.12);border-radius:2px;overflow:visible}
#noise .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cy2);border-radius:2px;box-shadow:0 0 6px rgba(57,213,255,.7)}
#noise .bar em{position:absolute;top:-3px;bottom:-3px;width:1px;background:rgba(255,59,92,.7);left:62%}
#noise.hot .bar i{background:var(--red);box-shadow:0 0 8px rgba(255,59,92,.8)}
#aware{margin-top:6px;font-size:12px;color:var(--red);letter-spacing:.25em;opacity:0;transition:opacity .4s}
#aware.on{opacity:1;animation:throb 1.4s ease-in-out infinite}
@keyframes throb{50%{opacity:.35}}
#tr{position:fixed;right:10px;top:10px;z-index:40;display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid rgba(127,227,255,.25);background:rgba(0,0,0,.4);color:#bfe9f5;display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:18px;height:18px}
.ib:hover{border-color:rgba(127,227,255,.6)}
.ib.off{color:#4b6670}
#back{position:fixed;left:12px;bottom:10px;z-index:40;font-size:12px;color:#557580;text-decoration:none;letter-spacing:.08em}
#back:hover{color:var(--ink)}
#hint{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:12;pointer-events:none;
  font-size:15px;letter-spacing:.12em;color:#d8f6ff;text-shadow:0 0 10px rgba(57,213,255,.6);opacity:0;transition:opacity .6s;
  white-space:nowrap;max-width:94vw;text-align:center}
#hint.on{opacity:1}
body.is-touch #hint{bottom:auto;top:34%;white-space:normal;width:86vw;line-height:1.6}
#card{position:fixed;left:0;right:0;top:15vh;z-index:15;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;transition:opacity .8s}
#card.on{opacity:1}
#card .n{font-size:12px;letter-spacing:.6em;padding-left:.6em;color:var(--dim)}
#card .t{font-family:var(--serif);font-size:clamp(36px,8vw,58px);letter-spacing:.4em;padding-left:.4em;margin:8px 0 10px;color:#effdff;text-shadow:0 0 18px rgba(57,213,255,.5)}
#card .o{font-size:14px;letter-spacing:.2em;color:#9fc3cd}
#card .o b{color:var(--gold);font-weight:500}
#ctext{position:fixed;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--serif);
  font-size:clamp(26px,6vw,40px);letter-spacing:.5em;padding-left:.5em;color:#ffd0d8;text-shadow:0 0 16px rgba(255,59,92,.8);opacity:0;transition:opacity .3s}
#ctext.on{opacity:1}

/* touch */
#touch{position:fixed;inset:0;z-index:5;display:none}
body.is-touch.playing #touch{display:block}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(127,227,255,.3);opacity:0;transition:opacity .2s;pointer-events:none}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(127,227,255,.18);border:1px solid rgba(127,227,255,.6)}
#joyghost{position:absolute;left:22px;bottom:70px;width:110px;height:110px;border-radius:50%;border:1px dashed rgba(127,227,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#3f5f69;letter-spacing:.2em;pointer-events:none;transition:opacity .3s}
#clapbtn{position:absolute;right:26px;bottom:72px;width:104px;height:104px;border-radius:50%;border:1px solid rgba(127,227,255,.55);
  display:flex;align-items:center;justify-content:center;font-size:17px;letter-spacing:.3em;padding-left:.3em;color:#dff8ff;pointer-events:none;
  background:radial-gradient(circle,rgba(57,213,255,.14),rgba(57,213,255,.02) 70%);box-shadow:0 0 20px rgba(57,213,255,.2);transition:transform .08s,box-shadow .2s}
#clapbtn.hit{transform:scale(.9);box-shadow:0 0 40px rgba(57,213,255,.6)}
#clapbtn.cd{opacity:.5}

/* end */
#end h2{font-family:var(--serif);font-weight:300;font-size:clamp(34px,8vw,54px);letter-spacing:.35em;padding-left:.35em;margin:0 0 6px;color:#fff8ec;text-shadow:0 0 22px rgba(255,214,150,.45)}
#end .rank{color:var(--gold);letter-spacing:.4em;padding-left:.4em;font-size:15px;margin:4px 0 22px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(84px,1fr));gap:10px;margin:0 0 22px;max-width:420px;width:100%}
.stats div{border:1px solid rgba(127,227,255,.16);border-radius:10px;padding:12px 6px;background:rgba(0,10,16,.35)}
.stats b{display:block;font-size:24px;font-weight:400;color:#f2fbff;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--dim);letter-spacing:.2em}
#end .line{font-size:14px;color:#c9d9dc;line-height:1.8;margin:0 0 18px;max-width:400px}
#pause h2{font-family:var(--serif);font-weight:300;letter-spacing:.6em;padding-left:.6em;font-size:34px;margin:0 0 24px}
@media (max-height:640px){.lead{display:none}.phones{margin-bottom:10px}.controls{margin-bottom:14px}}
@media (prefers-reduced-motion:reduce){.titlewrap .echo{animation:none;opacity:0}#aware.on{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="fx"></div><div class="ov" id="danger"></div><div class="ov" id="tint"></div>

<div id="hud" style="opacity:0">
  <div id="zlabel"></div>
  <div id="obj"></div>
  <div id="noise"><span>聲量</span><div class="bar"><i></i><em></em></div></div>
  <div id="aware">牠在聽</div>
</div>
<div id="hint"></div>
<div id="card"><div class="n"></div><div class="t"></div><div class="o"></div></div>
<div id="ctext">牠聽見你了</div>

<div id="touch">
  <div id="joyghost">移動</div>
  <div id="joy"><i></i></div>
  <div id="clapbtn">拍手</div>
</div>

<div id="tr">
  <button class="ib" id="bHp" title="耳機模式（H）" aria-label="耳機模式">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path class="slash" d="M3 3l18 18" style="display:none"/></svg>
  </button>
  <button class="ib" id="bSnd" title="聲音（M）" aria-label="聲音開關">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l5 6M21 9l-5 6" style="display:none"/></svg>
  </button>
  <button class="ib" id="bPause" title="暫停（Esc）" aria-label="暫停">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>
  </button>
</div>
<a id="back" href="../index.html">← 遊戲櫃</a>

<div class="screen" id="start">
  <div class="titlewrap"><h1 class="title">回聲</h1><div class="echo" aria-hidden="true">回聲</div><div class="echo e2" aria-hidden="true">回聲</div><div class="echo e3" aria-hidden="true">回聲</div></div>
  <p class="sub">ECHO</p>
  <p class="lead">廢棄的地下車站，一片漆黑。<br>你只能拍手——讓回聲替你畫出牆，<br>然後在被「聲音的主人」找到之前，走出去。</p>
  <div class="phones">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
    <div style="text-align:left">請戴耳機<small>左右聲道會告訴你方向</small></div>
  </div>
  <div class="controls">
    <span class="key-only"><kbd>空白鍵</kbd></span><span class="key-only">拍手</span>
    <span class="key-only"><kbd>WASD</kbd> <kbd>↑↓←→</kbd></span><span class="key-only">移動（按住 <kbd>Shift</kbd> 放輕腳步）</span>
    <span class="touch-only"><span>左半邊拖曳</span><span>移動（輕推＝放輕腳步）</span><span>右半邊點一下</span><span>拍手</span></span>
  </div>
  <div class="btnrow">
    <button class="btn" id="bStart">戴好了，開始</button>
    <button class="btn ghost" id="bStartNo">沒有耳機：用畫面邊緣提示方向</button>
  </div>
  <div class="best" id="bestline"></div>
</div>

<div class="screen hidden" id="pause">
  <h2>暫停</h2>
  <div class="btnrow">
    <button class="btn" id="bResume">繼續</button>
    <button class="btn ghost" id="bHp2">耳機模式：開</button>
    <button class="btn ghost" id="bRestart">從頭開始</button>
  </div>
</div>

<div class="screen hidden" id="end">
  <h2>你走出來了</h2>
  <div class="rank" id="rank"></div>
  <p class="line" id="endline"></p>
  <div class="stats">
    <div><b id="sTime">0:00</b><span>時間</span></div>
    <div><b id="sClap">0</b><span>拍手</span></div>
    <div><b id="sCaught">0</b><span>被抓</span></div>
  </div>
  <div class="btnrow"><button class="btn" id="bAgain">再走一次</button></div>
  <div class="best" id="bestend"></div>
</div>

<script>
'use strict';
/* ============================================================
   回聲 ECHO — g03
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const QS = new URLSearchParams(location.search);
const DEMO = QS.get('demo') === '1';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const $ = id => document.getElementById(id);

const store = {
  get(k, d) { try { const v = localStorage.getItem('g03.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('g03.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------------- zones ---------------- */
// tile chars: # wall, . floor, _ pit / low barrier (rays pass), D locked door,
// X exit, S start, K item, M lair, W water drip, o round pillar
const ZDEF = [
  { num: '第一區', name: '月台', item: '站務室的鑰匙', short: '鑰匙', icon: 'key', W: 44, H: 22,
    rev: 1.7, revMul: 1.0, speed: 1.75, amb: 140,
    locked: '鐵柵門鎖著——鑰匙在站務室。', got: '拿到鑰匙了。聽，出口那邊的鐘聲。',
    intro: '', demoChaser: [13.5, 10.5],
    build(C, P) {
      C(1, 5, 42, 12);                 // platform
      C(4, 1, 6, 3); C(4, 1, 6, 1, 'X'); C(4, 4, 6, 4, 'D');  // stair shaft + gate
      C(1, 13, 42, 19, '_');           // track pit
      C(5, 15, 36, 17, '#');           // train
      C(14, 15, 14, 17, '_'); C(25, 15, 25, 17, '_');
      C(31, 5, 31, 9, '#'); C(31, 9, 42, 9, '#'); P(31, 6, '.'); P(31, 7, '.'); // booth
      C(35, 6, 37, 6, '#');            // desk (2m aisle below)
      P(40, 7, 'K');
      [9, 15, 21, 27].forEach(x => P(x, 8, 'o'));
      C(11, 5, 12, 5, '#'); C(19, 5, 20, 5, '#'); C(25, 5, 25, 6, '#');
      C(17, 11, 18, 12, '#');
      P(41, 11, 'M'); P(5, 7, 'S');
      P(14, 6, 'W'); P(29, 11, 'W'); P(38, 5, 'W');
    } },
  { num: '第二區', name: '轉乘通道', item: '電源開關', short: '開關', icon: 'switch', W: 36, H: 28,
    rev: 0.8, revMul: 0.65, speed: 2.0, amb: 220,
    locked: '鐵捲門放下來了——要先找到電源開關。', got: '電源接上了。鐵捲門正在升起。',
    intro: '通道很窄，回聲很短。', demoChaser: [15.5, 8.5],
    build(C, P) {
      C(1, 1, 16, 2); C(15, 1, 16, 13); C(15, 1, 31, 2); C(30, 1, 31, 10);
      C(26, 8, 33, 11); P(28, 9, 'o');
      C(8, 3, 9, 9);
      C(3, 12, 24, 13); C(3, 12, 4, 25);
      C(5, 16, 9, 17); C(9, 15, 12, 19);
      C(1, 20, 8, 25);
      C(8, 23, 24, 24); C(23, 12, 24, 24); C(25, 14, 28, 15);
      C(23, 18, 33, 19); C(32, 18, 33, 26); C(32, 22, 33, 22, 'D'); C(32, 25, 33, 26, 'X');
      P(2, 2, 'S'); P(2, 21, 'K'); P(32, 10, 'M');
      P(8, 8, 'W'); P(11, 18, 'W'); P(33, 8, 'W'); P(28, 15, 'W');
    } },
  { num: '第三區', name: '出口大廳', item: '緊急開門拉桿', short: '拉桿', icon: 'lever', W: 40, H: 30,
    rev: 3.0, revMul: 1.6, speed: 2.25, amb: 90,
    locked: '剪票閘門鎖死了——找緊急開門拉桿。', got: '閘門打開了。地面就在上面。',
    intro: '大廳很空曠，回聲傳得很遠。', demoChaser: [27.5, 20.5],
    build(C, P) {
      C(2, 9, 37, 27); C(2, 2, 37, 7); C(2, 8, 37, 8, '_'); C(18, 8, 21, 8, 'D'); C(18, 1, 21, 1, 'X');
      [7, 12, 17, 22, 27, 32].forEach(x => [13, 18, 23].forEach(y => P(x, y, 'o')));
      C(9, 10, 10, 11, '#'); C(2, 14, 3, 16, '#'); C(29, 25, 30, 26, '#');
      C(6, 3, 7, 5, '#'); C(32, 3, 33, 5, '#');
      P(35, 26, 'S'); P(3, 26, 'K'); P(20, 20, 'M');
      P(10, 20, 'W'); P(30, 11, 'W'); P(25, 26, 'W'); P(20, 4, 'W');
    } }
];

function buildZone(i) {
  const d = ZDEF[i];
  const g = [];
  for (let y = 0; y < d.H; y++) g.push(new Array(d.W).fill('#'));
  const C = (x0, y0, x1, y1, ch = '.') => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = ch; };
  const P = (x, y, ch) => { g[y][x] = ch; };
  d.build(C, P);
  const z = { i, def: d, g, W: d.W, H: d.H, drips: [], pillars: [], doorCells: [], exitCells: [], item: null, start: null, lair: null };
  for (let y = 0; y < d.H; y++) for (let x = 0; x < d.W; x++) {
    const c = g[y][x], cx = x + .5, cy = y + .5;
    if (c === 'S') { z.start = { x: cx, y: cy }; g[y][x] = '.'; }
    else if (c === 'K') { z.item = { x: cx, y: cy, got: false, rev: -99, revI: 0 }; g[y][x] = '.'; }

/* ---------------- attract (title screen) ---------------- */
