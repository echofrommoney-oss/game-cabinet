<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#cfe7ee">
<title>紙上小島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf6ec; --paper2:#f3e9d6; --kraft:#e6cfa8; --kraft2:#d6b88c;
  --ink:#4b3f37; --ink2:#85705f; --coral:#e4846f; --coral2:#c96a56; --teal:#3e6c70; --sage:#9cc995;
  --shadow:rgba(80,58,40,.20);
  --font:"Huninn","jf open 粉圓","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --paperTex:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe7ee;font-family:var(--font);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:inherit;color:inherit}
.paper{background-color:var(--paper);background-image:var(--paperTex);background-size:256px}
.btn{border:none;cursor:pointer;border-radius:14px;padding:12px 22px;font-size:17px;letter-spacing:.06em;
  background-color:var(--paper);background-image:var(--paperTex);background-size:256px;
  box-shadow:0 2px 0 #e0d1b8,0 7px 16px var(--shadow);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px) rotate(-.6deg);box-shadow:0 4px 0 #e0d1b8,0 11px 20px var(--shadow)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #e0d1b8,0 3px 8px var(--shadow)}
.btn.primary{background-color:var(--coral);color:#fff8ef;box-shadow:0 3px 0 var(--coral2),0 8px 18px rgba(201,106,86,.35)}
.btn.primary:hover{box-shadow:0 5px 0 var(--coral2),0 12px 22px rgba(201,106,86,.4)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px #d9c7aa;color:var(--ink2)}
.big{font-size:20px;padding:14px 34px}
.hidden{display:none!important}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
#hud > *{pointer-events:auto}
#topL{position:fixed;left:14px;top:12px;display:flex;align-items:center;gap:10px}
#topR{position:fixed;right:12px;top:12px;display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border:none;border-radius:22px;cursor:pointer;
  background-color:var(--paper);background-image:var(--paperTex);background-size:256px;box-shadow:0 2px 0 #e0d1b8,0 6px 14px var(--shadow);font-size:15px}
.chip:active{transform:translateY(1px)}
.iconBtn{width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background-color:var(--paper);background-image:var(--paperTex);background-size:256px;box-shadow:0 2px 0 #e0d1b8,0 6px 14px var(--shadow)}
.iconBtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconBtn:active{transform:translateY(1px)}
#timeBtn canvas{width:34px;height:34px;display:block}
#timeLbl{font-size:15px;min-width:2.6em}
#timeBtn .ff{font-size:12px;color:var(--ink2);margin-left:-2px}
#albumBtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linejoin:round}
#albumBtn{padding:0 14px 0 12px}
#albumBtn.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1)}}
#albumCount{font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);max-width:min(92vw,520px);padding:10px 18px;border-radius:12px;
  background-color:rgba(251,246,236,.96);background-image:var(--paperTex);background-size:256px;box-shadow:0 6px 16px var(--shadow);
  font-size:15px;line-height:1.5;text-align:center;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* drawer */
#drawer{position:fixed;left:50%;bottom:28px;transform:translate(-50%,140%);transition:transform .7s cubic-bezier(.2,1.3,.4,1);
  padding:10px 12px 12px;border-radius:18px;
  background-color:var(--kraft);background-image:var(--paperTex);background-size:256px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 0 var(--kraft2),0 10px 26px rgba(80,58,40,.28)}
#hud.on #drawer{transform:translate(-50%,0)}
#drawer::before{content:"抽屜 · 拖到島上";position:absolute;left:50%;top:-24px;transform:translateX(-50%);padding:4px 14px 6px;font-size:13px;
  border-radius:10px 10px 0 0;background:var(--kraft);color:#7b6046;box-shadow:inset 0 2px 0 rgba(255,255,255,.4);white-space:nowrap}
#drawer.trash{box-shadow:inset 0 0 0 3px var(--coral),0 10px 26px rgba(201,106,86,.35)}
#drawer.trash::before{content:"放開就收回抽屜";background:var(--coral);color:#fff}
#tray{display:flex;gap:8px}
.item{width:78px;border:none;border-radius:12px;padding:6px 2px 6px;cursor:grab;touch-action:none;
  background-color:var(--paper);background-image:var(--paperTex);background-size:256px;
  box-shadow:0 2px 0 #dccbb0,0 4px 8px rgba(80,58,40,.15);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .18s}
.item:hover{transform:translateY(-4px) rotate(-1.5deg)}
.item:active{cursor:grabbing}
.item canvas{width:56px;height:56px;display:block;pointer-events:none}
.item span{font-size:14px;pointer-events:none;white-space:nowrap}
.item.lift{transform:translateY(-8px) scale(.94);opacity:.6}

#back{position:fixed;left:12px;bottom:6px;font-size:12px;color:var(--ink2);text-decoration:none;opacity:.85;z-index:30;
  padding:3px 6px;border-radius:6px;background:rgba(251,246,236,.55)}
#back:hover{opacity:1;text-decoration:underline}

/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.dim{background:rgba(60,52,70,.28);backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(440px,100%);padding:30px 30px 26px;border-radius:6px;
  background-color:var(--paper);background-image:var(--paperTex);background-size:256px;
  box-shadow:0 1px 0 #fff inset,8px 9px 0 -2px #ebdfc6,8px 12px 16px -2px rgba(60,45,30,.16),0 18px 40px rgba(60,45,30,.24),0 2px 6px rgba(60,45,30,.12);transform:rotate(-.8deg)}
.kicker{font-size:13px;letter-spacing:.3em;color:var(--coral2);margin-bottom:6px}
h1{font-size:46px;margin:0 0 8px;letter-spacing:.12em;font-weight:400;line-height:1.15}
h2{font-size:26px;margin:0 0 10px;font-weight:400;letter-spacing:.08em}
.lead{font-size:16px;line-height:1.7;margin:0 0 14px;color:var(--ink)}
.how{list-style:none;padding:0;margin:0 0 20px;font-size:14px;line-height:1.6;color:var(--ink2)}
.how li{padding:5px 0 5px 26px;position:relative;border-top:1px dashed #e0d2bb}
.how li::before{content:"";position:absolute;left:4px;top:11px;width:12px;height:12px;border-radius:3px;background:var(--sage);transform:rotate(12deg);box-shadow:2px 2px 0 rgba(0,0,0,.08)}
.how li:nth-child(2)::before{background:#9fcfdc}.how li:nth-child(3)::before{background:#f2b8a6}
.how b{color:var(--ink);font-weight:400;background:linear-gradient(transparent 60%,#f6dcae 60%)}
.meta{font-size:13px;color:var(--ink2);margin-top:12px;min-height:1em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#start{justify-content:flex-start;padding-left:max(16px,7vw)}
#start .sheet{animation:sheetIn .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(30px) rotate(-4deg)}to{opacity:1;transform:rotate(-.8deg)}}
.small{width:min(340px,100%);text-align:center}
.small .btn{width:100%;margin-top:10px}

#album .book{width:min(900px,100%);max-height:calc(100% - 20px);overflow:auto;padding:24px 26px;border-radius:8px;
  background-color:#f7efe0;background-image:var(--paperTex);background-size:256px;box-shadow:0 20px 50px rgba(50,40,30,.35);position:relative}
#album .head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px;margin-bottom:14px}
#album .head h2{white-space:nowrap;margin:0}
#album .head small{color:var(--ink2);font-size:14px}
#slots{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.slot{border-radius:10px;padding:8px 8px 10px;background:var(--paper);box-shadow:0 2px 0 #e3d4bb,0 5px 12px rgba(70,50,30,.12);min-height:210px;position:relative}
.slot img{width:100%;aspect-ratio:400/260;border-radius:6px;display:block}
.slot h4{margin:8px 2px 4px;font-weight:400;font-size:16px}
.slot p{margin:0 2px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.slot .tag{position:absolute;right:12px;top:12px;font-size:11px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.85);color:var(--ink2)}
.slot.locked .ph{width:100%;aspect-ratio:400/260;border-radius:6px;display:grid;place-items:center;font-size:40px;color:#c8b79c;
  background:repeating-linear-gradient(45deg,#efe4d0 0 10px,#f5ecdc 10px 20px);box-shadow:inset 0 0 0 2px #e4d6bf}
.slot.locked h4{color:#a8977f}

#cardLayer{position:fixed;inset:0;pointer-events:none;z-index:15;perspective:900px}
.dcard{position:absolute;left:0;top:0;width:230px;transform-style:preserve-3d;pointer-events:auto;cursor:pointer}
.dcard .face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:10px 10px 14px;
  background-color:var(--paper);background-image:var(--paperTex);background-size:256px;box-shadow:0 16px 36px rgba(50,35,20,.35)}
.dcard .back{position:absolute;inset:0;transform:rotateY(180deg);background:var(--teal);display:grid;place-items:center;color:#f3e6cc;font-size:22px;letter-spacing:.2em;
  background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.12) 0 30%,transparent 31%),repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px)}
.dcard img{width:100%;border-radius:8px;display:block}
.dcard .k{font-size:12px;letter-spacing:.25em;color:var(--coral2);margin:10px 2px 2px}
.dcard h3{margin:0 2px 6px;font-size:21px;font-weight:400}
.dcard p{margin:0 2px;font-size:13.5px;line-height:1.6;color:var(--ink2)}

#end .sheet{text-align:center;width:min(420px,100%)}
#endImg{width:min(220px,52vw);border-radius:6px;box-shadow:0 10px 24px rgba(40,30,20,.3);margin:6px auto 12px;display:block;transform:rotate(1.5deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 16px}
.stats div{background:#f3e9d6;border-radius:8px;padding:8px 4px;font-size:12px;color:var(--ink2)}
.stats b{display:block;font-size:20px;font-weight:400;color:var(--ink)}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:50;background:#f3e9d6}

@media (max-width:700px){
  #tray{gap:4px}
  .item{width:calc((100vw - 16px - 20px - 28px)/8);padding:4px 0 4px;border-radius:9px}
  .item canvas{width:34px;height:34px}
  .item span{font-size:11px}
  #drawer{padding:8px 10px 9px;bottom:26px;border-radius:14px}
  #drawer::before{font-size:12px;top:-21px}
  .chip{height:40px;font-size:14px}
  .iconBtn{width:40px;height:40px}
  #timeBtn canvas{width:30px;height:30px}
  #topL{left:8px;top:10px}#topR{right:8px;top:10px;gap:6px}
  #toast{top:62px;font-size:14px}
  #start{justify-content:center;align-items:flex-end;padding:16px 16px 40px}
  h1{font-size:38px}
  .sheet{padding:22px 20px 20px}
  #slots{grid-template-columns:repeat(2,1fr);gap:10px}
  #album .book{padding:18px 14px}
  #album .head small{font-size:12px}
  .slot{min-height:0}
  .dcard{width:210px}
  #timeLbl{display:none}
  #timeBtn{padding:0 6px}
}
@media (prefers-reduced-motion: reduce){
  .btn,.item,#drawer{transition:none}
  #start .sheet{animation:none}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="紙上小島 3D 立體書"></canvas>

<div id="hud">
  <div id="topL">
    <button class="chip" id="timeBtn" title="快轉到下一個時段"><canvas id="dial" width="68" height="68"></canvas><span id="timeLbl">白天</span><span class="ff">▸▸</span></button>
  </div>
  <div id="topR">
    <button class="chip" id="albumBtn" title="收藏冊"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg><span id="albumCount">0/8</span></button>
    <button class="iconBtn" id="pauseBtn" title="暫停（Esc）"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <button class="iconBtn" id="soundBtn" title="聲音"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10z"/><g id="sndOn"><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></g><g id="sndOff" style="display:none"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
  </div>
  <div id="drawer"><div id="tray"></div></div>
</div>
<div id="toast"></div>
<div id="cardLayer"></div>

<div id="start" class="overlay">
  <div class="sheet">
    <div class="kicker">一本立體書</div>
    <h1>紙上小島</h1>
    <p class="lead">把房子、樹和燈塔擺上小島，看島上的人們自己過日子。沒有輸贏，只有發現。</p>
    <ul class="how">
      <li>從底部<b>抽屜拖曳</b>紙片到島上；擺好的也能再拖走</li>
      <li><b>拖曳空白處</b>轉動視角，<b>滾輪／雙指</b>縮放</li>
      <li>把合適的東西<b>擺在隔壁</b>，會發生小事件，收進收藏冊</li>
    </ul>
    <button id="startBtn" class="btn primary big">翻開書本</button>
    <div class="meta" id="startMeta"></div>
  </div>
</div>

<div id="pause" class="overlay dim hidden">
  <div class="sheet small">
    <h2>闔上一下</h2>
    <p class="lead" style="margin-bottom:6px">島上的時間停住了。</p>
    <button id="resumeBtn" class="btn primary">繼續</button>
    <button id="restartBtn" class="btn ghost">重新做一座島</button>
  </div>
</div>

<div id="album" class="overlay dim hidden">
  <div class="book">
    <div class="head"><h2>收藏冊</h2><small id="albumSub"></small></div>
    <div id="slots"></div>
    <div style="text-align:center;margin-top:16px"><button id="albumClose" class="btn">回到島上</button></div>
  </div>
</div>

<div id="end" class="overlay dim hidden">
  <div class="sheet">
    <div class="kicker">八個發現都收齊了</div>
    <h2>你的島，印在封面上了</h2>
    <img id="endImg" alt="立體書封面">
    <div class="stats" id="endStats"></div>
    <button id="againBtn" class="btn primary big">再做一座島</button>
  </div>
</div>
<div id="err"><div><h2>這台裝置無法開啟 3D 畫面</h2><p>請換一個支援 WebGL 的瀏覽器再試試。</p></div></div>

<a id="back" href="../index.html">← 遊戲櫃</a>

const save = loadSave();

/* ---------------- 紙紋 ---------------- */
function makePaperCanvas(size = 256, base = 255, grain = 16) {

      x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + 1) * l * .5, py + Math.sin(a + 1) * l * .5, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); });

const paperCanvas = makePaperCanvas();

  document.documentElement.style.setProperty('--paperTex', `url(${c.toDataURL()})`);

/* ---------------- Renderer ---------------- */
const canvas = $('#c');
// 軟體算圖（例如無頭瀏覽器的 SwiftShader）時，一開始就降畫質

setSound(save.sound);
$('#soundBtn').addEventListener('click', () => { initAudio(); setSound(!save.sound); });
$('#pauseBtn').addEventListener('click', togglePause);
$('#resumeBtn').addEventListener('click', () => setPaused(false));
$('#restartBtn').addEventListener('click', restart);
$('#againBtn').addEventListener('click', restart);
$('#startBtn').addEventListener('click', startGame);
$('#albumBtn').addEventListener('click', openAlbum);
$('#albumClose').addEventListener('click', closeAlbum);
$('#album').addEventListener('pointerdown', e => { if (e.target.id === 'album') closeAlbum(); });
$('#timeBtn').addEventListener('click', fastForward);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); if (mode === 'play') togglePause(); }
  else if (mode === 'play' && !paused) {
    if (e.key === 'ArrowLeft') camT.theta += .25; else if (e.key === 'ArrowRight') camT.theta -= .25;
    else if (e.key === 'ArrowUp') camT.phi = clamp(camT.phi - .12, .42, 1.2); else if (e.key === 'ArrowDown') camT.phi = clamp(camT.phi + .12, .42, 1.2);
    else if (e.key === '+' || e.key === '=') zoomT = clamp(zoomT * .88, .5, 1.5); else if (e.key === '-') zoomT = clamp(zoomT * 1.12, .5, 1.5);
    else if (e.key === 't' || e.key === 'T') fastForward();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused) setPaused(true); });
window.addEventListener('resize', resize);

/* ---------------- 自動調整畫質 ---------------- */
let perfAcc = 0, perfN = 0, tierOverride = false, baseTier = 0, frozen = false; const PERF = {};
function applyTier(k) {
  tier = k; const T = TIERS[k];
  renderer.setPixelRatio(T.dpr); resize();
  if (renderer.shadowMap.type !== T.type || sunL.shadow.mapSize.x !== T.sm) {
    renderer.shadowMap.type = T.type; sunL.shadow.mapSize.set(T.sm, T.sm);
    if (sunL.shadow.map) { sunL.shadow.map.dispose(); sunL.shadow.map = null; }
    scene.traverse(m => { if (m.material) (Array.isArray(m.material) ? m.material : [m.material]).forEach(x => x.needsUpdate = true); });
  }
}
function perfWatch(ms) {
  if (tierLock || tierOverride || tier >= TIERS.length - 1 || document.hidden) return;
  perfAcc += ms; perfN++;
  if (perfN >= 45) { const avg = perfAcc / perfN; perfAcc = perfN = 0; if (avg > 38) applyTier(tier + 1); }
}

/* ---------------- 主迴圈 ---------------- */
let last = performance.now(), dialT = 0, idleT = 0;
function update(dt) {
  gameTime += dt;
  for (let i = timers.length - 1; i >= 0; i--) if (gameTime >= timers[i].t) { const tm = timers.splice(i, 1)[0]; tm.r(); }
  for (const fn of [...ticks]) if (fn(dt) === true) ticks.delete(fn);
  if (mode === 'play' || mode === 'opening') {
    if (phaseTarget !== null) { phase += dt * .1; if (phase >= phaseTarget) { phase = phaseTarget; phaseTarget = null; } }
    else phase += dt / DAY_LEN;
    if (phase >= 1) { phase -= 1; if (phaseTarget !== null) phaseTarget -= 1; }
  }
  updateSky();
  // 物件動態
  const t = gameTime;
  for (const o of objects) {
    if (o.type === 'windmill') { o.parts.spin += (1.2 - o.parts.spin) * Math.min(1, dt * .35); o.parts.blades.rotation.z -= o.parts.spin * dt; }
    else if (o.type === 'tree') o.parts.canopy.rotation.z = Math.sin(t * 1.3 + o.group.position.x) * .03;
    else if (o.type === 'lighthouse') o.parts.beam.rotation.y += dt * .9;
  }
  const lh = objects.find(o => o.type === 'lighthouse' && o.cell);
  if (lh) { lh.parts.lamp.getWorldPosition(lhLight.position); lhLight.intensity = nightF * 12; } else lhLight.intensity = 0;
  if (carry) { const o = carry.o; o.group.position.lerp(carry.target, 1 - Math.exp(-dt * 16)); o.stand.rotation.z = Math.sin(t * 6) * .04; }
  for (const v of villagers) v.update(dt, t);
  waves.forEach((w, k) => { w.position.x = Math.sin(t * .7 + w.userData.ph) * .22 * (k % 2 ? -1 : 1); w.position.y = PAGE_Y + Math.sin(t * 1.1 + w.userData.ph) * .02; });
  clouds.forEach(c => { c.position.y = PAGE_Y + Math.sin(t * .5 + c.userData.ph) * .08; c.rotation.y = Math.sin(t * .3 + c.userData.ph) * .12; });
  stars.children.forEach(s => { const target = s.userData.y + (1 - smooth(.3, .9, nightF)) * 9; s.position.y += (target - s.position.y) * Math.min(1, dt * 2); s.visible = s.position.y < s.userData.y + 8.5; s.rotation.y = Math.sin(t * .8 + s.userData.ph) * .5; });
  paperPool.update(dt, t); glowPool.update(dt, t);
  if (mode === 'play') { checkSoon -= dt; if (checkSoon <= 0) { checkSoon = .5; checkRecipes(); } }
  ambientAudio(dt);
  dialT -= dt; if (dialT <= 0) { dialT = .2; drawDial(); $('#timeLbl').textContent = phaseName(); }
  if (mode === 'start') { idleT += dt; camT.theta = closedFrame().theta + Math.sin(idleT * .25) * .12; }
}
function frame(nowT) {
  requestAnimationFrame(frame);
  const raw = nowT - last; const dt = Math.min(.25, raw / 1000); last = nowT;
  perfWatch(raw);
  const t0 = performance.now();
  if (!paused && !frozen) update(dt);
  updateCamera(dt);
  const t1 = performance.now();
  renderer.render(scene, camera);
  PERF.u = t1 - t0; PERF.r = performance.now() - t1; PERF.f = raw;
}
// 初始
drawCover(null); drawTitlePage();
Object.assign(cam, closedFrame()); Object.assign(camT, cam);
resize(); updateSky();
{ const m = $('#startMeta'); const parts = []; if (save.islands) parts.push(`已完成 ${save.islands} 座島`); if (save.best) parts.push(`最快 ${Math.floor(save.best / 60)}:${String(save.best % 60).padStart(2, '0')}`); if (save.album.length) parts.push(`收藏冊 ${save.album.length}/8`); m.textContent = parts.join('　·　'); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawCover(); drawTitlePage(); sheetTitleTex.needsUpdate = true; Object.keys(artCache).forEach(k => delete artCache[k]); });
requestAnimationFrame(t => { last = t; frame(t); });
if (DEMO) { $('#start').classList.add('hidden'); setTimeout(() => openBook(), 250); }

// 測試用掛鉤
window.__g07 = {
  get mode() { return mode; }, get phase() { return phase; }, get paused() { return paused; },
  get objects() { return objects.map(o => ({ type: o.type, i: o.cell && o.cell.i, j: o.cell && o.cell.j })); },
  get found() { return [...run.found]; }, get villagers() { return villagers.length; },
  get visibleVillagers() { return villagers.filter(v => !v.hidden).length; },
  get camTheta() { return cam.theta; }, get zoom() { return zoomT; },
  land() { return LAND.map(c => ({ i: c.i, j: c.j, coast: c.coast })); },
  cellScreen(i, j) { const v = cellPos(i, j).project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight }; },
  setPhase(p) { phase = p; },
  setTier(t) { if (t < 0) { if (tierOverride) { tierOverride = false; applyTier(baseTier); } } else { if (!tierOverride) baseTier = tier; tierOverride = true; applyTier(t); } },
  freeze(f) { frozen = f; },
  _grant(ids) { for (const id of ids) { const R = RECIPES.find(r => r.id === id); if (R) discover(R, new THREE.Vector3(0, GROUND_Y + 1, 0)); } },
};
